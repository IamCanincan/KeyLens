name: Rust CLI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'rust/**'
      - 'docs/RUST-REWRITE.md'
      - '.github/workflows/rust-build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust（nightly + rust-src + 两个 musl target）
        # 发布产物走 `-Z build-std` + `-Cpanic=immediate-abort`（见 rust/build-release.sh）：
        # std 跟着 opt-level=z 重编、panic 的格式化与展开整块去掉，aarch64 产物
        # 652,960 → 326,416 字节。`-Z build-std` 需要 nightly 与 rust-src。
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add --toolchain nightly aarch64-unknown-linux-musl x86_64-unknown-linux-musl

      # 产物选 aarch64-unknown-linux-musl，不选 aarch64-linux-android。理由实测过两条：
      #   1) `rustc --print cfg --target aarch64-linux-android` 里没有 target_feature="crt-static"，
      #      也就是 Android target 默认动态链 bionic —— 下面「Verify static」那道闸（NEEDED=0）
      #      对它永远不可能成立（CI 第一次真跑就是被这个红的：闸门前提与产物互相不认识）。
      #      musl target 默认带 crt-static，产物 NEEDED=0 / 无 INTERP，闸门说的就是产物本来的样子。
      #   2) 真机上跑通的全部证据用的都是这份 musl 产物（device-ab 38 条、device-preview 16 条、
      #      device-run-sync 14 条），换成 android target 反而是把一个没在设备上验过的 flavor 发出去。
      # 所以也不需要 NDK：musl 交叉编译走自带的 rust-lld + link-self-contained。

      - name: Unit tests（b64 / payload / json_flat / keybox / ov_valid / lock / backend）
        run: cargo test --manifest-path rust/Cargo.toml --release

      - name: Build（nightly + build-std + immediate-abort，两份 musl 产物）
        run: sh rust/build-release.sh

      - name: Contract parity（Rust 输出 == webui.sh 的 KL_COMMANDS）
        run: |
          # 提取器必须"看见收尾引号就收手"。以前这里写的是 gsub 三连 + 没有 exit，
          # 于是 KL_COMMANDS 之后的整份 webui.sh 都被当成命令清单（CI 第一次真跑就是被它红的，
          # 报"契约不一致"，expected 里全是注释和函数体）。
          # tests/module-bin.sh 与 rust/parity.sh 用的是同一份带 exit 的版本，这里对齐它们。
          EXPECTED=$(awk '
          /^KL_COMMANDS="/{f=1; sub(/^KL_COMMANDS="/,"")}
          f {
            had = /"$/
            sub(/\\$/,""); sub(/"$/,"")
            printf "%s ", $0
            if (had) exit
          }' module/webui.sh | tr -s ' ' | sed 's/ $//')
          case "$EXPECTED" in
            *'#'*) echo "✗ 提取没在收尾引号处停下（把注释吞进命令清单了）"; exit 1 ;;
          esac
          ACTUAL=$(rust/target/x86_64-unknown-linux-musl/release/keylens contract | sed -n 's/^commands=//p')
          test "$EXPECTED" = "$ACTUAL" || { echo "契约不一致"; echo "expected: $EXPECTED"; echo "actual:   $ACTUAL"; exit 1; }
          echo "契约一致（$(printf '%s' "$ACTUAL" | wc -w) 条命令）"

      - name: Behaviour parity（逐命令与 shell 版逐字节对拍）
        run: sh rust/parity.sh rust/target/x86_64-unknown-linux-musl/release/keylens

      - name: Golden snapshots（删 awk 之后的参照物）
        run: |
          KEYLENS_BIN=rust/target/x86_64-unknown-linux-musl/release/keylens sh tests/rust-golden.sh

      - name: Verify static（aarch64 产物不得依赖任何动态库）
        run: |
          BIN=rust/target/aarch64-unknown-linux-musl/release/keylens
          echo "file: $(file -b "$BIN" | cut -c1-100)"
          needed=$(readelf -d "$BIN" 2>/dev/null | grep -c NEEDED || true)
          interp=$(readelf -l "$BIN" 2>/dev/null | grep -c INTERP || true)
          echo "NEEDED=$needed INTERP=$interp size=$(stat -c %s "$BIN")"
          test "$needed" = "0" || { echo "✗ 仍有动态库依赖（NEEDED=$needed）"; readelf -d "$BIN" | grep NEEDED; exit 1; }
          test "$interp" = "0" || { echo "✗ 仍有 ELF 解释器（不是静态可执行）"; exit 1; }
          echo "✓ aarch64 静态链接（$(stat -c %s "$BIN") 字节）"

      - name: Module binary handshake（包内二进制 contract == KL_COMMANDS）
        run: |
          # ARM 产物在 x86 runner 上跑不了，这里用同源码的 musl 产物做契约检查：
          # 两份二进制来自同一次 cargo build，commands 清单必然一致。
          mkdir -p module/bin
          cp rust/target/x86_64-unknown-linux-musl/release/keylens module/bin/keylens
          chmod +x module/bin/keylens
          sh tests/module-bin.sh
          rm -rf module/bin

      - name: Stage module with binary（module/ + bin/keylens，发布用）
        run: |
          rm -rf stage
          mkdir -p stage
          cp -r module stage/module
          mkdir -p stage/module/bin
          cp rust/target/aarch64-unknown-linux-musl/release/keylens stage/module/bin/keylens
          chmod +x stage/module/bin/keylens
          # 记录二进制指纹，便于装到机器上后核对（比大小更可靠）
          sha256sum stage/module/bin/keylens | awk '{print $1}' > stage/module/bin/keylens.sha256
          du -sh stage/module stage/module/bin/keylens

      - name: Upload module with binary
        uses: actions/upload-artifact@v4
        with:
          name: keylens-module-aarch64
          path: stage/module/
          retention-days: 30

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: keylens-aarch64
          path: rust/target/aarch64-unknown-linux-musl/release/keylens
          if-no-files-found: error
