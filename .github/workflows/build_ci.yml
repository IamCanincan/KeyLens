name: Build CI Module

on:
  push:
    branches: [ "main" ]
    paths:
      - 'module/**' # 触发条件：仅在 module 目录下的文件发生变动时执行
  pull_request:
    branches: [ "main" ]
    paths:
      - 'module/**'
  workflow_dispatch: # 触发条件：允许手动触发工作流

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Shell Syntax Check
        # 语法检查：入口脚本与库文件全部过一遍 sh -n，避免语法错误打进刷机包
        run: |
          fail=0
          for f in module/*.sh module/lib/*.sh module/backends/*.sh \
                   module/META-INF/com/google/android/update-binary; do
            [ -f "$f" ] || continue
            if sh -n "$f"; then
              echo "OK   $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done
          exit $fail

      - name: Watcher Backoff Self-Test
        # 监听退避的自检：source 的就是守护进程用的那份 lib/watch.sh，
        # 并断言 service.sh 里没有第二份内联公式。不需要设备。
        run: sh tests/watch-backoff.sh

      - name: Incremental Sync Self-Test
        # 快照差分模型的语义（新装/卸载/手删不回/重装回来/种子/空列表保护），
        # 测的是 lib/applist.sh 里真实的 build_app_list，只桩外部依赖。不需要设备。
        run: sh tests/sync-incremental.sh

      - name: UI / Command Contract Pairing
        # TAA_API 与 EXPECT_API 是一对手写的号；只改一边时真机上表现为一条
        # "不是同一版"的横幅。这里静态对账两侧的号与命令清单。不需要设备。
        run: sh tests/contract-pair.sh

      - name: WebUI Shape & Syntax Self-Test
        # 从 index.html 原样抽出关键键校验逻辑执行，并检查 call() 已接上它、
        # 超时标记已带到 call()、内联脚本可解析。不需要设备。
        run: node tests/ui-shape.js

      - name: Verified Boot Hash Self-Test
        # 校验/保存/应用三条路径，resetprop 换成计次桩：只接受 64/128 位
        # 十六进制、只补空 hash_alg、读回不一致要报失败。不需要设备。
        run: sh tests/props-boot-hash.sh

      - name: Restore App Self-Test
        # 「把已排除的应用加回名单」：两个后端的写回、已存在不落盘、
        # 结尾换行、TEESim 其它字段保留。用真实 add_target_app。不需要设备。
        run: sh tests/restore-app.sh

      - name: Remove App Self-Test
        # 「从名单里移出」：三个后端的写入、注释/其它字段保留、本来不在返回 1、
        # 会清空返回 3、读取失败返回 2、移出前并入 ever。不需要设备。
        run: sh tests/remove-app.sh

      - name: Sync Empty-List Guard Self-Test
        # 已装读空但基线非空：自动同步必须放弃（rc=2、文件不动、基线不推进）；
        # 手动同步（TAA_EMPTY_OK=1）按当前已装处理。跑两个后端真实的 sync_*。
        run: sh tests/sync-guard.sh

      - name: OhMyKeymint Backend Self-Test
        # scoop 读取/定点替换/其它字段保留/内容一致不落盘/恢复单条/三方冲突矩阵。
        # 用真实的 backend.sh + omk*.awk。不需要设备。
        run: sh tests/omk.sh

      - name: Dynamic Properties Injection
        id: version_info
        run: |
          export TZ="Asia/Shanghai"
          TIME_SUFFIX=$(date +'%Y%m%d%H%M%S')
          NEW_VERSION_CODE=$(date +'%Y%m%d%H%M%S')

          PROP_FILE="module/module.prop"

          # 提取并清理 module.prop 中的 id 与 version 字段
          MOD_ID=$(grep '^id=' "$PROP_FILE" | cut -d= -f2 | tr -d '\r ')
          ORIGINAL_VERSION=$(grep '^version=' "$PROP_FILE" | cut -d= -f2 | tr -d '\r ')
          
          NEW_VERSION="${ORIGINAL_VERSION}-${TIME_SUFFIX}-ci"

          echo "=========================================="
          echo "原始版本名: $ORIGINAL_VERSION"
          echo "注入版本名: $NEW_VERSION"
          echo "注入版本号: $NEW_VERSION_CODE"
          echo "=========================================="

          # 配置 version 属性：字段存在则替换，不存在则追加
          if grep -q '^version=' "$PROP_FILE"; then
            sed -i "s/^version=.*/version=${NEW_VERSION}/" "$PROP_FILE"
          else
            echo "version=${NEW_VERSION}" >> "$PROP_FILE"
          fi

          # 配置 versionCode 属性：字段存在则替换，不存在则追加
          if grep -q '^versionCode=' "$PROP_FILE"; then
            sed -i "s/^versionCode=.*/versionCode=${NEW_VERSION_CODE}/" "$PROP_FILE"
          else
            echo "versionCode=${NEW_VERSION_CODE}" >> "$PROP_FILE"
          fi

          # 将输出写入步骤变量，供后续步骤引用
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "mod_id=${MOD_ID}" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # 设置 Artifact 名称，网页端下载时将作为自动生成的压缩包文件名
          name: ${{ steps.version_info.outputs.mod_id }}-${{ steps.version_info.outputs.version }}
          # 指定上传目标为整个目录，GitHub 会将其内部文件结构直接映射至归档文件的根目录
          path: module/
          retention-days: 30