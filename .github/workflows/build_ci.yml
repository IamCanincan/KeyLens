name: Build CI Module

on:
  push:
    branches: [ "main" ]
    paths:
      - 'module/**' # 命令层与上机界面（webui/src 的产物就落在这里）
      - 'webui/**'  # 界面源码：改了源码却没重新构建，产物自检要能响
      - 'tools/**'  # 构建、部署与闸门脚本
      - 'tests/**'  # 自检套本身
  pull_request:
    branches: [ "main" ]
    paths:
      - 'module/**'
      - 'webui/**'
      - 'tools/**'
      - 'tests/**'
  workflow_dispatch: # 触发条件：允许手动触发工作流

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 自检：全部 tests/*.sh 与全部静态闸门，逐个跑、最后汇总退码 ──────────
  # 为什么改成"循环跑全套"而不是一个套子一个 step：step 清单是手抄的，于是
  # 后来新增的套子（keybox-shape / patch-keywords / omk-apply-scope /
  # teesim-overrides-write / tee-status-read / payload-last-field /
  # omk-validation / teesim-profiles / backend-edit-scope / config-write …）
  # 写完没人再往里加 —— 本地全绿、CI 只跑其中一半，这种"绿"最坏。
  # 单独成 job 的理由：runner 上的 awk 是 mawk，与本机 gawk、设备 toybox awk
  # 三家可能有差异；真差异要看得见，但不该因此把刷机包也卡住不发。
  self-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Shell self-tests（tests/*.sh 全跑）
        # 每个套子自己会打"全部通过 / 有断言失败"并给退码，这里只负责
        # 一个都不漏、并且把失败的套子点名。
        run: |
          fail=0
          for t in tests/*.sh; do
            printf '\n══ %s\n' "$t"
            if sh "$t"; then
              printf 'OK   %s\n' "$t"
            else
              printf 'FAIL %s\n' "$t"
              fail=1
            fi
          done
          exit $fail

      - name: Static gates（界面源码 ↔ 命令层对账）
        # 全是纯静态、不装依赖、不需要设备：
        #   tests/ui-shape.js                     表单字段 ↔ webui.sh 的 case、结构底线
        #   tools/kv-shape-check.mjs              界面读的键 ⊆ 命令层输出的键（含假数据）
        #   tools/md3e-build/icon-gate.mjs        图标名必须在 257 连字子集内
        #   tools/md3e-build/check-artifact.mjs   产物无占位符 / 字体已内联 / 源码可达
        #   tools/json-flat-set-check.cjs         扁平 JSON 定点改写 19 例（含删除）
        run: |
          fail=0
          for g in tests/ui-shape.js tools/kv-shape-check.mjs \
                   tools/md3e-build/icon-gate.mjs tools/md3e-build/check-artifact.mjs \
                   tools/json-flat-set-check.cjs tools/name-residue-check.mjs; do
            printf '\n══ %s\n' "$g"
            if node "$g"; then
              printf 'OK   %s\n' "$g"
            else
              printf 'FAIL %s\n' "$g"
              fail=1
            fi
          done
          exit $fail

      - name: 已知缺口（自报，不算失败）
        # CI 不重建产物：构建要 npm install（esbuild + MD3E 包）。所以"产物与源码
        # 是否同版"只能靠本地 `node tools/md3e-build/build.mjs --check`
        # （webui/dist 与 module/webroot 两条都比）加 check-artifact 的
        # "每个源码文件都从入口可达"来兜。这里把它印出来，免得以后以为 CI 查过了。
        run: |
          echo "::notice title=CI 不重建界面产物::新鲜度靠本地 build.mjs --check；CI 只查产物自身的形状"
          echo "上机产物：$(wc -c < module/webroot/index.html) 字节"
          grep -o 'EXPECT_API *= *[0-9]*' webui/src/bridge.js | head -1
          grep -o '^KL_API=[0-9]*' module/webui.sh | head -1

  # ── 打包：语法检查 + 版本号注入 + 上传 Artifact ─────────────────────────
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Shell Syntax Check
        # 语法检查：入口脚本与库文件全部过一遍 sh -n，避免语法错误打进刷机包
        run: |
          fail=0
          for f in module/*.sh module/lib/*.sh module/backends/*.sh \
                   module/META-INF/com/google/android/update-binary; do
            [ -f "$f" ] || continue
            if sh -n "$f"; then
              echo "OK   $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done
          exit $fail

      - name: Dynamic Properties Injection
        id: version_info
        run: |
          export TZ="Asia/Shanghai"
          TIME_SUFFIX=$(date +'%Y%m%d%H%M%S')
          NEW_VERSION_CODE=$(date +'%Y%m%d%H%M%S')

          PROP_FILE="module/module.prop"

          # 提取并清理 module.prop 中的 id 与 version 字段
          MOD_ID=$(grep '^id=' "$PROP_FILE" | cut -d= -f2 | tr -d '\r ')
          ORIGINAL_VERSION=$(grep '^version=' "$PROP_FILE" | cut -d= -f2 | tr -d '\r ')
          
          NEW_VERSION="${ORIGINAL_VERSION}-${TIME_SUFFIX}-ci"

          echo "=========================================="
          echo "原始版本名: $ORIGINAL_VERSION"
          echo "注入版本名: $NEW_VERSION"
          echo "注入版本号: $NEW_VERSION_CODE"
          echo "=========================================="

          # 配置 version 属性：字段存在则替换，不存在则追加
          if grep -q '^version=' "$PROP_FILE"; then
            sed -i "s/^version=.*/version=${NEW_VERSION}/" "$PROP_FILE"
          else
            echo "version=${NEW_VERSION}" >> "$PROP_FILE"
          fi

          # 配置 versionCode 属性：字段存在则替换，不存在则追加
          if grep -q '^versionCode=' "$PROP_FILE"; then
            sed -i "s/^versionCode=.*/versionCode=${NEW_VERSION_CODE}/" "$PROP_FILE"
          fi

          # 将输出写入步骤变量，供后续步骤引用
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "mod_id=${MOD_ID}" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # 设置 Artifact 名称，网页端下载时将作为自动生成的压缩包文件名
          name: ${{ steps.version_info.outputs.mod_id }}-${{ steps.version_info.outputs.version }}
          # 指定上传目标为整个目录，GitHub 会将其内部文件结构直接映射至归档文件的根目录
          path: module/
          retention-days: 30
