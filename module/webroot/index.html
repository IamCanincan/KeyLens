        : ((st.teesim_enabled === '1' || st.tricky_enabled === '1' || st.backend === 'omk') ? 'ok' : 'bad'))
  ]));
  about.appendChild(grp('外观', [
    blk('取色', THEME.frroOk ? '系统 overlay'
        : (THEME.seedSrc !== 'none' ? '系统设置' : '平台默认'),
      (THEME.frroOk || THEME.seedSrc !== 'none') ? 'ok' : 'na'),
    blk('字体', THEME.fontFile ? '系统字体文件'
        : (THEME.font ? '族名 ' + THEME.font : 'WebView 默认'),
      THEME.fontFile ? 'ok' : (THEME.font ? 'warn' : 'na')),
    blk('深浅', '跟随系统 → ' + (resolveScheme() === 'dark' ? '深色' : '浅色'), 'ok'),
    blk('生效值', THEME.applied || '—')
  ]));

  var paths = el('div', 'paths');
  [['模块目录', MODDIR], ['命令层', env.webui_sh || (MODDIR + '/webui.sh')],
   ['数据目录', st.data_dir || '—'], ['目标文件', st.target_file || '—'],
   ['日志文件', st.log_file || '—'],
   ['上次命令', CALL_LOG.cmd + ' · ' + CALL_LOG.ms + 'ms' + (CALL_LOG.at ? ' · ' + CALL_LOG.at : '')]]
   .forEach(function (pair){
    var row = el('div', 'path-row');
    row.appendChild(el('span', 'path-k', pair[0]));
    var v = el('span', 'path-v mono', pair[1]);
    v.title = String(pair[1]);
    row.appendChild(v);
    paths.appendChild(row);
  });
  about.appendChild(paths);

}

/* 两份列表一起取：概览的数字、应用页的对照全靠它们，取一次各页共用 */
/* 「手动排除」的包名。同步过一次之后，已装却不在目标文件里的就只可能是你删的；
   命令层按基线现算，界面只负责显示。没有这条能力就不问 —— 契约里的 commands
   就是给这种"新界面 + 旧命令层"的组合用的。 */
function hasCmd(name){
  return (' ' + (S.contract.commands || '') + ' ').indexOf(' ' + name + ' ') >= 0;
}
function loadExcluded(){
  /* 与 boot hash 同理：深链进应用页时可能还没拿到 commands，短路过一次就永远
     缺这份数据。旧命令层会直接报未知命令，按空处理即可。 */
  if (S.contract.checked && !hasCmd('excluded')) return Promise.resolve(false);
  return call('excluded').then(function (r){
    var m = {};
    if (r.ok) split(r.text).forEach(function (p){ if (p) m[p] = 1; });
    S.excluded = m;
    return true;
  }, function (){ return false; });
}

function loadLists(){
  return Promise.all([call('targets'), call('apps')]).then(function (rs){
    S.targets = rs[0].ok ? split(rs[0].text) : [];
    S.apps = rs[1].ok ? split(rs[1].text) : [];
    S.targetSet = null;                                   // 目标集合要重算
    if (!rs[0].ok && rs[0].code !== 1) snackbar(failText(rs[0]), 'bad');
    /* 排除名单跟列表一起取；取不到就当空（界面退化成只显示「未生效」） */
    return loadExcluded().then(function (){ return rs; });
  });
}

/* 图标与显示名取自桌面自己的缓存（webui.sh icons 把 PNG 导进 webroot/icons/）。
   先画行、后补图标：这一步慢或压根没有缓存时，列表仍然是完整可读的，
   不该让一整页应用等一次 sqlite。 */
/* 一批最多问 120 个（SQL 里是 120 条 or 子句，一次 sqlite 调用整批处理）。
   分批不等于可以丢：以前问满 120 就把剩下的静默丢掉，实测 125 个目标的列表里
   osu!、哔哩哔哩 因为排在尾巴上就一直没图标，列表越长丢得越多。 */
var ICON_BATCH = 120;
function loadIcons(pkgs){
  var todo = [], i;
  for (i = 0; i < pkgs.length && todo.length < ICON_BATCH; i++) {
    if (S.iconAsked[pkgs[i]]) continue;
    S.iconAsked[pkgs[i]] = 1;
    todo.push(pkgs[i]);
  }
  if (!todo.length) return Promise.resolve(false);
  return call('icons', todo.join(',')).then(function (r){
    if (!r.ok) return false;
    split(r.text).forEach(function (line){
      var f = line.split('\t');
      if (f.length >= 3 && f[0]) S.icons[f[0]] = { label: f[1] || '', src: f[2] };
    });
    /* 这一批问完，如果还有没问过的就接着问下一批。递归一定会停：
       每轮都往 S.iconAsked 里加，todo 为空时直接返回。 */
    return loadIcons(pkgs).then(function (){ return true; });
  });
}

function ensureIcons(pkgs){
  return loadIcons(pkgs).then(function (got){
    if (!got) return;
    if (S.tab === 'apps') renderApps();
    });
}
function loadLog(){
  return call('log', String(S.tail)).then(function (r){
    S.log = r.ok ? split(r.text) : [];
    return r;
  });
}
function loadBootHash(){
  /* 深链直接进属性页时，这一趟可能跑在 contract 回来之前，所以只有"已经确认
     命令层没有它"才短路；否则先问，命令层没有时会报未知命令，按没有处理。 */
  if (S.contract.checked && !hasCmd('boot-hash')) { S.boot = null; return Promise.resolve(false); }
  return call('boot-hash').then(function (r){
    if (!r.ok) { S.boot = null; return false; }
    var kv = parseKV(r.text);
    S.boot = { configured: kv.configured || '', current: kv.current || '', status: kv.status || 'unset' };
    return true;
  }, function (){ S.boot = null; return false; });
}
function loadProps(){
  var rows = call('props').then(function (r){
    S.props = r.ok ? split(r.text).map(function (line){
      var c = line.split('\t');
      return [c[0] || '', c[1] || '', c[2] || '', c[3] || ''];
    }) : [];
    return r;
  });
  /* boot hash 是独立命令：旧命令层没有它时能力门直接关掉，不影响属性表 */
  var boot = loadBootHash();
  return Promise.all([rows, boot]).then(function (a){ return a[0]; });
}
function split(text){
  return String(text == null ? '' : text).split('\n').filter(function (l){ return l.length > 0; });
}

/* 某一页还缺什么：lists 三页共用，log/props 各自独立。
   两条链并发时（连点两次「重新读取」）要共用同一个在途请求，
   并且只在成功后才记「已加载」——否则第二条链会以为数据到手、把空列表画出来。 */
var inflight = {};
/* 返回值 = 这一趟有没有真的取数。调用方据此决定要不要重画 ——
   切回一个已经画过的页面时这里什么都不取，重画只会把整张列表再建一遍。 */
function ensure(tab){
  /* 「关于」不取自己的数：那一页全是界面自检（status / env / THEME / 桥接），
     基础链已经取过。写成 tab 会被下面那条三元当成 props 去读属性表。 */
  if (tab === 'about') return Promise.resolve(false);
  var need = (tab === 'apps' || tab === 'over') ? 'lists' : tab;
  if (S.loaded[need]) return Promise.resolve(false);
  if (inflight[need]) return inflight[need];

  var p = need === 'lists' ? loadLists() : (need === 'log' ? loadLog() : loadProps());
  inflight[need] = p.then(function (r){ S.loaded[need] = true; inflight[need] = null; return true; },
                         function (e){ inflight[need] = null; throw e; });
  return inflight[need];
}

function renderAll(){
  renderHero();
  if (S.tab === 'over') renderOver();
  else if (S.tab === 'apps') renderApps();
  else if (S.tab === 'log') renderLog();
  else if (S.tab === 'props') renderProps();
  else if (S.tab === 'about') renderAbout();
}

/* S.seq：连点两次「重新读取」时，先回来的那次不能把后回来的覆盖掉 */
function runChain(withBase, quiet){
  var seq = ++S.seq;
  /* quiet：不盖整屏遮罩。切页时数据通常已经缓存好，这一趟什么也不取，
     遮罩却会把整页压暗一帧 —— 那就是「切一下整个页面闪一下」的来源。
     遮罩只属于真的要取数的时候（首次进入某一页、显式刷新、写操作）。 */
  if (!quiet) busy(true, '读取中');

  var chain;
  if (withBase) {
    S.loaded = {};                                  // 整份刷新：列表缓存一并作废
    S.iconAsked = {};                               // 图标问过的名单也重开：新装的应用该被认出来
    /* 列表随基础信息一起取：英雄卡的三个数字在任何一页都要显示，
       以前只按当前页懒加载，进「日志」页时英雄卡就是一片 —，看着像坏了。 */
    chain = Promise.all([loadStatus(), loadEnv(), ensure(S.tab === 'log' || S.tab === 'props' ? 'lists' : S.tab)]);
  } else {
    chain = Promise.resolve();
  }

  var failed = false;
  chain.then(function (){ return ensure(S.tab); })
    .catch(function (e){ failed = true; if (seq === S.seq) snackbar(String((e && e.message) || e), 'bad'); })
    .then(function (got){
      if (!quiet) busy(false);                      // 迟到也要配平，否则遮罩永远关不掉
      if (seq !== S.seq || busyCount > 0) return;   // 有更新的请求在跑，让它来画
      /* 只在真的取到数时重画：点底栏切页时 showTab 已经用缓存画完了，
         这里再画一遍就是同一次点击里把列表建两次（实测 130 行 × 2）。
         失败也要画一次：否则状态行会永远停在「读取中…」。 */
      if (withBase || got || failed) renderAll();
      if (S.env.root_user && S.env.root_user !== '0') snackbar('exec 不是 root（uid ' + S.env.root_user + '）', 'bad');
    });
}

function refresh(){ runChain(true); }
function loadTab(){
  /* 切页一律不盖整屏遮罩：那层 45% 的黑一压一收，看就是"整个页面闪一下"。
     首次进某页确实要取数，就在该页自己的状态行里写「读取中…」——反馈留在页面内。 */
  var need = (S.tab === 'apps' || S.tab === 'over') ? 'lists' : S.tab;
  if (!S.loaded[need]) {
    if (need === 'log') logStat.textContent = '读取中…';
    else if (need === 'props') propsStat.textContent = '读取中…';
  }
  runChain(false, true);
}

/* =========================================================
   5. 写操作
   ========================================================= */
function b64(str){
  var bytes = new TextEncoder().encode(str), bin = '', chunk = 8192;
  for (var i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}

/* 写操作之后统一收口：缓存全部作废、重取、重画 */
function reloadAll(){
  S.loaded = {};
  S.iconAsked = {};
  return Promise.all([loadStatus(), loadEnv()]).then(function (){ return ensure(S.tab); });
}

function finishWrite(note){
  busy(false);
  renderAll();
  if (note.text) snackbar(note.text, note.tone);
}

function doSync(){
  busy(true, '同步中');
  var note = { text: '', tone: 'info' };
  call('sync').then(function (r){
    if (r.ok) {
      var kv = parseKV(r.text);
      note.text = kv.rc === '1' ? '内容一致，无需写入（' + kv.count + ' 个应用）' : '已写入 ' + kv.count + ' 个应用';
      note.tone = kv.rc === '2' ? 'bad' : 'ok';
    } else { note.text = failText(r); note.tone = 'bad'; }
    return reloadAll();
  }).catch(function (e){ note.text = String((e && e.message) || e); note.tone = 'bad'; })
    .then(function (){ finishWrite(note); });
}



function setPropsMasking(want){
  busy(true, '写入开关');
  var note = { text: '', tone: 'info' };
  call(want === 'off' ? 'props-off' : 'props-on').then(function (r){
    if (r.ok) {
      note.text = want === 'off' ? '已关闭开机属性伪装（本次开机内已写入的值不变）' : '已恢复开机属性伪装';
      note.tone = 'ok';
    } else { note.text = failText(r); note.tone = 'bad'; }
    return reloadAll();
  }).catch(function (e){ note.text = String((e && e.message) || e); note.tone = 'bad'; })
    .then(function (){ finishWrite(note); });
}

function applyPropsNow(){
  busy(true, '写入属性');
  var note = { text: '', tone: 'info' };
  call('props-apply').then(function (r){
    if (r.ok) {
      var kv = parseKV(r.text);
      note.text = kv.mismatch === '0' ? '已全部写入期望值' : '仍有 ' + kv.mismatch + ' 项不符（静态字段要重启才刷新）';
      note.tone = kv.mismatch === '0' ? 'ok' : 'warn';
    } else { note.text = failText(r); note.tone = 'bad'; }
    return reloadAll();
  }).catch(function (e){ note.text = String((e && e.message) || e); note.tone = 'bad'; })
    .then(function (){ finishWrite(note); });
}

function clearLog(){
  busy(true, '清空');
  var note = { text: '', tone: 'info' };
  call('clear-log').then(function (r){
    if (r.ok) { note.text = '日志缓冲已清空'; note.tone = 'ok'; S.logSig = ''; }
    else { note.text = failText(r); note.tone = 'bad'; }
    return reloadAll();
  }).catch(function (e){ note.text = String((e && e.message) || e); note.tone = 'bad'; })
    .then(function (){ finishWrite(note); });
}

/* boot hash：先按同一套规则在本地挡一次，避免把明显错的串发到命令层 */
function bootHashInput(){
  /* 粘贴来源（文本文件、报告页）常带换行或空格，和命令行层一样全部剔掉 */
  return String(bhInput.value || '').replace(/\s+/g, '').toLowerCase();
}
function saveBootHash(){
  var s = bootHashInput();
  if (!/^[0-9a-f]{64}$/.test(s) && !/^[0-9a-f]{128}$/.test(s)) {
    snackbar('哈希必须是 64 或 128 位十六进制；已保存的值没有改动', 'bad');
    return;
  }
  busy(true, '保存哈希');
  var note = { text: '', tone: 'info' };
  call('props-boot-hash', s).then(function (r){
    if (r.ok) {
      var kv = parseKV(r.text);
      note.text = kv.applied === '1' ? '已保存并写入本次运行' : '已保存，但属性读回不一致（重启后再看）';
      note.tone = kv.applied === '1' ? 'ok' : 'warn';
      bhInput.value = '';
    } else { note.text = failText(r); note.tone = 'bad'; }
    return reloadAll();
  }).catch(function (e){ note.text = String((e && e.message) || e); note.tone = 'bad'; })
    .then(function (){ finishWrite(note); });
}
function clearBootHash(){
  busy(true, '清除哈希');
  var note = { text: '', tone: 'info' };
  call('props-boot-hash', '-').then(function (r){
    if (r.ok) {
      note.text = '已清除：下次开机不再写 digest（本次运行里的值重启后回原样）';
      note.tone = 'ok';
    } else { note.text = failText(r); note.tone = 'bad'; }
    return reloadAll();
  }).catch(function (e){ note.text = String((e && e.message) || e); note.tone = 'bad'; })
    .then(function (){ finishWrite(note); });
}

/* 把「已排除」的行加回名单：等价于手动写回目标文件 */
function restoreApp(pkg){
  busy(true, '恢复');
  var note = { text: '', tone: 'info' };
  call('restore-app', pkg).then(function (r){
    if (r.ok) {
      var kv = parseKV(r.text);
      note.text = kv.restored === '1' ? '已加入目标名单：' + pkg : '它已经在目标名单里';
      note.tone = 'ok';
    } else { note.text = failText(r); note.tone = 'bad'; }
    return reloadAll();
  }).catch(function (e){ note.text = String((e && e.message) || e); note.tone = 'bad'; })
    .then(function (){ finishWrite(note); });
}

/* 确认对话框 */
function confirm(title, text, okLabel){
  return new Promise(function (resolve){
    var d = document.getElementById('dialog');
    dlgTitle.textContent = title;
    dlgText.textContent = text;
    dlgOk.textContent = okLabel || '确定';
    d.hidden = false;
    function close(v){
      d.hidden = true;
      dlgOk.removeEventListener('click', yes);
      dlgCancel.removeEventListener('click', no);
      d.removeEventListener('click', backdrop);
      resolve(v);
    }
    function yes(){ close(true); }
    function no(){ close(false); }
    function backdrop(e){ if (e.target === d) close(false); }
    dlgOk.addEventListener('click', yes);
    dlgCancel.addEventListener('click', no);
    d.addEventListener('click', backdrop);
    dlgOk.focus();
  });
}

/* =========================================================
   6. 交互装配
   ========================================================= */
var homeMenu = document.getElementById('homeMenu');
var btnBack = document.getElementById('btnBack');
var PAGES = ['over', 'apps', 'log', 'props', 'about'];
var TAB_LABEL = { over: '概览', apps: '应用列表', log: '运行日志',
  props: '系统属性伪装', about: '关于与自检' };
/* 只切状态：显隐目标页、标题、返回箭头、概览的英雄卡。
   底栏没有了，这一层不再需要维护任何选中态。 */
function applyPage(name){
  S.tab = name;
  if (name !== 'apps' && S.selectMode) { S.selectMode = false; S.selected = {}; updateBulkBar(); }
  var home = name === 'over';
  PAGES.forEach(function (k){
    var el = document.getElementById('p-' + k);
    if (el) el.hidden = k !== name;
  });
  var pageTitle = document.getElementById('pageTitle');
  if (pageTitle) pageTitle.textContent = TAB_LABEL[name] || name;
  hero.hidden = !home;        // 二级页不重复英雄卡：那一屏只有标题 + 内容
  btnBack.hidden = home;
  document.querySelector('.appbar').classList.toggle('is-sub', !home);
}
/* 切页只滑自己的面板：不滚、不动容器高度、不做任何插值。
   入场从进入的方向滑进来（下钻 +1 从右、返回 -1 从左）：位移 24px
   （窄屏按 5% 收，320 下 16px）、透明度 0.9→1、200ms，全在合成器上 ——
   不碰高度、不盖遮罩，所以不会回到「闪」。返回概览时英雄卡一起滑，
   否则它会硬蹦出来。 */
var REDUCE_MOTION = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function pageSlide(el, dir){
  if (!el || !el.animate || REDUCE_MOTION) return;
  var dx = Math.min(24, Math.round((window.innerWidth || 626) * .05)) || 12;
  el.animate(
    [{ transform: 'translateX(' + (dir * dx) + 'px)', opacity: .9 },
     { transform: 'translateX(0)', opacity: 1 }],
    { duration: 200, easing: 'cubic-bezier(.2,0,0,1)' }
  );
}
function showTab(name, back){
  var prev = S.tab;
  var home = name === 'over';
  /* 概览的滚动位置：下钻前记下，回来时还原 —— 不把人丢回顶部 */
  if (prev === 'over' && !home) S.homeY = window.scrollY;
  var dir = back ? -1 : 1;
  applyPage(name);
  renderAll();
  /* 回概览要还原位置时先强制按新页面布局，否则 scrollTo 拿到的还是上一页的
     高度，会被夹成 0（实测 52 → 0）。回 0 和其它页不需要这一步。 */
  if (home && S.homeY) void document.documentElement.scrollHeight;
  window.scrollTo(0, home ? (S.homeY || 0) : 0);
  if (prev === name) return;
  pageSlide(document.getElementById('p-' + name), dir);
  if (home) pageSlide(hero, dir);
}

/* 导航状态写在地址栏的 hash 上（#/over、#/apps…），顶栏箭头与 popstate
   合成一条路。
   宿主的返回是怎么决定的（dex 实测）：WebViewClient.doUpdateVisitedHistory 里读
   webView.canGoBack() 写进一个状态，返回回调里执行 webView.goBack()。hash 跳转
   下"回到概览"是通的。
   ⚠ 我一度拿一条 {m=CLOSE WebUIActivity} 的 logcat 断言"边缘返回退不了级"，那是
   过度推断：日志只证明那次关闭发生过，证明不了当时停在二级页。据此做的整文档
   跳转（每次换 URL 重载 + 一层缓存）已经回退，见 CHANGELOG。
   真正缺的不是"退级"，是安卓的可预测预览：那要宿主实现 OnBackAnimationCallback
   并驱动 startBackProgress —— 全 dex 里 startBackProgress / getBackProgress 各
   0 次，所以页内返回没有预览，只有跨 Activity（退回管理器）那一下有。
   滚动位置自己管：下钻前已经滚到 0，浏览器给这条历史记的也是 0，
   不关掉自动恢复的话它会在 popstate 之后把我们还原的概览位置抹成 0。 */
try { history.scrollRestoration = 'manual'; } catch (e) {}
var navDepth = 0, navSelf = false;
function pageFromHash(){
  var m = /^#\/(over|apps|log|props|about)$/.exec(location.hash || '');
  return m ? m[1] : null;
}
function navTo(name){
  if (pageFromHash() === name) return;
  navSelf = true;
  navDepth++;
  location.hash = '#/' + name;
}
function goTab(name){
  if (name === S.tab) { loadTab(); return; }
  navTo(name);
}
function goBack(){
  if (navDepth > 0) { history.back(); return; }
  showTab('over', true);
  loadTab();
}
window.addEventListener('popstate', function (){
  var back = !navSelf;
  navSelf = false;
  if (back && navDepth > 0) navDepth--;
  var name = pageFromHash() || 'over';
  if (name === 'over') back = true;
  if (name === S.tab) return;
  showTab(name, back);
  loadTab();
});

function setAuto(on){
  S.auto = on;
  logAuto.setAttribute('aria-checked', on ? 'true' : 'false');
  if (S.autoTimer) { clearInterval(S.autoTimer); S.autoTimer = null; }
  if (on) S.autoTimer = setInterval(function (){
    if (document.hidden || S.tab !== 'log') return;
    /* 自动刷新走静默路径：不能每次都盖一层「读取中」遮罩 */
    loadLog().then(renderLog).catch(function (){ /* 失败就等下一次 tick，不打断 */ });
  }, 5000);
}

function wire(){
  btnSync.innerHTML = svg('sync') + '<span>立即同步</span>';
  btnReload.innerHTML = svg('reload') + '<span>重新读取</span>';
  btnPropsApply.innerHTML = svg('tune') + '<span>立即应用</span>';
  btnLogRefresh.innerHTML = svg('reload') + '<span>刷新</span>';

  homeMenu.addEventListener('click', function (e){
    var b = e.target.closest ? e.target.closest('.menu-row') : null;
    if (!b) return;
    goTab(b.dataset.go);
  });
  btnBack.addEventListener('click', goBack);

  /* 列表来源、分段高亮、「只看未纳入」的按下态必须一起变 —— 以前点「只看未纳入」
     会把列表切到已安装第三方，但高亮还停在「生效列表」，等于在说谎（实测过）。
     切回「生效列表」时那个筛选本来就不生效，一并弹起。 */
  function setAppsView(src, onlyMissing){
    S.appsSrc = src;
    S.onlyMissing = !!onlyMissing && src === 'apps';
    if (src !== 'apps' && S.selectMode) { S.selectMode = false; S.selected = {}; }
    document.querySelectorAll('#appsSeg button').forEach(function (x){
      x.classList.toggle('is-active', x.dataset.src === src);
    });
    btnOnlyMissing.setAttribute('aria-pressed', S.onlyMissing ? 'true' : 'false');
    btnOnlyMissing.classList.toggle('btn-filled', S.onlyMissing);
    btnOnlyMissing.classList.toggle('btn-outline', !S.onlyMissing);
    renderApps();
  }
  Array.prototype.forEach.call(document.querySelectorAll('#appsSeg button'), function (b){
    b.addEventListener('click', function (){ setAppsView(b.dataset.src, b.dataset.src === 'apps' && S.onlyMissing); });
  });
  btnOnlyMissing.addEventListener('click', function (){ setAppsView('apps', !S.onlyMissing); });
  btnSelect.addEventListener('click', enterSelectMode);
  btnBulkExit.addEventListener('click', exitSelectMode);
  btnBulkAll.addEventListener('click', bulkSelectAll);
  btnBulkAdd.addEventListener('click', bulkAddSelected);
  /* 选中用委托：行是每次重画新建的，逐个绑监听会越积越多 */
  appsBody.addEventListener('click', function (e){
    if (!S.selectMode) return;
    var row = e.target.closest ? e.target.closest('.app-row') : null;
    if (!row || !row.classList.contains('is-selectable')) return;
    toggleSelect(row.dataset.pkg, row);
  });
  /* 搜索防抖：两百多行列表每敲一个字符重建一次没有必要 */
  var searchTimer = null;
  appsSearch.addEventListener('input', function (){
    var v = appsSearch.value.replace(/^\s+|\s+$/g, '');
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(function (){ S.search = v; renderApps(); }, 140);
  });

  Array.prototype.forEach.call(document.querySelectorAll('#logSeg button'), function (b){
    b.addEventListener('click', function (){
      S.tail = parseInt(b.dataset.n, 10) || 60;
      S.logSig = '';                                   // 行数变了，必须重画
      document.querySelectorAll('#logSeg button').forEach(function (x){ x.classList.toggle('is-active', x === b); });
      S.loaded.log = false;
      loadLog().then(renderLog).catch(function (e){ snackbar(String((e && e.message) || e), 'bad'); });
    });
  });
  btnLogRefresh.addEventListener('click', function (){
    loadLog().then(renderLog).catch(function (e){ snackbar(String((e && e.message) || e), 'bad'); });
  });
  btnLogClear.addEventListener('click', function (){
    confirm('清空日志缓冲？', '将删除 ' + (S.status.log_file || '/data/adb/ts_auto.log') +
      ' 的全部内容（约 ' + bytesLabel(S.status.log_bytes) + '）。模块后续写日志时会重建该文件，不影响同步逻辑。', '清空')
      .then(function (yes){ if (yes) clearLog(); });
  });
  logAuto.addEventListener('click', function (){ setAuto(!S.auto); });
  logAuto.addEventListener('keydown', function (e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setAuto(!S.auto); } });

  propsSwitch.addEventListener('click', function (){
    var want = propsSwitch.getAttribute('aria-checked') === 'true' ? 'off' : 'on';
    if (want === 'on') { setPropsMasking('on'); return; }
    confirm('关闭开机属性伪装？', '关闭只影响下一次开机：下次开机起不再重置 ro.build.type 等属性，' +
      '应用列表维护照旧。本次开机内已经写入的值不会被改回去。', '关闭').then(function (yes){ if (yes) setPropsMasking('off'); });
  });
  propsSwitch.addEventListener('keydown', function (e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); propsSwitch.click(); } });
  btnPropsApply.addEventListener('click', function (){
    confirm('立即写一次属性？', '等价于把开机阶段的重置现在就跑一遍。' +
      '已经被 Zygote 读进 Java 静态字段的值（如 Build.TYPE）不会因此刷新，要彻底生效仍需重启。', '写入')
      .then(function (yes){ if (yes) applyPropsNow(); });
  });
  btnPropsRefresh.addEventListener('click', function (){ S.loaded.props = false; loadTab(); });
  btnBhSave.addEventListener('click', saveBootHash);
  btnBhClear.addEventListener('click', function (){
    confirm('清除 Verified Boot 哈希？', '清除后下次开机不再写 ro.boot.vbmeta.digest；' +
      '本次运行里已写入的值要重启才回系统原值。', '清除')
      .then(function (yes){ if (yes) clearBootHash(); });
  });

  /* 「关于」以前这三条浮层接线（关闭按钮 / 点遮罩 / Escape）一并去掉：
     它是页面了，出口就是顶栏那个返回箭头和系统返回，和其它页同一条。 */

  /* 真 ripple：按下时在**落点**插一个圆，直径取到最远角的两倍，扩满整块后淡出。
     pointerdown 同时覆盖触摸与鼠标；元素被删/页面切走时圆会随元素一起走。 */
  var RIPPLE_HOST = '.btn,.menu-row,.back,.seg button,.icon-add';
  function rippleAt(el, x, y){
    var r = el.getBoundingClientRect();
    var d = Math.max(x - r.left, r.right - x, y - r.top, r.bottom - y) * 2;
    var s = document.createElement('span');
    s.className = 'ripple';
    s.style.width = s.style.height = d + 'px';
    s.style.left = (x - r.left - d / 2) + 'px';
    s.style.top = (y - r.top - d / 2) + 'px';
    var host = el.querySelector(':scope > .rip');
    if (!host) { host = document.createElement('span'); host.className = 'rip'; el.appendChild(host); }
    host.appendChild(s);
    s.addEventListener('animationend', function (){ s.remove(); });
  }
  document.addEventListener('pointerdown', function (e){
    var el = e.target && e.target.closest ? e.target.closest(RIPPLE_HOST) : null;
    if (!el || el.disabled) return;
    rippleAt(el, e.clientX, e.clientY);
  }, { passive: true });

  /* 系统深浅变了就跟着变。没有"手动档"，所以不需要判断是否处于 auto */
  var mq = matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', function (){
    if (THEME.dark === '') { applyScheme(); if (S.tab === 'over') renderOver(); }
  });
}

function showNoBridge(){
  banner.hidden = false;
  bannerIcon.innerHTML = svg('warn');
  bannerTitle.textContent = '当前管理器没有提供可用的 exec 桥接';
  bannerText.textContent = '模块本身仍在正常工作。命令行等价物：sh ' + MODDIR + '/webui.sh status；' +
    '界面每次刷新发的就是这个命令，参数换成 help 可以看全部子命令。';
  stateText.textContent = '无法连接';
  stateBadge.setAttribute('data-tone', 'bad');

  /* 把扫到的东西列出来：连不上时最需要的不是道歉，是"到底看见了什么" */
  var box = document.getElementById('overBody');
  box.textContent = '';
  var scan = BRIDGE_SCAN.map(function (b){
    return blk(b.name, 'exec=' + (b.exec ? '有' : '无'), b.exec ? 'ok' : 'warn',
      b.methods.length ? b.methods.join(' / ') : '没有可见方法');
  });
  box.appendChild(grp('带 exec 的注入对象 · ' + BRIDGE_SCAN.length, scan));
  if (!scan.length) box.appendChild(el('div', 'empty', '没有带 exec 的注入对象'));
  var extra = injectedGlobals().map(function (k){
    var o = null, ms = [];
    try { o = window[k]; ms = methodsOf(o); } catch (e){}
    return blk(k, typeof o, 'na', ms.length ? ms.join(' / ') : '无可见方法');
  });
  box.appendChild(grp('相对空白页多出的全局对象 · ' + extra.length + '（宿主注入的候选）', extra));
  busyCount = 0; document.getElementById('busy').hidden = true;
}

/* 标题栏：有 hideTitle 就交还给界面自己画；fullScreen 一类不动——
   把系统栏藏了会让人不好退出，不值得为观感冒这个险。 */
function adoptBridge(hit){
  BRIDGE = hit.obj; BRIDGE_KIND = hit.kind; BRIDGE_LABEL = hit.label;
  var dir = moduleDirFromBridge();
  if (dir) { MODDIR = dir; SH = 'sh ' + MODDIR + '/webui.sh'; }
  try { if (typeof BRIDGE.hideTitle === 'function') BRIDGE.hideTitle(); } catch (e){ /* 没有就算了 */ }
  /* KernelSU 把安全区做成一张 CSS 让页面去取（宿主的 SuFilePathHandler 提供
     /internal/insets.css，实测 v3.3.1 的 dex 里有这个路径与那组变量名）。
     请求它同时会让宿主打开 edge-to-edge 绘制；别的宿主没有这个文件，所以只在
     认出的桥是 ksu 时才请求，取不到就用 CSS 里的 env() 兜底。 */
  if (hit.kind === 'ksu') {
    var lk = document.createElement('link');
    lk.rel = 'stylesheet'; lk.href = '/internal/insets.css';
    lk.onload = function (){ S.insetSrc = '宿主 insets.css'; refresh(); };
    lk.onerror = function (){ S.insetSrc = 'env()（宿主没有 insets.css）'; };
    document.head.appendChild(lk);
  }
  /* 状态栏那条缝**不是页面画的**：宿主主题里既没有 statusBarColor 也没有
     windowBackground，那一条是它窗口的底色（管理器的调色板），而页面底色是从
     系统强调色推的 —— 两个来源，永远差一档。
     要同色只能让页面画到状态栏下面：enableEdgeToEdge(true) 把宿主的让位 padding
     归零，背景由页面画（body 的 --surface），于是那条缝就是页面色。
     代价：底部手势把手直接浮在页面背景上（它由 SystemUI 画，页面去不掉）。
     内容位置不变：appbar 的 padding-top 与 .wrap 的 padding-bottom 都吃 safe-area，
     而 <meta viewport> 已经是 viewport-fit=cover。 */
  try { if (typeof BRIDGE.enableEdgeToEdge === 'function') BRIDGE.enableEdgeToEdge(true); } catch (e) {}
  /* 曾试过 fullScreen(true)：状态栏确实藏掉了，但底部那根白色药丸**还在** ——
     说明它不是导航栏背景，而是别的东西（手势提示条，或宿主自己的悬浮底栏）。
     为了它把时钟电量一起藏掉不划算，已撤回。网页这一层没有别的办法让它消失。 */
  checkContract().then(refresh);
}

function boot(){
  wire();

  // ?tab=over|apps|log|props 直接进某一页（预览与排查用）；取数交给下面的 refresh
  /* 先把当前条目定在 #/over（replace 不产生历史、也不惊动宿主），
     之后所有导航都是干净的 hash 条目 */
  try { history.replaceState(history.state, '', '#/over'); } catch (e) {}
  var want = QUERY.get('tab');
  if (want && PAGES.indexOf(want) >= 0 && want !== 'over') {
    navTo(want);          // 深链（预览与排查用）：走同一条 popstate 路
  } else {
    applyPage('over');    // 初始状态也要定死标题 / 英雄卡 / 返回箭头，不依赖标记默认值
  }

  if (DEMO) { checkContract().then(refresh); return; }

  /* 注入时机各家不同：有的在建好桥接对象之前就已经 DOMContentLoaded，
     所以先轮询几秒再判失败，别一上来就报"不支持"。 */
  var tries = 0;
  (function waitBridge(){
    var hit = BRIDGE ? { obj: BRIDGE, kind: BRIDGE_KIND, label: BRIDGE_LABEL } : pickBridge();
    if (hit) { adoptBridge(hit); return; }
    if (++tries < 20) { setTimeout(waitBridge, 200); return; }
    BRIDGE_SCAN = scanBridge();
    showNoBridge();
  })();
}

function demoResult(cmd, arg){

  if (cmd === 'restore-apps') {
    String(arg == null ? '' : arg).split(',').forEach(function (p){
      if (p) DEMO_STATE.restored[p] = 1;
    });
    return { errno: 0, stdout: 'restored=1' };
  }
  if (cmd === 'restore-app') {
    DEMO_STATE.restored[String(arg == null ? '' : arg)] = 1;

    var bh = DEMO_STATE.hash || '';

      'com.MobileTicket', 'com.tencent.mm', 'com.termux', 'me.mugzone.emiria', 'com.netflix.mediaclient']
