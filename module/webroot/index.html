<!DOCTYPE html>
<html lang="zh-CN" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00000000">
<title>TS-AUTO-ADD</title>
<!--
  MD3E（Material 3 Expressive）单文件界面。

  为什么是一个文件：管理器用 file:// 加载 webroot/index.html，部分实现不解析子资源路径，
  拆成 css/js 反而容易白屏；离线可用也要求不引 CDN。

  数据全部来自 sh <模块目录>/webui.sh <命令>（root shell），界面自身不猜任何状态。
  设备数据一律用 textContent 写入，不走 innerHTML。
-->
<style>
/* ================= 设计令牌 ================= */
:root{
  --hue: 267;            /* 主色相：兜底值取平台默认强调色，见 JS 里 HUE_DEFAULT 的出处 */
  --sat: .41;            /* 彩度倍率：系统强调色偏灰就整体降下来 */
  /* 弹簧用 linear() 写成真正的阻尼振荡：Compose 那边是 MotionScheme 给的弹簧，
     贝塞尔永远差一口气（起步/收尾没有过冲）。不支持 linear() 的 WebView 会
     忽略整条声明、退回默认的 ease —— 只是没那么弹，不会坏。 */
  --e-spring: linear(0, .069, .239, .44, .626, .776, .886, .963, 1.014, 1.044, 1.057,
    1.06, 1.057, 1.05, 1.042, 1.034, 1.027, 1.021, 1.016, 1.012, 1.009, 1.006, 1.004,
    1.003, 1.001, 1);
  --e-emph: cubic-bezier(.3,0,.08,1);
  --e-spatial: cubic-bezier(.2,0,0,1);
  /* @material/web 2.5.0 labs/gb 的 Expressive 按钮：按下时圆角收缩，
     用带过冲的曲线回弹（官方 350ms） */
  --e-expressive: cubic-bezier(.42,1.67,.21,.9);
  --d1: 120ms; --d2: 220ms; --d3: 340ms; --d4: 460ms;
  /* 圆角档位对齐 Opticon 的 Shapes：8 / 12 / 16 / 20 / 28 */
  --r-xs: 8px; --r-s: 12px; --r-m: 16px; --r-l: 20px;
  --r-xl: 20px; --r-2xl: 28px; --r-full: 999px;
  /* 松紧要改就改下面这一行 */
  /* 字号只留七档，且只准从这七枚令牌里取：本机 1 CSS px = 1dp，
     所以这些数就是物理尺寸。以前是 15 档字号 + 800 字重，同一屏里
     12 与 12.5 并排，看不出区别、只觉得"没对齐"。
     字重只留 400 / 500 / 600 / 700。 */
  --fs11: 11px; --fs12: 12px; --fs13: 13px; --fs14: 14px;
  --fs16: 16px; --fs22: 22px; --fs38: 38px;
  /* 板块底色：默认"比卡面抬一档"。必须定义在 :root 而不是 .grp 上 ——
     写在 .grp 上会盖掉浮层里那条覆盖（自定义属性也是元素自己的声明赢过继承），
     实测那样色块和浮层同色、等于没加。 */
  --block: var(--surface-highest);
  --sp1: 4px; --sp2: 8px; --sp3: 12px; --sp4: 16px; --sp5: 20px; --sp6: 24px; --sp7: 32px;
  /* 内容列宽上限：真机 WebView 是 **417 CSS px** 宽（1644px @630dpi，
     低分辨率模式 1096px @420dpi 换算后同样是 417.5dp，见 CHANGELOG）。
     这条上限在本机不生效，只挡平板与横屏；本机一屏就是一列，
     所以"卡片里放两到三格"在这个宽度上永远不会发生，别按它调密度。 */
  --measure: 600px;
  /* 板块分列的格子下限。--cell 从来没被设过，走的是 .grid 里 240px 的兜底 ——
     而本机内容宽只有 335（417 画布减去页边距与卡内边距），240 的下限让每个板块
     都只能排一列，"自适应分列"在这台机器上等于没开。150 是按真机字符串量的：
     值最宽 142（上次写入那行时间），所以 157 的列放得下值；放不下的只有注释行，
     注释改成换行（见 .blk small），不靠裁字来凑宽度。 */
  --cell: 150px;
  /* 可点区下限：48dp（本机 = 48 CSS px）。只用来撑 ::after，不影响布局。 */
  --hit: 48px;
  --hair: 1px solid var(--outline-variant);
  /* 系统栏让位量。界面会请求 edge-to-edge（见 adoptBridge），所以这两条必须
     有真值。优先用宿主自己给的数：KernelSU 在 /internal/insets.css 里定义
     --window-inset-top/bottom（实测 v3.3.1 的 dex 里有这条：它就是
     var(--safe-area-inset-top, 0px) 那组），拿不到才退 CSS 的 env()。
     两条都只在这里定义一次，appbar / 吸顶标签 / .wrap / snackbar 全读令牌。 */
  --inset-top: var(--window-inset-top, env(safe-area-inset-top));
  --inset-bottom: var(--window-inset-bottom, env(safe-area-inset-bottom));
  /* 不写死 Roboto / Segoe UI / 微软雅黑：那几个名字会**抢在系统字体之前**匹配上。
     WebView 在 Android 上有自己的一套字体映射（sans-serif 默认就是 Roboto），
     根本不读框架的 config_bodyFontFamily，所以 ROM 换了系统字体时界面会退回 Roboto。
     真名字由 env 的 sys_font 从设备上读出来再注入（见 webui.sh 的「系统字体」段）。 */
  --font: system-ui, sans-serif;
  /* 同样不写死具体名字：Menlo / Consolas 在这台机器上永远匹配不到，
     ui-monospace 与 monospace 才是系统自带的那一支等宽字 */
  --mono: ui-monospace, monospace;

  /* ---------- Material Web 2.5.0 (labs/gb) 令牌 ----------
     m3.css 在 @layer 里；这里是未分层，同名令牌以我们的系统取色/字体为准。
     组件只读 --md-sys-*，所以颜色、字体、圆角只需要在这里对一次账。 */
  --md-ref-typeface-plain: var(--font);
  --md-ref-typeface-brand: var(--font);
  --md-sys-shape-corner-none: 0px;
  --md-sys-shape-corner-extra-small: 4px;
  --md-sys-shape-corner-small: 8px;
  --md-sys-shape-corner-medium: 12px;
  --md-sys-shape-corner-large: 16px;
  --md-sys-shape-corner-extra-large: 28px;
  --md-sys-shape-corner-extra-large-increased: 32px;
  --md-sys-shape-corner-extra-extra-large: 48px;
  --md-sys-shape-corner-full: 999px;
  --md-sys-color-primary: var(--primary);
  --md-sys-color-on-primary: var(--on-primary);
  --md-sys-color-primary-container: var(--primary-container);
  --md-sys-color-on-primary-container: var(--on-primary-container);
  --md-sys-color-secondary: var(--secondary);
  --md-sys-color-on-secondary: var(--on-secondary);
  --md-sys-color-secondary-container: var(--secondary-container);
  --md-sys-color-on-secondary-container: var(--on-secondary-container);
  --md-sys-color-tertiary: var(--secondary);
  --md-sys-color-on-tertiary: var(--on-secondary);
  --md-sys-color-tertiary-container: var(--secondary-container);
  --md-sys-color-on-tertiary-container: var(--on-secondary-container);
  --md-sys-color-error: var(--error);
  --md-sys-color-on-error: var(--on-error);
  --md-sys-color-error-container: var(--error-container);
  --md-sys-color-on-error-container: var(--on-error-container);
  --md-sys-color-surface: var(--surface);
  --md-sys-color-surface-dim: var(--surface-mid);
  --md-sys-color-surface-bright: var(--surface-bright);
  --md-sys-color-surface-container-lowest: var(--surface-lowest);
  --md-sys-color-surface-container-low: var(--surface-low);
  --md-sys-color-surface-container: var(--surface-mid);
  --md-sys-color-surface-container-high: var(--surface-high);
  --md-sys-color-surface-container-highest: var(--surface-highest);
  --md-sys-color-on-surface: var(--on-surface);
  --md-sys-color-on-surface-variant: var(--on-variant);
  --md-sys-color-outline: var(--outline);
  --md-sys-color-outline-variant: var(--outline-variant);
  --md-sys-color-inverse-surface: var(--on-variant);
  --md-sys-color-inverse-on-surface: var(--surface);
  --md-sys-color-inverse-primary: var(--primary-container);
  --md-sys-color-surface-tint: var(--primary);
  --md-sys-color-scrim: #000;
  --md-sys-color-shadow: #000;
}

:root,[data-scheme=light]{
  color-scheme:light;
  --primary:oklch(49% calc(.19*var(--sat)) var(--hue));            --on-primary:oklch(100% 0 0);
  --primary-container:oklch(92% calc(.06*var(--sat)) var(--hue));  --on-primary-container:oklch(28% calc(.13*var(--sat)) var(--hue));
  --secondary:oklch(53% calc(.11*var(--sat)) var(--hue));          --on-secondary:oklch(100% 0 0);
  --secondary-container:oklch(92% calc(.05*var(--sat)) var(--hue));--on-secondary-container:oklch(32% calc(.08*var(--sat)) var(--hue));
  --error:oklch(50% .21 27);                      --on-error:oklch(100% 0 0);
  --error-container:oklch(94% .07 27);            --on-error-container:oklch(30% .14 27);
  /* 「一切正常」不能借用任何随系统色相变化的角色：色相一调它可能正好落到橙红上，
     正常态就显示成警告色。成功态单独一套固定绿。 */
  --success:oklch(45% .14 155);                   --on-success:oklch(100% 0 0);
  --success-container:oklch(92% .07 155);         --on-success-container:oklch(26% .10 155);
  --surface:oklch(99.2% calc(.008*var(--sat)) var(--hue));        --on-surface:oklch(22% calc(.03*var(--sat)) var(--hue));
  --surface-lowest:oklch(100% 0 0);               --surface-low:oklch(95.6% calc(.012*var(--sat)) var(--hue));
  --surface-mid:oklch(95% calc(.015*var(--sat)) var(--hue));      --surface-high:oklch(92% calc(.018*var(--sat)) var(--hue));
  --surface-highest:oklch(89% calc(.02*var(--sat)) var(--hue));   --surface-bright:oklch(99% calc(.01*var(--sat)) var(--hue));
  --on-variant:oklch(45% calc(.025*var(--sat)) var(--hue));       --outline:oklch(66% calc(.02*var(--sat)) var(--hue));
  --outline-variant:oklch(85% calc(.015*var(--sat)) var(--hue));  --scrim:oklch(35% 0 0 / 45%);
  /* 卡片/底栏的边线比通用分隔线再重一档：浅色下 85% 对 98.5% 的页底只有约 1.35:1，
     亮屏上几乎看不见（"边界不清晰"就是这个数）。这一档实测约 1.7:1。 */
  --card-line:oklch(77.5% calc(.018*var(--sat)) var(--hue));
  /* 阴影只留一层极轻的接触影，卡片之间的分隔交给 hairline：
     宽画布上大投影会把"浮起来的果冻"叠成一片糊 */
  --shadow:0 1px 2px oklch(30% .04 var(--hue) / 10%);
}
[data-scheme=dark]{
  color-scheme:dark;
  --primary:oklch(80% calc(.13*var(--sat)) var(--hue));            --on-primary:oklch(30% calc(.14*var(--sat)) var(--hue));
  --primary-container:oklch(42% calc(.16*var(--sat)) var(--hue));  --on-primary-container:oklch(90% calc(.07*var(--sat)) var(--hue));
  --secondary:oklch(80% calc(.09*var(--sat)) var(--hue));          --on-secondary:oklch(30% calc(.06*var(--sat)) var(--hue));
  --secondary-container:oklch(40% calc(.10*var(--sat)) var(--hue));--on-secondary-container:oklch(90% calc(.05*var(--sat)) var(--hue));
  --error:oklch(84% .14 27);                      --on-error:oklch(30% .12 27);
  --error-container:oklch(44% .18 27);            --on-error-container:oklch(93% .06 27);
  --success:oklch(80% .14 155);                   --on-success:oklch(24% .09 155);
  --success-container:oklch(32% .10 155);         --on-success-container:oklch(91% .07 155);
  --surface:oklch(16.5% calc(.015*var(--sat)) var(--hue));           --on-surface:oklch(92% calc(.012*var(--sat)) var(--hue));
  --surface-lowest:oklch(14% calc(.01*var(--sat)) var(--hue));     --surface-low:oklch(22% calc(.016*var(--sat)) var(--hue));
  --surface-mid:oklch(24% calc(.018*var(--sat)) var(--hue));       --surface-high:oklch(27% calc(.02*var(--sat)) var(--hue));
  --surface-highest:oklch(31% calc(.022*var(--sat)) var(--hue));   --surface-bright:oklch(33% calc(.022*var(--sat)) var(--hue));
  --on-variant:oklch(74% calc(.02*var(--sat)) var(--hue));         --outline:oklch(60% calc(.02*var(--sat)) var(--hue));
  --outline-variant:oklch(42% calc(.02*var(--sat)) var(--hue));    --scrim:oklch(0% 0 0 / 55%);
  --card-line:oklch(47% calc(.022*var(--sat)) var(--hue));
  --shadow:0 1px 2px oklch(0% 0 0 / 35%);
}

/* 守卫条件连同 calc() 一起测：只支持裸 oklch 而不支持 oklch 内 calc 的引擎，
   会整条颜色失效，所以这种情况直接退回固定十六进制配色 */
@supports not (color: oklch(50% calc(.1*1) 200)){
  :root,[data-scheme=light]{
    --primary:#5b48c8;--on-primary:#fff;--primary-container:#e5defd;--on-primary-container:#22146b;
    --secondary:#5d5a72;--on-secondary:#fff;--secondary-container:#e3dff6;--on-secondary-container:#1a172b;
    --error:#b3261e;--on-error:#fff;--error-container:#f9dedc;--on-error-container:#410e0b;
    --success:#116a46;--on-success:#fff;--success-container:#c5edda;--on-success-container:#00331e;
    --surface:#fbfcff;--on-surface:#1b1b21;--surface-lowest:#fff;--surface-low:#eff0f4;--surface-mid:#efecf4;
    --surface-high:#e9e5ee;--surface-highest:#e3dfe8;--surface-bright:#fff;
    --on-variant:#47464f;--outline:#787680;--outline-variant:#c9c6d0;--card-line:#b6b2c2;--scrim:rgba(0,0,0,.45);--shadow:0 2px 16px rgba(0,0,0,.14);
  }
  [data-scheme=dark]{
    --primary:#c9bffd;--on-primary:#37279a;--primary-container:#4435b0;--on-primary-container:#e5defd;
    --secondary:#c7c2dc;--on-secondary:#2f2d3f;--secondary-container:#49475b;--on-secondary-container:#e3dff6;
    --error:#ffb4ab;--on-error:#691e16;--error-container:#93000e;--on-error-container:#ffdad6;
    --success:#8ad4b0;--on-success:#00392a;--success-container:#005240;--on-success-container:#c5edda;
    --surface:#0d0e11;--on-surface:#e5e1e9;--surface-lowest:#0a0b0d;--surface-low:#191b1e;--surface-mid:#1e1e24;
    --surface-high:#2c2c33;--surface-highest:#33333a;--surface-bright:#3a3a42;
    --on-variant:#c9c5cf;--outline:#938f99;--outline-variant:#494750;--card-line:#585562;--scrim:rgba(0,0,0,.6);--shadow:0 2px 16px rgba(0,0,0,.4);
  }
}

/* ================= 按压反馈（真 ripple） ================= */
/* Compose 的 Surface 自带 ripple：从**手指落点**向外长成一个圆，扩到覆盖整块再淡出。
   先前那版"整块变亮"只是近似，没有起点，一眼能看出不是原生的。
   圆由 JS 在 pointerdown 时插入（见 wire 里的 rippleAt），这里只管形状与动画。 */
.btn,.menu-row,.back,.seg button,.icon-add{position:relative}
/* 涟漪单独一层：它需要 overflow:hidden 才能裁成胶囊形状，而这个不能压在
   按钮本体上 —— 本体的 ::after 要伸出盒子当可点区，会被裁掉。 */
.rip{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;
  opacity:.16;transform:scale(0);animation:ripple var(--d3) var(--e-emph) forwards}
@keyframes ripple{to{transform:scale(1);opacity:0}}

/* ================= 基础 ================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 让网页闭嘴的三件事：
   ① touch-action:manipulation —— 不写的话浏览器要等 ~300ms 看是不是双击缩放，
      每个按钮点下去都"慢半拍"；
   ② user-select:none —— 横滑时手指会把文字选中、冒出选择柄，是网页最明显的破绽；
      输入框、编辑框和日志台例外（那里真的要能选）；
   ③ overscroll-behavior:none —— 划到头的回弹/发光也不要。 */
html{touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,input,.console{-webkit-user-select:text;user-select:text}
body{
  background:var(--surface);color:var(--on-surface);font:400 14px/1.5 var(--font);
  /* 竖排 + .wrap 撑满：让页脚在内容短的时候也贴着视口底部，
     底下的系统手势条才有"系统区域"的样子，而不是悬在一片空白里 */
  min-height:100vh;display:flex;flex-direction:column;
}
h1,h2,h3,p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:var(--r-xs)}
.mono{font-family:var(--mono);font-size:var(--fs12);letter-spacing:-.2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ================= 顶栏 ================= */
/* 概览的顶栏随内容滚走；二级页的顶栏钉住（下面 .is-sub），因为返回箭头在它里面。 */
.appbar{padding:calc(var(--inset-top) + var(--sp2)) var(--sp4) var(--sp1);
  max-width:var(--measure);margin:0 auto;width:100%}
/* 二级页的顶栏钉住：返回箭头是那一屏唯一的出口，长列表滚到一半不能让它滚走。
   概览不钉 —— 在概览上要的是让内容滚出去，顶栏没有要够的东西。 */
.appbar.is-sub{position:sticky;top:0;z-index:30;background:var(--surface);
  box-shadow:0 1px 0 var(--card-line)}
.appbar-row{display:flex;align-items:center;gap:var(--sp2)}
/* 二级页的返回：顶栏最左，40 的圆钮。它是「返回」而不是「回概览」——
   从概览下钻到某一页后，返回回到上一级。 */
.back{flex:none;width:40px;height:40px;margin-left:-10px;border:0;border-radius:var(--r-full);
  background:transparent;color:var(--on-surface);display:grid;place-items:center;cursor:pointer;
  transition:background var(--d1) var(--e-emph),transform var(--d2) var(--e-spring)}
.back:active{transform:scale(.9)}
.back svg{width:24px;height:24px;display:block;fill:currentColor}
/* 返回钮视觉仍是 40 的圆，可点区补到 48（上下各 4，落在顶栏留白里）。 */
.back::after{content:"";position:absolute;top:50%;left:50%;width:var(--hit);height:var(--hit);
  transform:translate(-50%,-50%)}
/* 按钮与分段：高度补到 48，宽度不越给自己的槽位（相邻分段会互抢）。 */
.btn::after,.seg button::after{content:"";position:absolute;top:50%;left:0;right:0;
  height:var(--hit);transform:translateY(-50%)}
/* 加号钮 32 见方，两个方向都要补。 */
.icon-add::after{content:"";position:absolute;top:50%;left:50%;width:var(--hit);height:var(--hit);
  transform:translate(-50%,-50%)}
.back[hidden]{display:none}
.appbar h1{font-size:var(--fs22);font-weight:700;letter-spacing:-.3px;line-height:1.25;color:var(--on-surface)}

/* ================= 卡片 ================= */
/* 整页滚动：底栏已经去掉，底部不再给药丸让位，只留一段普通收尾留白。
   加在这里、不加在 body 上，页面背景才一直铺到屏幕底边 */
.wrap{padding:0 var(--sp4) calc(32px + var(--inset-bottom));
  display:flex;flex-direction:column;gap:var(--sp6);flex:1;
  max-width:var(--measure);margin:0 auto;width:100%}
/* 面板竖着排，靠 hidden 切换 —— 没有滚动、没有容器高度变化，
   也没有"相邻页第一次进视口才绘制"那一帧。
   概览自己不是卡片（里面是「入口 + 状态明细」两张卡），所以用 .panel 而不是 .card.panel。 */
.pages{display:block}
.panel[hidden]{display:none}
/* 二级页没有英雄卡，卡片离顶栏补一点气口（概览靠 .wrap 的 gap） */
.card.panel{margin-top:var(--sp2)}
.card{background:var(--surface-low);border:1px solid var(--card-line);border-radius:var(--r-xl);padding:var(--sp6);
  box-shadow:var(--shadow)}
/* 面板与英雄卡都不要 keyframes 入场：从 display:none 变回来时动画会整段重播，
   实测 opacity 0 → 0.028 → 1 就是「每切一下都闪一下」。切页的动效改由 WAAPI
   在 showTab 里按方向播一次（只动 transform + 0.9→1，不碰高度、不盖遮罩）。
   英雄卡在二级页要隐藏、返回时再显示 —— 给它挂 keyframes 就会每次返回重播，
   所以这一条只留给提示条（它不参与切页）。 */
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}
/* 英雄卡不再整块上色：最大的色块应该装最重要的信息，而它只有一个数字和两个按钮。
   主色只留在数字与主行动上，卡片的分隔交给发丝线。 */
/* 英雄卡的左右内边距跟其它卡一样用 sp6：它的左上角「运行中」与下面两张卡的
   标签/图标必须在同一条竖线上（以前它自己用 16，是第三条缩进线）。 */
.hero{background:var(--surface-low);color:var(--on-surface);border:var(--hair);
  border-radius:var(--r-2xl);padding:var(--sp4) var(--sp6) var(--sp3)}
.hero-top{display:flex;align-items:center;gap:var(--sp2);flex-wrap:wrap}
.hero-count{display:flex;align-items:flex-end;gap:var(--sp3);margin:var(--sp3) 0 var(--sp2);flex-wrap:wrap}
.count-num{font-size:var(--fs38);font-weight:700;line-height:1.05;letter-spacing:-1px;color:var(--primary);
  font-variant-numeric:tabular-nums;transition:transform var(--d3) var(--e-spring)}
.count-num.bump{transform:scale(1.06)}
/* 不用 opacity 压层次：那样审对比度时量到的是叠色前的值，读出来是假的 */
.count-cap{padding-bottom:2px;font-size:var(--fs13);font-weight:600;color:var(--on-surface)}
.count-cap small{display:block;font-weight:500;font-size:var(--fs12);margin-top:1px;color:var(--on-variant)}
/* 操作行自己占一行、两个按钮等宽。以前它是 `margin-left:auto` 挂在数字那行的
   尾巴上，靠 flex-wrap 随机换行：本机 417 装不下（数字块 + 两个按钮要 386，
   内容宽只有 335），于是换行后右对齐，左边空出 98px —— 看着像没排完。
   现在写死一行：417 下正好铺满内容宽（每键 163），宽屏靠 max-width 收到 340
   并保持右对齐，所以两种宽度下按钮的物理尺寸几乎一样，也不再取决于会不会换行。 */
.hero-actions{display:flex;gap:var(--sp2);flex-wrap:wrap;margin-left:auto;
  width:100%;max-width:340px}
.hero-actions>.btn{flex:1 1 0;min-width:0}

/* ================= 徽章 / chip ================= */
/* 全站一套对称圆角：原先英雄卡切一角、徽章是叶子形、主按钮另一组不对称，
   三套互不呼应的不对称放一起不叫表现力，叫随机。 */
.badge{display:inline-flex;align-items:center;gap:var(--sp2);padding:3px 10px;font-size:var(--fs12);font-weight:700;
  border-radius:var(--r-full);background:var(--surface-lowest);color:var(--on-surface);
  transition:background var(--d2) var(--e-emph)}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--outline);flex:none}
/* 正常态不上绿底：整页唯一的色块留给「需要处理」。点已经足够说明「查过了、没问题」 */
.badge[data-tone=ok]{background:var(--surface-high);color:var(--on-surface)}
.badge[data-tone=ok] .dot{background:var(--success)}
.badge[data-tone=warn]{background:var(--secondary-container);color:var(--on-secondary-container)}
.badge[data-tone=warn] .dot{background:var(--secondary)}
.badge[data-tone=bad]{background:var(--error-container);color:var(--on-error-container)}
.badge[data-tone=bad] .dot{background:var(--error);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
/* 版本号是**单调文字**，不再是胶囊按钮：点开「关于」的入口已经有单独一行，
   这里再放一个 32px 的胶囊只是多一个"面"，还平白多一个容易误触的小目标。 */
.ver{display:inline-block;color:var(--on-variant);font-size:var(--fs12);
  min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ================= 按钮 ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp2);min-height:38px;padding:0 var(--sp4);
  border:0;border-radius:var(--r-full);font-size:var(--fs14);font-weight:600;cursor:pointer;letter-spacing:.1px;
  transition:border-radius 350ms var(--e-expressive),transform var(--d2) var(--e-spring),
    background var(--d1) var(--e-emph),box-shadow var(--d2) var(--e-emph)}
.btn svg{width:18px;height:18px;flex:none}
/* Expressive：按下时从胶囊收成 8px 圆角；.fab 有自己的 50% 形状，在后面覆盖 */
.btn:active{border-radius:var(--r-xs)}
.btn[disabled]{opacity:.42;pointer-events:none}
/* .btn 自己声明了 display:inline-flex，会盖掉 hidden 属性的 display:none。
   批量按钮要靠 hidden 在「生效列表」和批量模式里消失，必须显式补一条。 */
.btn[hidden]{display:none}
.icon-add[hidden]{display:none}
.btn-filled{background:var(--primary);color:var(--on-primary)}
.btn-filled:hover{box-shadow:0 2px 10px var(--primary);filter:brightness(1.06)}
.btn-danger{background:var(--error);color:var(--on-error)}
.btn-danger:hover{box-shadow:0 2px 10px var(--error);filter:brightness(1.06)}
/* 次行动不再上 secondary-container：英雄卡转中性之后，这里再放一块淡紫
   就等于把「两个按钮都很重要」画出来。它只需要读起来是「另一个动作」。 */
.btn-tonal{background:var(--surface-high);color:var(--on-surface)}
.btn-outline{background:transparent;color:var(--primary);border:1px solid var(--outline-variant)}
.btn-text{background:transparent;color:var(--primary);padding:0 var(--sp3)}
.btn-sm{min-height:36px;padding:0 var(--sp3);font-size:var(--fs13)}
/* 主行动用 primary：它是唯一"跟着系统色相走"的实心色，别的角色要么太淡要么
   带警告含义。静止形状与其它按钮一样是胶囊 —— 表现力留给按下那一刻的形状形变，
   一屏里两种按钮形状并排只会读成「这俩不是一类东西」。 */
.fab{background:var(--primary);color:var(--on-primary)}
.fab:active{border-radius:50%;transform:scale(.9)}

/* ================= 二级页入口（底栏已去掉） ================= */
/* 一切从概览下钻：一张卡里四行，每行只有标题 —— 旧版还有副标题和图标位，
   副标题是解释、图标位从来没被渲染出来，留着只是两条缩进。 */
/* 通栏行：行自己左右留 sp6，与卡片内容左缘严格对齐。
   overflow:hidden 把行的悬停底色裁进卡片圆角。 */
.menu{padding:var(--sp3) 0;overflow:hidden}
.menu-row{display:flex;align-items:center;gap:var(--sp3);width:100%;min-height:56px;
  padding:16px var(--sp6);border:0;border-radius:0;background:transparent;
  color:var(--on-surface);text-align:left;cursor:pointer;
  transition:background var(--d1) var(--e-emph),transform var(--d2) var(--e-spring)}
.menu-row:active{transform:scale(.985);background:var(--surface-mid)}
.menu-row::after{content:"›";margin-left:auto;flex:none;font-size:22px;line-height:1;
  color:var(--on-variant);opacity:.6}
.menu-txt{flex:1;min-width:0;display:block}
.menu-txt b{display:block;font-size:var(--fs16);font-weight:600;line-height:1.4}
/* 概览里是两张卡：入口在上、状态明细在下 */
/* 卡与卡之间 (24) 不小于卡内边距 (24)：外距小于内距时，两张卡看起来会比
   它们自己的内容还亲，版面立刻显得局促。 */
.home-card{margin-top:var(--sp6)}

/* ================= 概览分组 ================= */
/* 「标签贴左、数值贴右」的整行布局会在中间拉出一大片空洞（本机内容宽 335，
   一行里两端之间能空 200 以上），整页像一张被拉宽的收据。改成自适应网格：
   每格自己限宽（下限 --cell，本机 150 → 两列），窄到放不下自动降列，
   不需要断点，也不会有行横跨整个画布。 */
/* 板块各一块底：分列之后一个板块里挤了 8 个键值，只靠间距分组读不出边界。
   底色取"比卡面再抬一档"（--surface-high：与卡面比 1.143 深 / 1.116 浅，
   和页底 vs 卡面那档 1.118/1.11 同量级 —— 他验收过的步进），浮层本身已经是
   surface-high，所以里面改用 surface-highest，两处都是同一档落差。
   负外边距 + 等值内边距：色块向外铺到卡内边距的中点，文字左缘仍然精确落在 41
   （全站那一条内容左缘不能因为加底色而挪位置）。 */
.grp{background:var(--block);border-radius:var(--r-m);
  margin:0 calc(var(--sp4) * -1);padding:var(--sp4)}
.grp+.grp{margin-top:var(--sp6)}
.grp-t{display:flex;align-items:center;gap:8px;font-size:var(--fs13);font-weight:700;
  letter-spacing:.2px;color:var(--on-surface);margin-bottom:var(--sp3)}
.grp-t::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--primary);flex:none}
/* 轨道下限必须写成 min(目标宽, 100%)：只写 minmax(260px,1fr) 时，
   容器比 260px 还窄（320px 视口下卡片内容只有 254px）轨道不会退让，
   格子就会捅出网格右边界。实测过这一处。 */
/* 格子不再填色：一屏 8 个灰块等于 8 个"面"，卡片里再套盒子就显得碎。
   也不画分隔线：两列的格子高度天然不同（日志缓冲多一行小字），线会参差 ——
   分层交给组标题与行距。列保持两列（整行 label/value 会在中间拉出几百 px 空洞）。 */
.grid{display:grid;gap:var(--sp4) var(--sp5);grid-template-columns:repeat(auto-fit,minmax(min(var(--cell,240px),100%),1fr))}
.blk{background:transparent;border-radius:0;padding:0;min-width:0}
.blk-k{display:block;font-size:var(--fs12);font-weight:500;color:var(--on-variant);margin-bottom:5px}
.blk-v{display:flex;align-items:center;gap:8px;font-size:var(--fs16);font-weight:600;line-height:1.4;min-width:0}
.blk-v>span{min-width:0}
.blk-v .pill{font-weight:inherit}
/* 注释行不再裁：以前 nowrap + ellipsis，板块一分列，路径与说明就被切成
   "/data/adb/teesim/conf…"。改成换行，宁可格子高一点也不丢字。
   完整值仍在 title 上；断点优先落在 "/" 后面（见 blk 里的零宽空格），
   overflow-wrap 只是那种没有斜杠的长串兜底。 */
.blk small{display:block;font-size:var(--fs12);font-weight:400;color:var(--on-variant);margin-top:5px;line-height:1.55;
  overflow-wrap:anywhere}
.blk-num{font-size:var(--fs22);font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.blk-v .blk-num{font-size:var(--fs22);font-weight:700}
/* 路径是脚注不是数据：单独一组小字，别塞进网格里当第 N 行收据 */
.paths{margin-top:var(--sp4);display:flex;flex-direction:column;gap:6px}
.grp>.paths{margin-top:0}
.path-row{display:flex;gap:var(--sp2);min-width:0;line-height:1.6}
.path-k{flex:none;font-size:var(--fs12);color:var(--on-variant)}
.path-v{min-width:0;word-break:break-all;font-size:var(--fs12);color:var(--on-variant)}
/* 「关于」是诊断脚注，不该和运行状态抢层级：格子去掉填充、值降一档字号 */
.card-quiet .blk{background:transparent;border-bottom:0;padding:0}
.card-quiet .grid{gap:var(--sp4)}
.card-quiet .blk-v{font-size:var(--fs14);font-weight:600}
.card-quiet .blk-k{margin-bottom:5px}
/* 状态只在「需要关注」时才着色：正常值就是普通文字，不给绿点。
   一排绿点等于什么都没说，还会把概览变成红绿灯阵列；
   只有 warn/bad/na 才画点或胶囊，眼睛第一眼落在的就是它们。 */
.pill{display:inline-flex;align-items:center;gap:5px;padding:0;border-radius:var(--r-full);min-width:0;
  font-size:var(--fs13);font-weight:600;background:transparent;color:var(--on-surface)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--outline);flex:none}
.pill[data-tone=ok]::before{display:none}
.pill[data-tone=na]::before{background:var(--outline)}
.pill[data-tone=warn]{padding:2px 9px 2px 8px;background:var(--secondary-container);
  color:var(--on-secondary-container);font-weight:700}
.pill[data-tone=warn]::before{background:var(--secondary)}
.pill[data-tone=bad]{padding:2px 9px 2px 8px;background:var(--error-container);color:var(--on-error-container);font-weight:700}
.pill[data-tone=bad]::before{background:var(--error)}
/* 应用列表固定一列：行里要放 图标 + 应用名 + 包名 + 角标，两列时每列只有
   258px，包名全被截断。这条以前靠 258 这个魔法数刚好只排一列 —— 卡片内边距
   从 26 收到 24 之后内容宽度 514 → 518，越过 2×258+1 的阈值，列表自己翻成了
   两列。现在显式写死。 */
#appsBody{display:block}
.app-row{display:flex;align-items:center;gap:var(--sp3);min-height:56px;padding:8px 0;border-radius:var(--r-m);
  min-width:0;transition:background var(--d1) var(--e-emph)}
.app-row:hover{background:var(--surface-mid)}
/* 头像：有桌面缓存就用那张真图标，没有就用首字块。
   快捷方式、系统组件、以及压根没有 Launcher3 系缓存的机器都会落到后者，不是异常路径 */
.app-ic{flex:none;width:40px;height:40px;border-radius:50%;overflow:hidden;
  background:var(--surface-high);display:grid;place-items:center;
  color:var(--on-variant);font-size:var(--fs16);font-weight:700}
.app-ic img{width:100%;height:100%;object-fit:contain;display:block}
.app-txt{flex:1;min-width:0}
.app-name{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:var(--fs14);font-weight:600}
.app-name.is-mono{font-family:var(--mono);font-size:var(--fs12);font-weight:400;letter-spacing:-.2px}
.app-tag{flex:none;font-size:var(--fs11);font-weight:700;padding:1px 6px;border-radius:var(--r-full);
  background:var(--surface-high);color:var(--on-variant)}
.app-tag[data-tone=na]{background:var(--surface-highest);color:var(--on-variant);font-weight:600}
/* 列表里的 + 是高频动作：不加底色和边框，只在按/悬停时给一层浅底，避免 100 多行
   变成一排按钮。命中区仍由 .icon-add::after 撑到 48。 */
.icon-add{flex:none;width:32px;height:32px;border:0;border-radius:var(--r-s);background:transparent;
  color:var(--on-variant);cursor:pointer;display:grid;place-items:center;
  transition:transform var(--d2) var(--e-spring),background var(--d1) var(--e-emph)}
.icon-add:hover{background:var(--surface-high)}
.icon-add:active{transform:scale(.86)}
.icon-add svg{width:16px;height:16px}
.search-row #btnAppsRefresh{margin-left:0}
/* 批量选择：行尾的选中圆点 + 固定在底部的操作条。 */
.selbox{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--outline-variant);
  display:grid;place-items:center;color:transparent;
  transition:background var(--d1) var(--e-emph),border-color var(--d1) var(--e-emph)}
.selbox svg{width:14px;height:14px}
.selbox[data-on="1"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.app-row.is-selectable{cursor:pointer}
/* @material/web 2.5.0 labs/gb list-item 的选中/按下语义：
   选中态用 secondary-container，头像换成 primary-container。 */
.app-row.is-selected{background:var(--secondary-container);color:var(--on-secondary-container)}
.app-row.is-selected .app-name{color:var(--on-secondary-container)}
.app-row.is-selected .app-ic{background:var(--primary-container);color:var(--on-primary-container)}
.bulkbar{position:fixed;left:var(--sp4);right:var(--sp4);bottom:calc(var(--inset-bottom) + 12px);z-index:60;
  display:flex;align-items:center;gap:var(--sp2);padding:var(--sp2) var(--sp3);
  background:var(--surface-high);border-radius:var(--r-l);box-shadow:0 6px 24px rgba(0,0,0,.28)}
.bulkbar[hidden]{display:none}
.bulk-count{flex:1 1 auto;min-width:0;font-size:var(--fs13);font-weight:600;color:var(--on-surface)}
.bulkbar .btn{flex:none}
body.is-selecting #appsBody{padding-bottom:96px}
/* 属性表：名字 + 状态一行，值单独一行横跨整格。
   以前三样挤在一行里，键和值中间没有间隔，读出来是「device_statelocked一致」。 */
/* 属性表：一行一项（键 · 值 · 状态），键与值之间留 sp3 —— 以前两者之间没有
   间隔，读出来是「device_statelocked一致」，才改成各占一行；但那样 12 项要
   47.3px 一行，卡高 753。现在同排显示，长值走省略号 + title 看全文。
   不符的那一行让值单独占第二行：期望值是这一行存在的理由，不能被省略号吃掉。 */
.prop-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;
  column-gap:var(--sp3);align-items:center;padding:9px 0;border-bottom:var(--hair)}
.prop-row.is-ok{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
/* 不符的那行：键与状态在第一行、值整行放第二行。落位必须写死 ——
   只靠自动放置，那颗 pill 会被塞到跨两列的一行里，被拉成整条红色。 */
.prop-row.is-diff{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
.prop-row.is-diff .prop-k{grid-column:1;grid-row:1}
.prop-row.is-diff .pill{grid-column:2;grid-row:1;justify-self:end}
.prop-row.is-diff .prop-v{grid-column:1 / -1;grid-row:2;overflow:visible;text-overflow:clip;white-space:normal}
.prop-row:last-child{border-bottom:0}
.prop-k{font-family:var(--mono);font-size:var(--fs12);color:var(--on-surface);min-width:0;line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prop-v{font-family:var(--mono);font-size:var(--fs12);color:var(--on-variant);min-width:0;line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 窄屏放不下"键 · 值"同排（320 下键就吃掉 194px），退回两行 */
@media (max-width:399px){
  .prop-row{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
  .prop-k{grid-column:1;grid-row:1}
  .pill{grid-column:2;grid-row:1;justify-self:end}
  .prop-v{grid-column:1 / -1;grid-row:2;overflow:visible;text-overflow:clip;white-space:normal}
}
/* Verified Boot 哈希：值是一长串十六进制，必须能断行，省略号在这里没有意义 */
.hash-line{display:flex;align-items:baseline;gap:var(--sp3);padding:3px 0;min-width:0}
.hash-k{flex:none;font-size:var(--fs12);font-weight:600;color:var(--on-variant)}
.hash-v{min-width:0;font-family:var(--mono);font-size:var(--fs12);color:var(--on-surface);overflow-wrap:anywhere}

/* ================= 表单 ================= */
/* 表单：标签一律放在控件上方。浮动标签要和文本域首行算位置，textarea 一定压字 */
.field{display:block}
.field textarea,.field input[type=text]{width:100%;padding:var(--sp3);border-radius:var(--r-m);
  background:var(--surface-lowest);border:1px solid var(--outline-variant);color:var(--on-surface);
  transition:border-color var(--d2) var(--e-emph),background var(--d2) var(--e-emph)}
.field textarea{min-height:180px;font-family:var(--mono);font-size:var(--fs13);line-height:1.55;resize:vertical;tab-size:2}
.field input[type=text]{min-height:42px}
/* 聚焦不再动 border-width：1.5 → 2.5 会让控件长高 2px、下面的东西整体下移 2px。
   现在 border 恒 1px，聚焦时再加一圈同色 ring（视觉 2px，布局零位移）。 */
.field:focus-within textarea,.field:focus-within input{border-color:var(--primary);
  box-shadow:0 0 0 1px var(--primary)}
.field label{display:block;font-size:var(--fs12);font-weight:700;letter-spacing:.4px;
  color:var(--on-variant);margin:0 0 var(--sp1) var(--sp1)}
.field:focus-within label{color:var(--primary)}
.hint{font-size:var(--fs12);color:var(--on-variant);margin-top:var(--sp1);line-height:1.55}
/* 需要处理才着色，与全局「正常态不上色」一致 */
.hint-warn{color:var(--on-error-container);background:var(--error-container);
  border-radius:var(--r-s);padding:var(--sp2) var(--sp3);margin-top:var(--sp2)}
.hint-warn[hidden]{display:none}
.toolbar{display:flex;align-items:center;gap:var(--sp3);flex-wrap:wrap;margin-top:var(--sp3)}
.switch-row{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp2) 0}
.switch-row .txt{flex:1;min-width:0}
.switch-row .txt b{display:block;font-size:var(--fs14);font-weight:600}
.switch-row .txt span{font-size:var(--fs12);color:var(--on-variant)}
.switch{flex:none;width:46px;height:28px;border-radius:var(--r-full);border:2px solid var(--outline);
  background:var(--surface-highest);position:relative;cursor:pointer;
  transition:background var(--d3) var(--e-spring),border-color var(--d3) var(--e-spring)}
.switch::after{content:"";position:absolute;top:50%;left:3px;width:14px;height:14px;border-radius:50%;background:var(--outline);
  transform:translateY(-50%);transition:transform var(--d4) var(--e-spring),width var(--d3) var(--e-spring),
  height var(--d3) var(--e-spring),background var(--d3) var(--e-emph)}
.switch[aria-checked=true]{background:var(--primary);border-color:var(--primary)}
.switch[aria-checked=true]::after{left:calc(100% - 23px);width:20px;height:20px;background:var(--on-primary)}
/* 开关本体 46×28 是外观，::after 已经是滑块，可点区用 ::before 撑到 48 高。 */
.switch::before{content:"";position:absolute;top:50%;left:50%;width:var(--hit);height:var(--hit);
  transform:translate(-50%,-50%)}

/* ================= 日志 ================= */
.console{background:var(--surface-lowest);border:1px solid var(--outline-variant);border-radius:var(--r-m);
  padding:var(--sp2);max-height:52vh;overflow:auto;font-family:var(--mono);font-size:var(--fs12);line-height:1.7;-webkit-overflow-scrolling:touch}
.log-line{white-space:pre-wrap;word-break:break-all;padding:3px 0;border-bottom:1px solid var(--outline-variant);color:var(--on-surface)}
.log-line:last-child{border-bottom:0}
.log-line[data-lvl=err]{background:var(--error-container);color:var(--on-error-container)}
.log-line[data-lvl=warn]{background:var(--secondary-container);color:var(--on-secondary-container)}
.log-line[data-lvl=ok]{color:var(--success)}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--surface-mid);border-radius:var(--r-full)}
.seg button{border:0;background:transparent;color:var(--on-variant);min-height:32px;padding:0 var(--sp3);
  border-radius:var(--r-full);font-size:var(--fs12);font-weight:600;cursor:pointer;
  transition:background var(--d2) var(--e-emph),color var(--d2) var(--e-emph),transform var(--d2) var(--e-spring)}
.seg button:active{transform:scale(.93)}
.seg button.is-active{background:var(--secondary-container);color:var(--on-secondary-container);font-weight:700}

/* ================= 提示条 / 对话框 / snackbar ================= */
.banner{display:flex;gap:var(--sp2);align-items:flex-start;padding:var(--sp3) var(--sp4);border-radius:var(--r-l);
  background:var(--error-container);color:var(--on-error-container);font-size:var(--fs13);line-height:1.5;
  animation:rise var(--d4) var(--e-spring) backwards}
/* .banner 自带 display:flex，会盖掉 hidden 属性的 display:none —— 必须显式补一条 */
.banner[hidden]{display:none}
.banner svg{width:18px;height:18px;flex:none;margin-top:1px}
.banner b{display:block;margin-bottom:2px}
.dialog{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:var(--sp4);background:var(--scrim)}
.dialog[hidden]{display:none}
.sheet{width:100%;max-width:460px;max-height:86vh;overflow:auto;background:var(--surface-high);border-radius:var(--r-2xl);
  padding:var(--sp4);box-shadow:var(--shadow);animation:pop var(--d3) var(--e-spring)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(16px)}}
.sheet h3{font-size:var(--fs16);font-weight:700;letter-spacing:-.2px;margin-bottom:var(--sp2)}
.sheet p{font-size:var(--fs14);color:var(--on-variant);line-height:1.55}
.sheet-actions{display:flex;justify-content:flex-end;gap:var(--sp2);margin-top:var(--sp4)}
.snackbar{position:fixed;left:50%;bottom:calc(var(--inset-bottom) + 16px);z-index:70;
  transform:translate(-50%,140%);opacity:0;max-width:min(92vw,520px);display:flex;align-items:center;gap:var(--sp2);
  padding:var(--sp2) var(--sp4);border-radius:var(--r-l);
  background:var(--surface-bright);color:var(--on-surface);box-shadow:var(--shadow);font-size:var(--fs13);
  transition:transform var(--d4) var(--e-spring),opacity var(--d2) var(--e-emph);pointer-events:none}
/* 属性选择器的值不加引号时必须是合法标识符，`1` 不是：这条原先写成 [data-show=1]，
   整条规则被解析器静默丢掉，snackbar 永远停在 translate(-50%,140%) ——
   也就是说界面提示其实一次都没出现过。 */
/* 隐藏不能只靠纵向位移：没文字的时候高度只有十几 px，140% 根本挪不出屏幕 ——
   它就这样常驻成一条"莫名其妙的白药丸"（实测量到 visibleNow=true、文本空、32×16、
   底色 oklch(.99)、18px 圆角，就在屏幕底部正中）。用 opacity 兜底，与高度无关。 */
.snackbar[data-show="1"]{transform:translate(-50%,0);opacity:1}
.snackbar[data-tone=bad]{background:var(--error-container);color:var(--on-error-container)}
.snackbar[data-tone=ok]{background:var(--success-container);color:var(--on-success-container)}
.snack-text{min-width:0}
.snack-action{flex:none;border:0;background:transparent;color:inherit;font:inherit;font-weight:700;
  padding:4px 8px;border-radius:var(--r-s);cursor:pointer}
.snack-action:active{transform:scale(.94)}

/* ================= 加载/空态 ================= */
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--outline-variant);border-top-color:var(--primary);
  animation:spin .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{height:12px;border-radius:var(--r-s);background:linear-gradient(90deg,var(--surface-mid),var(--surface-high),var(--surface-mid));
  background-size:220% 100%;animation:shimmer 1.3s infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.empty{padding:var(--sp6) var(--sp4);text-align:center;color:var(--on-variant);font-size:var(--fs13)}
.empty b{display:block;font-size:var(--fs14);color:var(--on-surface);margin-bottom:var(--sp1)}
.busy{position:fixed;inset:0;z-index:65;display:grid;place-items:center;background:var(--scrim);gap:var(--sp3)}
.busy[hidden]{display:none}
.busy div{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp3) var(--sp5);border-radius:var(--r-full);
  background:var(--surface-high);box-shadow:var(--shadow);font-size:var(--fs14);font-weight:600}
[data-stub]{opacity:.55}

/* ================= Material Web 组件 ================= */
/* 组件自带 shadow 样式；这里只做宿主布局、列表内边距和槽内容。
   列表的左右内边距归零：卡片已经有 24，再让组件加 16 会把内容左缘推到 57。 */
md-gb-button[hidden],md-gb-icon-button[hidden],md-outlined-text-field[hidden],
md-gb-switch[hidden],md-gb-list-item[hidden],md-dialog[hidden]{display:none!important}
md-gb-button>span{white-space:nowrap}
md-gb-button svg,md-gb-icon-button svg{width:18px;height:18px;fill:currentColor}
.appbar .app-back{margin-left:-10px}
.appbar .app-back svg{width:24px;height:24px}
.hero-actions md-gb-button{flex:1 1 0;min-width:0}
.toolbar md-outlined-segmented-button-set{flex:1 1 auto;min-width:0}
.search-row{display:flex;align-items:center;gap:var(--sp3);margin-top:var(--sp4)}
.search-row #appsSearch{flex:1 1 auto;min-width:0;display:block;width:auto;margin-top:0}
.search-row md-gb-button,.search-row md-gb-icon-button{flex:none}
#btnLogRefresh{margin-left:auto}
#bhInput{display:block;width:100%}
.bulkbar md-gb-button{flex:none}
.btn-danger::part(btn){background:var(--error);color:var(--on-error)}
md-gb-list-item::part(list-item){padding-inline:0;padding-block:8px}
md-gb-list-item .app-ic{width:100%;height:100%;display:grid;place-items:center;overflow:hidden;
  border-radius:inherit;background:transparent;color:inherit;font-size:var(--fs16);font-weight:700}
md-gb-list-item .app-ic img{width:100%;height:100%;object-fit:contain;display:block}
md-gb-list-item md-gb-icon-button svg{width:16px;height:16px}
.app-item.is-selectable{cursor:pointer}
.app-item::part(list-item){--avatar-color:var(--surface-high);--avatar-label-color:var(--on-variant)}
.app-item:hover::part(list-item){background:var(--md-sys-color-surface-container-high);
  border-radius:var(--md-sys-shape-corner-medium)}
.app-item.is-selected::part(list-item){background:var(--md-sys-color-secondary-container);
  color:var(--md-sys-color-on-secondary-container);border-radius:var(--md-sys-shape-corner-large)}
.home-menu .menu-title{font-size:var(--fs16);font-weight:600;line-height:1.4}
.home-menu .menu-chev{font-size:22px;line-height:1;color:var(--on-variant);opacity:.6}
.switch-row md-gb-switch{flex:none}
.dlg-title{font-size:var(--fs16);font-weight:700;letter-spacing:-.2px}
.dlg-text{font-size:var(--fs14);color:var(--on-variant);line-height:1.55}
.dlg-actions{display:flex;gap:var(--sp2);justify-content:flex-end}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<body>

<header class="appbar">
  <!-- 顶栏不放配色与深浅开关：颜色一律跟随系统（见「关于 → 取色 / 深浅」）。
       原先那两个按钮会让人不小心把界面调成和系统不一样的东西。 -->
  <div class="appbar-row">
    <md-gb-icon-button class="app-back" id="btnBack" size="sm" aria-label="返回上一级" hidden></md-gb-icon-button>
    <div style="min-width:0">
      <h1 id="pageTitle">概览</h1>
    </div>
  </div>
</header>

<div class="wrap">

  <section class="hero" id="hero">
    <div class="hero-top">
      <span class="badge" id="stateBadge" data-tone="na"><i class="dot"></i><span id="stateText">连接中…</span></span>
      <span class="ver mono" id="verChip" title="模块版本">—</span>
    </div>
    <div class="hero-count">
      <div class="count-num" id="countNum">—</div>
      <div class="count-cap">生效应用数<small id="countSub">正在读取</small></div>
      <div class="hero-actions">
        <md-gb-button color="filled" size="sm" id="btnSync"></md-gb-button>
        <md-gb-button color="tonal" size="sm" id="btnReload"></md-gb-button>
      </div>
    </div>
  </section>

  <div class="banner" id="banner" hidden>
    <span id="bannerIcon"></span>
    <div><b id="bannerTitle"></b><span id="bannerText"></span></div>
  </div>

  <main class="pages" id="pages">
    <section class="panel" id="p-over">
      <!-- 二级页入口：底栏去掉之后，三个子页都从这里进；返回在顶栏最左。
           行现在由 md-gb-list 提供，点击/焦点/涟漪都由组件处理。 -->
      <nav class="card home-menu" aria-label="二级页">
        <md-gb-list id="homeMenu">
          <md-gb-list-item data-go="apps">
            <span class="menu-title">应用列表</span>
            <span slot="trailing-text" class="menu-chev">›</span>
          </md-gb-list-item>
          <md-gb-list-item data-go="log">
            <span class="menu-title">运行日志</span>
            <span slot="trailing-text" class="menu-chev">›</span>
          </md-gb-list-item>
          <md-gb-list-item data-go="props">
            <span class="menu-title">系统属性伪装</span>
            <span slot="trailing-text" class="menu-chev">›</span>
          </md-gb-list-item>
          <!-- 四个入口现在走同一条路：都是 goTab + hash，都有返回箭头。
               「关于」以前是浮层，那一行看着一样、点下去行为不一样。 -->
          <md-gb-list-item data-go="about">
            <span class="menu-title">关于与自检</span>
            <span slot="trailing-text" class="menu-chev">›</span>
          </md-gb-list-item>
        </md-gb-list>
      </nav>
      <section class="card home-card">
        <!-- 不再放「运行状态」小标题：下面两组（同步链路 / 配置与写入）已经是同级小标题，
             叠两层同样式的标签只是多一行、多一层没有信息的层级 -->
        <div id="overBody"><div class="skeleton" style="width:70%"></div><div class="skeleton" style="width:90%;margin-top:14px"></div><div class="skeleton" style="width:55%;margin-top:14px"></div></div>
      </section>
    </section>


    <section class="card panel" id="p-apps" hidden>
      <div class="toolbar" style="margin-top:0">
        <md-outlined-segmented-button-set id="appsSeg">
          <md-outlined-segmented-button data-src="targets" label="名单" selected></md-outlined-segmented-button>
          <md-outlined-segmented-button data-src="apps" label="已安装"></md-outlined-segmented-button>
          <md-outlined-segmented-button data-src="missing" label="未纳入"></md-outlined-segmented-button>
        </md-outlined-segmented-button-set>
      </div>
      <div class="search-row">
        <md-outlined-text-field id="appsSearch" placeholder="搜索应用或包名" aria-label="搜索应用或包名"></md-outlined-text-field>
        <md-gb-button class="btn-select" id="btnSelect" color="text" size="sm" title="批量选择应用" hidden>选择</md-gb-button>
        <md-gb-icon-button id="btnAppsRefresh" size="sm" title="重新读取应用列表" aria-label="重新读取应用列表"></md-gb-icon-button>
      </div>
      <p class="hint" id="appsStat">—</p>
      <md-gb-list id="appsBody" style="margin-top:var(--sp3)"></md-gb-list>
      <div class="bulkbar" id="bulkBar" hidden>
        <span class="bulk-count" id="bulkCount">已选 0</span>
        <md-gb-button id="btnBulkAll" color="text" size="sm">全选</md-gb-button>
        <md-gb-button id="btnBulkAdd" color="filled" size="sm" disabled>加入名单</md-gb-button>
        <md-gb-button id="btnBulkExit" color="text" size="sm">取消</md-gb-button>
      </div>
    </section>

    <section class="card panel" id="p-log" hidden>
      <div class="toolbar" style="margin-top:0">
        <md-outlined-segmented-button-set id="logSeg">
          <md-outlined-segmented-button data-n="30" label="30"></md-outlined-segmented-button>
          <md-outlined-segmented-button data-n="60" label="60" selected></md-outlined-segmented-button>
          <md-outlined-segmented-button data-n="120" label="120"></md-outlined-segmented-button>
          <md-outlined-segmented-button data-n="300" label="300"></md-outlined-segmented-button>
        </md-outlined-segmented-button-set>
        <md-gb-button id="btnLogRefresh" color="outlined" size="sm"></md-gb-button>
      </div>
      <div class="toolbar" style="margin-top:var(--sp2)">
        <md-gb-button id="btnLogClear" color="text" size="sm">清空缓冲</md-gb-button>
        <div class="switch-row" style="margin-left:auto;padding:0">
          <span class="txt" style="font-size:var(--fs13)">自动刷新</span>
          <md-gb-switch id="logAuto"></md-gb-switch>
        </div>
      </div>
      <p class="hint" id="logStat">—</p>
      <div class="console" id="logBody" style="margin-top:var(--sp3)"></div>
    </section>

    <section class="card panel" id="p-props" hidden>
      <div class="switch-row">
        <span class="txt"><b>开机时重置属性</b><span id="propsSwitchHint">开机写入并复核；关闭后下次开机生效</span></span>
        <md-gb-switch id="propsSwitch"></md-gb-switch>
      </div>
      <div class="toolbar" style="margin-top:0">
        <md-gb-button id="btnPropsApply" color="filled" size="sm"></md-gb-button>
        <md-gb-button id="btnPropsRefresh" color="text" size="sm">重新读取</md-gb-button>
      </div>
      <p class="hint" id="propsStat">—</p>
      <div class="grp" id="bootHashGrp" hidden>
        <div class="grp-t">Verified Boot 哈希</div>

<script>
"use strict";

/* =========================================================

   ========================================================= */
var ICON = {
  sync: '<path d="M12 4V1L8 5l4 4V6a6 6 0 1 1-6 6H4a8 8 0 0 0 8-8Z"/>',

  apps: '<path d="M4 4h7v7H4Zm9 0h7v7h-7ZM4 13h7v7H4Zm9 0h7v7h-7Z"/>',
  logs: '<path d="M4 4h16v16H4Zm3 4v2h10V8Zm0 4v2h10v-2Zm0 4v2h6v-2Z"/>',
  tune: '<path d="M4 7h9v2H4Zm11 0h5v2h-5ZM4 15h4v2H4Zm6 0h10v2H10ZM9 5h2v6H9Zm6 8h2v6h-2Z"/>',
  back: '<path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20Z"/>',

};
function svg(name, size){
  return '<svg viewBox="0 0 24 24" fill="currentColor" width="' + (size || 24) + '" height="' + (size || 24) +
         '" aria-hidden="true">' + ICON[name] + '</svg>';
}

/* =========================================================
   1. 桥接层：Magisk / KernelSU / APatch 的 exec 接口形状不同，统一成一个
   ========================================================= */
var QUERY = new URLSearchParams(location.search);
var MODDIR = QUERY.get('mod') || '/data/adb/modules/ts-auto-add';
var SH = 'sh ' + MODDIR + '/webui.sh';
var DEMO = QUERY.get('demo') === '1';

/* 桥接探测：管理器注入的对象名与形状各家不同。
   这里不只"找一个能用的"，还把看到的全部记下来 —— 连不上时界面要能自证
   到底扫了哪些名字、各自有哪些方法，否则排查只能靠猜。 */
var BRIDGE_CANDIDATES = ['bridge', 'kernelsu', 'apatch', 'Magisk', 'magisk', 'ksu'];

function ownKeys(o){
  var a = [];
  try { a = Object.getOwnPropertyNames(o) || []; } catch (e){}
  return a;
}
function methodsOf(o){
  return ownKeys(o).filter(function (k){
    try { return typeof o[k] === 'function'; } catch (e){ return false; }
  }).slice(0, 10);
}

/* 连不上时最有用的信息是「这个 WebView 的 window 上多了什么」：
   拿一个同引擎的空白 iframe 当基线，多出来的对象就是宿主注入的 —— 下次再换一家
   管理器，不用反编译也能当场看见该认谁。 */
function injectedGlobals(){
  var base = {};
  try {
    var f = document.createElement('iframe');
    f.style.cssText = 'position:absolute;left:-9999px;width:1px;height:1px';
    document.body.appendChild(f);
    ownKeys(f.contentWindow).forEach(function (k){ base[k] = 1; });
    document.body.removeChild(f);
  } catch (e){ return []; }
  return ownKeys(window).filter(function (k){
    if (base[k] || k.length > 24) return false;
    try { var t = typeof window[k]; return t === 'object' || t === 'function'; } catch (e){ return false; }
  }).slice(0, 24);
}

function scanBridge(){
  var found = [], seen = {}, i, k, o;
  for (i = 0; i < BRIDGE_CANDIDATES.length; i++) {
    k = BRIDGE_CANDIDATES[i]; o = window[k];
    if (!o || (typeof o !== 'object' && typeof o !== 'function')) continue;
    found.push({ name: k, exec: typeof o.exec === 'function', methods: methodsOf(o) });
    seen[k] = 1;
  }
  /* 再扫一遍 window 上其它带 exec 的注入对象（有的实现名字不在常见清单里） */
  try {
    ownKeys(window).forEach(function (key){
      if (seen[key] || key.length > 24) return;
      var v;
      try { v = window[key]; } catch (e){ return; }
      if (!v || (typeof v !== 'object' && typeof v !== 'function')) return;
      if (typeof v.exec === 'function') found.push({ name: key + '（扫出）', exec: true, methods: methodsOf(v) });
    });
  } catch (e){}
  return found;
}

/* 各家注入的对象名与调用形状都不一样，逐个认：
   - KernelSU 主线：window.ksu.exec(cmd, optionsJson, 回调函数名) —— 异步！
     Java 侧算完再回调 window[回调名](errno, stdout, stderr)。
     （官方 kernelsu npm 库就是这么包的；这里不引那个库，直接照协议自己写，
       保持单文件、离线可用。）
   - bridge / kernelsu / apatch / Magisk：exec(cmd) 同步返回 {errno, stdout}，
     个别实现是 exec(cmd, callback) 回调式。 */
function pickBridge(){
  var k = window.ksu;
  if (k && typeof k.exec === 'function') return { obj: k, kind: 'ksu', label: 'ksu' };
  var named = [['bridge', window.bridge], ['kernelsu', window.kernelsu],
               ['apatch', window.apatch], ['Magisk', window.Magisk]];
  for (var i = 0; i < named.length; i++) {
    var o = named[i][1];
    if (o && typeof o.exec === 'function') return { obj: o, kind: 'sync', label: named[i][0] };
  }
  return null;
}

var HIT = DEMO ? null : pickBridge();
var BRIDGE = DEMO ? {} : (HIT ? HIT.obj : null);
var BRIDGE_KIND = DEMO ? 'demo' : (HIT ? HIT.kind : 'none');
var BRIDGE_LABEL = DEMO ? 'demo' : (HIT ? HIT.label : 'none');
var BRIDGE_SCAN = [];

/* 模块目录优先问管理器要（模块 id 改了也不用动界面） */
function moduleDirFromBridge(){
  try {
    if (BRIDGE_KIND === 'ksu' && typeof BRIDGE.moduleInfo === 'function') {
      var info = JSON.parse(BRIDGE.moduleInfo());
      var id = info && (info.id || info.moduleId);
      if (id && /^[A-Za-z0-9._-]+$/.test(id)) return '/data/adb/modules/' + id;
    }
  } catch (e){ /* 拿不到就用默认路径 */ }
  return null;
}

function normResult(v){
  if (v === undefined || v === null) return { errno: 0, stdout: '' };
  if (typeof v === 'string') return { errno: 0, stdout: v };
  var code = v.errno;
  if (code === undefined) code = v.code;
  if (code === undefined) code = 0;
  var out = v.stdout;
  if (out === undefined) out = v.result;
  if (out === undefined) out = '';
  return { errno: Number(code) || 0, stdout: String(out), timeout: !!v.timeout };
}

var cbSeq = 0;

function callExec(cmd){
  return new Promise(function (resolve){
    var done = false, timer = null, sync;
    function finish(v){
      if (done) return;
      done = true;
      if (timer) { clearTimeout(timer); timer = null; }
      resolve(normResult(v));
    }
    /* 异步桥接万一没回调回来，给个上限：不然是界面永久转圈，且看不出卡在哪 */
    timer = setTimeout(function (){ finish({ errno: 124, stdout: '命令超时（60 秒未返回）', timeout: true }); }, 60000);

    if (BRIDGE_KIND === 'ksu') {
      var name = 'tsaa_cb_' + (cbSeq++) + '_' + Date.now();
      window[name] = function (errno, stdout, stderr){
        delete window[name];
        var out = String(stdout == null ? '' : stdout);
        if (stderr) out += String(stderr);          // 命令侧已 2>&1，这里兜一手
        finish({ errno: Number(errno) || 0, stdout: out });
      };
      try {
        BRIDGE.exec(cmd, '{}', name);               // 第三个参数是"回调函数名"，不是函数
      } catch (e) {
        delete window[name];
        finish({ errno: 1, stdout: String((e && e.message) || e) });
      }
      return;
    }

    try {
      sync = BRIDGE.exec(cmd, finish);              // 同步式直接返回；回调式把结果交给 finish
    } catch (e) { finish({ errno: 1, stdout: String((e && e.message) || e) }); return; }
    if (sync !== undefined) finish(sync);
  });
}

/* 命令名固定、参数受校验，输出用 2>&1 合并好把错误文本显示出来。
   参数一律走单引号转义：boot hash 这类用户输入不能直接拼进 shell 命令。 */
function shellQuote(v){
  return "'" + String(v).replace(/'/g, "'\\''") + "'";
}
function run(cmd, arg){
  var full = SH + ' ' + cmd + (arg === undefined || arg === null || arg === '' ? '' : ' ' + shellQuote(arg)) + ' 2>&1';
  if (DEMO) return Promise.resolve(demoResult(cmd, arg));
  if (!BRIDGE) return Promise.resolve({ errno: 127, stdout: '当前管理器没有提供 root shell 执行接口' });
  return callExec(full);
}

/* key=value 文本 → 对象（只按第一个 = 切分，值里可以再有 =） */
function parseKV(text){
  var out = {};
  String(text || '').split('\n').forEach(function (line){
    var i = line.indexOf('=');
    if (i > 0) out[line.slice(0, i)] = line.slice(i + 1);
  });
  return out;
}

/* 只校验界面真正会读的键。命令层若把字段名改掉，以前会静默画成空值；
   这里让它变成一条明说的契约错误，并停写（读仍放行，先让人看到现场）。 */
var KV_REQUIRED = {
  status: 'state backend mod_version target_file target_exists daemon_alive',
  env: 'resetprop awk base64 inotify_mode root_user',
  contract: 'api commands',
  'boot-hash': 'configured current status',
  sync: 'rc count description',
  'restore-app': 'restored',
  'restore-apps': 'restored',
  'remove-apps': 'removed',
  'props-apply': 'applied mismatch',
  'props-on': 'props_masking',
  'props-off': 'props_masking',
  'props-boot-hash': 'saved applied current',
  'clear-log': 'cleared'
};
function kvMissing(cmd, text){
  var spec = KV_REQUIRED[cmd];
  if (!spec) return null;
  var kv = parseKV(text), miss = [];
  spec.split(' ').forEach(function (k){
    if (!Object.prototype.hasOwnProperty.call(kv, k)) miss.push(k);
  });
  return miss.length ? miss : null;
}

/* =========================================================
   2. 颜色与深浅：两者都只取自系统，界面不提供覆盖
   ========================================================= */
/* ---------- 取色：一律跟随系统 ---------- */
/* 取不到系统种子时的兜底，不再是"我喜欢的紫"，而是**这台机器框架自己的默认强调色**。
   实测来源：/system/framework/framework-res.apk 的 color/system_accent1_600_light
   = #4b5d8b = oklch(48.4% .078 267.2)。界面里 --primary 是 oklch(49% .19*sat hue)，
   明度档位几乎同一格，所以 sat 取 .078/.19≈0.41 就是照着平台那一个色算出来的，
   不是拍脑袋。原先的 275 + sat 1 相当于把同一支色放大到 2.5 倍彩度，
   难怪看着和系统其它地方不是一套。 */
var HUE_DEFAULT = 267;
var SAT_DEFAULT = 0.41;
var THEME = { seedRaw: '', seedSrc: 'none', frro: '', frroSrc: '', frroParsed: null, frroOk: false,
              font: '', fontSrc: '', fontFile: '', fontLoaded: null, dark: '', darkSrc: '', applied: '', note: '' };

function hex2(v){ return (v < 16 ? '0' : '') + v.toString(16); }

/* sRGB → OKLCH：系统给的是 ARGB 整数，要换成色相与彩度才能驱动这套令牌 */
function srgbToOklch(r, g, b){
  var f = function (v){ v /= 255; return v <= 0.04045 ? v/12.92 : Math.pow((v + 0.055)/1.055, 2.4); };
  var R = f(r), G = f(g), B = f(b);
  var l = Math.cbrt(0.4122214708*R + 0.5363325363*G + 0.0514459929*B);
  var m = Math.cbrt(0.2119034982*R + 0.6806995451*G + 0.1073969566*B);
  var s = Math.cbrt(0.0883024619*R + 0.2817188376*G + 0.6299787005*B);
  var a1 = 1.9779984951*l - 2.4285922050*m + 0.4505937099*s;
  var b1 = 0.0259040371*l + 0.7827717662*m - 0.8086757660*s;
  return { C: Math.sqrt(a1*a1 + b1*b1), H: (Math.atan2(b1, a1)*180/Math.PI + 360) % 360 };
}

/* 种子色的存法各系统不统一：#RRGGBB / #AARRGGBB / 0x… / 裸十六进制 / 十进制 ARGB。
   纯数字到底哪一种要分开：6 位及以内的按十六进制颜色看（"808080" 是灰色），
   超过 6 位的按十进制整数看（"16711680" 是 0xFF0000 红色）——反过来就会把灰色
   读成 0x0C5490 这种莫名其妙的深蓝。 */
function parseSeed(raw){
  var s = String(raw == null ? '' : raw).trim();
  if (!s || s === 'null' || s === 'none') return null;
  if (s.charAt(0) === '#') s = s.slice(1);
  var v = NaN, digits = s.replace(/^-/, '');
  if (/^0[xX][0-9a-fA-F]+$/.test(s)) v = parseInt(s.slice(2), 16);
  else if (/^-?\d+$/.test(s) && digits.length > 6) v = parseInt(s, 10) >>> 0;
  else if (/^[0-9a-fA-F]{8}$/.test(s)) v = parseInt(s.slice(2), 16);
  else if (/^[0-9a-fA-F]{6}$/.test(s)) v = parseInt(s, 16);
  else if (/^[0-9a-fA-F]{3}$/.test(s)) v = parseInt(s.replace(/./g, function (c){ return c + c; }), 16);
  else if (/^-?\d+$/.test(s)) v = parseInt(s, 10) >>> 0;
  if (isNaN(v)) return null;
  v = v >>> 0;
  return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
}

/* 彩度倍率直接按"要等于系统那一支"来算，不做审美放大。
   --primary 的基值是 oklch(49% .19 hue)，所以要落到系统实测的 C 就得 sat = C / .19。
   原先的映射是 0.35 + C/0.13*0.65，本机实测系统 C=.054 会被算成 .62 → 实际彩度 .118，
   又是系统值的 2.2 倍 —— 这正是"看着就不像系统的一套颜色"的来源。 */
function satFromChroma(C){ return Math.max(0.2, Math.min(1.1, C / 0.19)); }

function setPalette(h, sat, note){
  var n = parseInt(h, 10); if (isNaN(n)) n = HUE_DEFAULT;
  n = ((n % 360) + 360) % 360;
  var sv = parseFloat(sat); if (isNaN(sv)) sv = SAT_DEFAULT;
  sv = Math.max(0.2, Math.min(1.1, sv));
  var st = document.documentElement.style;
  st.setProperty('--hue', n);
  st.setProperty('--sat', sv);
  THEME.applied = n + '° / 彩度 ×' + sv.toFixed(2);
  THEME.note = note;
}

/* ---------- SystemUI 运行时 overlay（FRRO）解析 ----------
   条目形态（本机逐字节确认）：12 08 08 1c 10 <varint ARGB> 紧跟 12 <len> 0a <len2> <资源名>
   —— 值在前、名字在后成对交替；08 1c 是 ResType TYPE_INT_COLOR_ARGB8888。
   这是系统"正在拿来画东西的那套色"，用户手选颜色时它也会被重新生成，
   所以比任何 setting 都权威：本机 theme_custom_color 为 null、壁纸是渐变
   （isColorExtracted=false），前两级种子都是空的，而它里面明明白白有一套青蓝阶梯。 */
function b64ToBytes(s){
  var bin;
  try { bin = atob(String(s).replace(/\s+/g, '')); } catch (e){ return null; }
  var out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function parseFrro(b64){
  var b = b64ToBytes(b64);
  if (!b || b.length < 16) return null;
  var map = {}, n = 0, i = 0;
  while (i + 8 < b.length) {
    if (b[i] === 0x12 && b[i+1] === 0x08 && b[i+2] === 0x08 && b[i+3] === 0x1c && b[i+4] === 0x10) {
      var j = i + 5, v = 0, sh = 0, c, bad = false;
      do {
        if (j >= b.length) { bad = true; break; }
        c = b[j++]; v += (c & 0x7f) * Math.pow(2, sh); sh += 7;
      } while (c & 0x80);
      if (!bad && b[j] === 0x12) {
        var nl = b[j+1], k = j + 2;
        if (b[k] === 0x0a) {
          var sl = b[k+1], name = '';
          for (var q = 0; q < sl && k+2+q < b.length; q++) name += String.fromCharCode(b[k+2+q]);
          if (/^system_[a-z0-9_]+$/.test(name)) { map[name] = v >>> 0; n++; }
          i = k + nl;
          continue;
        }
      }
    }
    i++;
  }
  return n ? { map: map, n: n } : null;
}

/* 自检：一条 tonal 阶梯的明度必须从 0 到 1000 单调下降。
   不单调 = 配对错位，这份数据就不能信 —— 宁可退回默认，也不要画一个错颜色。
   （第一次写解析时就是靠这条抓出我把 -dynamic- 当成 -accent- 用了，
     那份里根本没有 accent1 阶梯，"解析出 94 条"看着挺多却一条都用不上。） */
var RAMP = [0, 10, 50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000];
function frroSeed(fr){
  if (!fr) return null;
  for (var t = 0; t < 2; t++) {
    var cfg = t ? 'dark' : 'light', prev = null, mono = true, got = 0, seed = null;
    for (var i = 0; i < RAMP.length; i++) {
      var v = fr.map['system_accent1_' + RAMP[i] + '_' + cfg];
      if (v === undefined) continue;
      got++;
      var o = srgbToOklch((v >> 16) & 255, (v >> 8) & 255, v & 255);
      if (prev !== null && o.L > prev + 0.005) { mono = false; break; }
      prev = o.L;
      if (RAMP[i] === 400) seed = v;
    }
    if (mono && got >= 8 && seed !== null) return seed;
  }
  return null;
}

/* 系统字体。两条路，优先第二条：
   ① 把族名写进 font-family —— 实测**不生效**（Chromium 有自己的字体映射表，
      不读 ROM 的 config_bodyFontFamily / fonts_customization.xml）；
   ② webui.sh 把系统那个 ttf 按内容哈希拷进 webroot/fonts/，这里用 @font-face
      直接加载。文件名随字体内容变，WebView 不会拿旧 URL 的缓存继续用；族名也
      按文件生成，换字体时不复用已经加载过的旧 FontFace。font-weight 声明 100 900
      是因为它是可变字体。文件加载失败时仍把族名放进栈里当第二选择。 */
function applyFont(name, pkg, file){
  var fam = /^[a-z][a-z0-9]*(-[a-z0-9]+)*$/.test(name || '') ? name : '';
  var url = /^fonts\/[a-z0-9-]+\.ttf$/.test(file || '') ? file : '';
  var st = document.documentElement.style;
  THEME.font = fam;
  THEME.fontSrc = fam ? (pkg || '') : '';
  THEME.fontFile = url;
  THEME.fontLoaded = null;
  THEME.fontFace = null;
  var use = '', face = '';

  function mark(ok){
    if (ok) THEME.fontLoaded = true;
    else if (THEME.fontLoaded !== true) THEME.fontLoaded = false;
    if (S.tab === 'about') renderAbout();
  }
  function fetchFace(){
    if (typeof window === 'undefined' || !(window.FontFace && window.fetch)) { mark(false); return; }
    window.fetch(url, { credentials: 'same-origin' }).then(function (r){
      if (!r.ok) throw new Error('font HTTP ' + r.status);
      return r.arrayBuffer();
    }).then(function (buf){
      var ff = new window.FontFace(face, buf, { style: 'normal', weight: '100 900' });
      return ff.load().then(function (){
        if (THEME.fontFace){ try { document.fonts.delete(THEME.fontFace); } catch (e){} }
        document.fonts.add(ff);
        THEME.fontFace = ff;
        mark(true);
      });
    }).catch(function (){ mark(false); });
  }

  if (url) {
    var key = url.replace(/^fonts\//, '').replace(/\.ttf$/, '').replace(/[^a-z0-9-]/g, '');
    face = 'ts-sys-' + key;
    var tag = document.getElementById('sysfont');
    if (!tag) {
      tag = document.createElement('style');
      tag.id = 'sysfont';
      document.head.appendChild(tag);
    }
    /* local() 先试系统字体管理器；文件 URL 只作后备。 */
    var srcs = [];
    if (fam) {
      srcs.push('local("' + fam + '")');
      var pretty = fam.split('-').map(function (s){
        return s.charAt(0).toUpperCase() + s.slice(1);
      }).join(' ');
      if (pretty !== fam) srcs.push('local("' + pretty + '")');
    }
    srcs.push('url("' + url + '")');
    tag.textContent = '@font-face{font-family:"' + face + '";src:' + srcs.join(',') +
      ';font-display:swap;font-weight:100 900}';
    use = '"' + face + '"';
    /* 先让浏览器按 CSS 加载；CSS 失败（管理器可能按 MIME 拦字体）时
       用 fetch 读字节再交给 FontFace，绕开字体加载器。 */
    if (document.fonts && document.fonts.load) {
      document.fonts.load('16px "' + face + '"').then(function (faces){
        if (faces && faces.length) mark(true);
        else fetchFace();
      }, fetchFace);
    } else {
      fetchFace();
    }
  } else if (fam) {
    use = '"' + fam + '"';
  }
  var stack = [];
  if (use) stack.push(use);
  if (url && fam) stack.push('"' + fam + '"');
  stack.push('system-ui', 'sans-serif');
  st.setProperty('--font', stack.join(', '));
  return use;
}

function applyPalette(){
  var rgb = null, src = '';
  var fv = frroSeed(THEME.frroParsed);
  if (fv !== null) { rgb = { r: (fv >> 16) & 255, g: (fv >> 8) & 255, b: fv & 255 }; src = 'systemui overlay'; }
  if (!rgb) { var s = parseSeed(THEME.seedRaw); if (s) { rgb = s; src = THEME.seedSrc; } }
  if (!rgb) { setPalette(HUE_DEFAULT, SAT_DEFAULT, '系统没有可读出的强调色，用平台默认 system_accent1'); return; }
  var ok = srgbToOklch(rgb.r, rgb.g, rgb.b);
  var hex = '#' + hex2(rgb.r) + hex2(rgb.g) + hex2(rgb.b);
  /* 近中性时色相没有意义（atan2 会乱转），只跟彩度、色相留默认 */
  if (ok.C < 0.02) { setPalette(HUE_DEFAULT, satFromChroma(ok.C), '系统强调色 ' + hex + ' 近中性，只跟彩度'); return; }
  setPalette(Math.round(ok.H), satFromChroma(ok.C), '跟随系统强调色 ' + hex + '（' + src + '）');
}

function timeLabel(epoch){

/* 一次 root shell 调用的包装：返回 {ok, text, code} */
function call(cmd, arg){
  /* 停在传输层而不是停在某个按钮上：以后多加一个写入口就少漏一个。 */
  if (S.contract.bad && (' ' + WRITE_CMDS + ' ').indexOf(' ' + cmd + ' ') >= 0) {
    return Promise.reject(new Error(S.contract.shape
      ? (S.contract.shape + '，已拒绝写入')
      : '命令层契约不匹配（界面要 api=' + EXPECT_API
        + '，命令层是 ' + (S.contract.api === null ? '无' : S.contract.api) + '），已拒绝写入'));
  }
  return run(cmd, arg).then(function (r){
    var res = { ok: r.errno === 0, code: r.errno, text: r.stdout, timeout: !!r.timeout };
    if (res.ok) {
      var miss = kvMissing(cmd, res.text);
      if (miss) {
        res.ok = false;
        res.shape = true;
        res.text = '命令层返回格式不一致（' + cmd + ' 缺少 ' + miss.join('、')
          + '），可能界面与命令层不是同一版';
        S.contract.bad = true;
        S.contract.shape = res.text;
      }
    }
    return res;
  });
}
/* 开机问一次就够：命令层换了版本必然是重新打开界面，而每次刷新多问一次
   要多付一次 fork（本机实测 20~90ms）。 */
function checkContract(){
  return call('contract').then(function (r){
    S.contract.checked = true;
    if (!r.ok) {
      S.contract.api = null;
      S.contract.bad = true;
      if (r.shape) S.contract.shape = r.text;
      return;
    }
    var kv = parseKV(r.text);
    S.contract.api = kv.api || null;
    S.contract.commands = kv.commands || '';
    S.contract.shape = '';
    S.contract.bad = (S.contract.api !== String(EXPECT_API));
  }, function (){ S.contract.checked = true; /* 问不到也标已试：横幅要说"读不到" */ });
}

function failText(r){
  if (r && r.timeout) return '命令超时，结果未知；已重新读取当前状态';
  var t = String(r.text || '').trim().split('\n').filter(Boolean).slice(-2).join(' ');
  return t || ('命令失败（退出码 ' + r.code + '）');
}

/* 生效集合建一次用到底：以前每次搜索、每敲一个字符都要重建一遍两百多项的表 */
function targetSetOf(){
  if (!S.targetSet) {
    S.targetSet = {};
    S.targets.forEach(function (p){ S.targetSet[p] = 1; });
  }
  return S.targetSet;
}
function monogram(s){
  var t = String(s || '');
  /* 包名取最后一段的首字母：com.google.android.gsf 与 com.termux 都以 com 开头，
     一律取第一个字符的话整页会是一片 C，等于没有区分度 */
  if (t.indexOf('.') > 0) t = t.slice(t.lastIndexOf('.') + 1);
  t = t.replace(/^[^A-Za-z一-龥]+/, '');
  return (t.charAt(0) || '?').toUpperCase();

function appAvatar(pkg, ic){
  var a = el('span', 'app-ic');
  if (ic && ic.src) {
    var img = el('img');
    /* decoding=async：一百多张 PNG 若同步解码，会让插入列表的那一帧和滚动都卡一下 */
    ICON_STATE[pkg] = 'pending';   // loading=lazy：没进视口就不算失败也不算无缓存
    img.src = ic.src; img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
    /* 成功/失败各记一格：管理器的资源处理器能不能喂出这些 PNG，这一层在桌面上
       证明不了（/data/adb 是 0700，只有它的 root 路径处理器读得到），所以让它
       自己报数，「关于 → 应用图标」里能看见"加载了几张、失败几张"。 */
    img.addEventListener('load', function (){ ICON_STATE[pkg] = 'ok'; });
    img.addEventListener('error', function (){
      ICON_STATE[pkg] = 'fail';
      a.textContent = monogram(ic.label || pkg);
    });
    a.appendChild(img);
  } else {
    ICON_STATE[pkg] = 'none';
    /* 有显示名就用显示名的首字（中文名给出汉字，比包名首字母有用） */
    a.textContent = monogram((ic && ic.label) || pkg);
  }
  return a;
}
function renderApps(){
  var srcList = S.appsSrc === 'targets' ? S.targets : S.apps;
  var inTarget = targetSetOf();
  var list = srcList;
  if (S.onlyMissing && S.appsSrc === 'apps') list = list.filter(function (p){ return !inTarget[p]; });
  if (S.search) {
    var q = S.search.toLowerCase();
    /* 现在列表上显示的是应用名，搜索只匹配包名会让人搜不到眼前看到的东西 */
    list = list.filter(function (p){
      return p.toLowerCase().indexOf(q) >= 0 ||
        (S.icons[p] && S.icons[p].label.toLowerCase().indexOf(q) >= 0);
    });
  }
  var missing = S.apps.filter(function (p){ return !inTarget[p]; }).length;
  var excl = Object.keys(S.excluded).length;
  var canRestore = hasCmd('restore-app');
  var canBatchAdd = hasCmd('restore-apps');
  var canBatchRemove = hasCmd('remove-apps');
  if (S.selectMode) {
    var invalidSel = S.appsSrc === 'targets'
      ? (!canBatchRemove || S.targets.length < 2)
      : (!canBatchAdd || !missing);
    if (invalidSel) { S.selectMode = false; S.selected = {}; }
  }
  /* 批量模式只列当前视图中可操作的行：名单视图列可移出的，已安装视图列可加入的。 */
  if (S.selectMode) {
    list = list.filter(function (p){ return S.appsSrc === 'targets' ? inTarget[p] : !inTarget[p]; });
  }
  S.selectable = S.selectMode ? list : [];
  if (S.selectMode) {
    var keepSel = {};
    Object.keys(S.selected).forEach(function (p){
      var keep = S.appsSrc === 'targets'
        ? S.targets.indexOf(p) >= 0
        : (S.apps.indexOf(p) >= 0 && !inTarget[p]);
      if (keep) keepSel[p] = 1;
    });
    S.selected = keepSel;
  }
  /* 同样的输入不重建 DOM：切回这一页不该再付一次建 130 行的钱。
