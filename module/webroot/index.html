/* 文本走系统字体：管理器的 WebView 里网页字体不生效（实测 @font-face 落地后
   仍旧退回系统字体）。图标族名不动 —— 组件把图标名当连字文本画，字体没落地
   就会把 "expand_more" 这种字面词画在界面上，那种失败肉眼可查。 */
:root{
  --md-sys-typescale-font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
  /* 安全区：管理器把 insets 注入成**自定义属性**（/internal/insets.css 生成
     --safe-area-inset-*，--window-inset-* 是它的别名），这个 WebView 里
     env(safe-area-inset-*) 恒 0 —— 只读 env 的话顶栏就不再伸到状态栏底下，
     那条缝会露成"透明缺一块"（2026-10-30 上机症状）。所以两边取大者：
     管理器注入的优先，浏览器/台架里没有注入值时退回 env()。
     第三项是命令层从 dumpsys 量出来的真实状态栏高度（dp）—— 本机注入值实测
     可能是 0，而 22px 的标题行正好钻到状态栏底下（"头被砍一半"）。 */
  --inset-top: max(var(--safe-area-inset-top, 0px), var(--window-inset-top, 0px), var(--statusbar-fallback, 0px));
  --inset-bottom: max(var(--safe-area-inset-bottom, 0px), var(--window-inset-bottom, env(safe-area-inset-bottom, 0px)));
  --bar-h: 64px;
  --nav-h: 80px;
  --gap: 20px;
  --line: var(--md-sys-color-outline-variant, #cac4d0);
  /* 状态色不再另起一套青绿：正常态用动态主色（和按钮同一族），
     只有“注意”用固定琥珀、“问题”用主题 error —— 页面不再出现第三四种主色。 */
  --kl-ok: var(--md-sys-color-primary);
  --kl-warn: #b7791f;
  --kl-bad: var(--md-sys-color-error);
  --kl-mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;
}
[data-theme=dark]{
  --kl-warn: #f2c35c;
}

html,body{margin:0;padding:0;background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface)}
body{min-height:100dvh;font-family:var(--md-sys-typescale-font-family);-webkit-font-smoothing:antialiased}

/* 壳：顶栏贴顶、底栏贴底，中间可滚动。
   用 dvh 不用 vh —— WebView 工具栏收展时 vh 会把底栏顶到屏幕外。
   状态栏让位交给**外层包壳**（#barwrap），顶栏组件自己保持原生 64px：
   在它宿主上改 padding/min-height 会把它内部的行定位算错 —— 上机实测标题
   被自己的裁切框切掉上沿（2026-10-31 用户截图）。`--inset-top` 只算管理器
   注入值与 dumpsys 兜底，**不含 env()**：env 由组件内部的 .bar 自己吃，
   两边都算就是双倍。 */
/* 顶栏固定覆盖在内容之上：大标题在内容里，随页滚走；滚动后顶栏才露出
   小标题与返回箭头。状态栏让位仍在包壳上。 */
#barwrap{position:fixed;inset:0 0 auto;z-index:20;padding-top:var(--inset-top);
  background:var(--md-sys-color-surface);
  box-shadow:0 1px 0 transparent;transition:box-shadow .2s ease}
#barwrap.scrolled{box-shadow:0 1px 0 color-mix(in srgb, var(--md-sys-color-outline-variant) 34%, transparent)}
.view{
  box-sizing:border-box;width:100%;max-width:600px;margin:0 auto;
  /* 固定顶栏占 inset+64；内容从它下面 4px 开始，页标题是内容的第一行。 */
  padding:calc(var(--inset-top) + 68px) var(--gap) calc(var(--nav-h) + var(--inset-bottom) + 16px);
  min-height:calc(100dvh - var(--nav-h));
  /* 换页从侧向推入 22px：不裁掉会短暂撑出横向滚动条，fixed 底栏跟着上下抖 */
  overflow-x:clip;
}
.page-title{font-size:28px;font-weight:500;line-height:36px;letter-spacing:-.2px;
  margin:0 0 12px;padding-inline-start:4px;overflow-wrap:anywhere}
/* 悬浮药丸底栏：不贴边、不铺满，靠模糊+阴影浮在内容上。
   长页向下滑时整体下沉缩小消失，向上滑/回顶再回来（状态由 app.js 切）。 */
.bottom-nav{position:fixed;inset-inline:0;bottom:calc(var(--inset-bottom) + 24px);z-index:30;
  box-sizing:border-box;width:fit-content;max-width:calc(100% - 32px);height:64px;margin-inline:auto;padding:6px;
  display:flex;align-items:center;justify-content:center;gap:4px;
  border-radius:999px;border:1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 38%, transparent);
  background:color-mix(in srgb, var(--navigation-container, var(--md-sys-color-surface-container)) 86%, transparent);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  box-shadow:0 10px 30px color-mix(in srgb, var(--md-sys-color-shadow, #000) 30%, transparent);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  transition:transform .26s cubic-bezier(.2,.9,.25,1),opacity .18s ease}
.bottom-nav.nav-hidden{transform:translateY(calc(100% + var(--inset-bottom) + 18px)) scale(.94);
  opacity:0;pointer-events:none}
/* 每个目的地是一个 52px 胶囊；图标永远在垂直中轴。活动项向左端扩出一个
   44px 圆（与 26px 胶囊端、外层 32px 药丸端同心），文字从圆右侧淡入。 */
.nav-item{box-sizing:border-box;height:52px;min-width:52px;flex:0 0 auto;margin:0;padding:4px;border:0;
  border-radius:26px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:transparent;color:var(--md-sys-color-on-surface-variant);
  font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background-color .22s ease,color .22s ease,padding .26s cubic-bezier(.2,.9,.25,1)}
.nav-item:active{transform:scale(.96)}
.nav-item:focus-visible{outline:2px solid var(--md-sys-color-primary);outline-offset:-2px}
.nav-halo{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  flex:none;transition:background-color .22s ease}
.nav-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  font-family:var(--md-icon-font-family);font-size:24px;line-height:1;transition:color .22s ease}
.nav-label{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transform:translateX(-4px);
  font-size:13px;font-weight:650;
  /* 淡出比宽度收缩快：切换时先看不到半截字，胶囊再慢慢收 */
  transition:max-width .26s cubic-bezier(.2,.9,.25,1),opacity .12s ease,transform .26s ease}
.nav-item.active{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);
  padding:4px 16px 4px 4px}
.nav-item.active .nav-halo{background:color-mix(in srgb, var(--md-sys-color-surface) 22%, transparent)}
.nav-item.active .nav-label{max-width:64px;opacity:1;transform:none}
/* 长按拿起活动圆：源格变淡，拖动的圆浮在导航之上；目标格的光圈亮起 */
.bottom-nav.nav-dragging .nav-item.active{background:color-mix(in srgb, var(--md-sys-color-secondary-container) 42%, transparent)}
.bottom-nav.nav-dragging .nav-item.active .nav-halo{opacity:.25}
.bottom-nav.nav-dragging .nav-item.active .nav-label{opacity:0!important}
.nav-item.drag-over{background:color-mix(in srgb, var(--md-sys-color-primary) 12%, transparent)}
.nav-item.drag-over .nav-halo{background:color-mix(in srgb, var(--md-sys-color-primary) 22%, transparent)}
.nav-item.drag-over .nav-icon{color:var(--md-sys-color-primary)}
.nav-ghost{position:fixed;z-index:45;width:44px;height:44px;border-radius:50%;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);
  box-shadow:0 10px 26px color-mix(in srgb, var(--md-sys-color-shadow, #000) 38%, transparent);
  transform:scale(1.06);will-change:left,top}
md-snackbar{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--inset-bottom) + 12px);z-index:60;transform:translateX(-50%)}

.stack{display:flex;flex-direction:column;gap:var(--gap)}
/* 卡片退成透明布局壳：参考图里的"组"就是行本身，没有外框 ——
   页面背景直接露出来，行才是唯一的面。只有主页英雄卡保留自己的面。 */
md-card.card{--md-card-container-color:transparent;--md-card-padding:0}
.card{display:block;padding:0}
md-card.hero{--md-card-container-color:var(--md-sys-color-surface-container-high);
  --md-card-padding:18px;border-radius:22px;color:var(--md-sys-color-on-surface)}
.sec{display:block}
/* 分组标题：14px/500/主色，不带图标。
   图标留给行首，一个区块标题不再占一个彩色圆点。 */
.sec-h{display:flex;align-items:center;gap:8px;margin:0 4px 8px}
/* 分组标题的光圈点：外环 + 中心点，和主页的镜头标识同源 */
.sec-h::before{content:"";width:8px;height:8px;flex:none;border-radius:50%;
  border:1.5px solid var(--md-sys-color-primary);
  background:radial-gradient(circle at center, var(--md-sys-color-primary) 0 1.4px, transparent 1.6px)}
.sec-h b{font-size:14px;font-weight:500;letter-spacing:0;color:var(--md-sys-color-primary)}

/* 状态芯片：只有"要处理"的才着色，正常态不上色 */
.chip{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;
  background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface-variant)}
.chip-ok{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container)}
.chip-warn{background:color-mix(in srgb, var(--kl-warn) 18%, transparent);color:var(--kl-warn)}
.chip-bad{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container)}
.chip-none{background:var(--md-sys-color-surface-container);color:var(--md-sys-color-on-surface-variant)}

.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
/* 表单节奏：字段之间 14px；开关/下拉行两端对齐、给足触控高度（以前 .row 一点样式都没有） */
/* 表单是一块"面"：编辑区与只读行面、分组标题拉开层次（以前字段裸在页面底上） */
.form{display:flex;flex-direction:column;gap:14px;margin-top:12px;
  background:var(--md-sys-color-surface-container);border-radius:16px;padding:16px 14px}
.form-sub{font-size:13px;font-weight:500;color:var(--md-sys-color-on-surface-variant);margin-top:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
/* 长标签（如"日志级别（可写 warning/off/prop）"）折行而不是被 nowrap 挤出去：
   下拉固定一个舒适宽度，标签自己占剩下的。 */
.row-t{font-size:15px;min-width:0;overflow-wrap:anywhere}
.row md-select{flex:0 1 210px;min-width:0;margin-left:12px}
/* 属性行的状态点：一行一个色点，ok=主色 / 读不到=tertiary / 不符=error */
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:block;margin:0 6px 0 2px}
.dot-ok{background:var(--kl-ok)}
.dot-warn{background:var(--kl-warn)}
.dot-bad{background:var(--kl-bad)}
.dot-none{background:var(--md-sys-color-outline)}
/* 筛选芯片一行横滚（名单 129 / 已装 125 / 未纳入 / 已排除 在 417px 放不下）：
   不折行、可横滑、隐藏滚动条 —— 折成两排会把首屏往下顶两行。 */
.acts.filter-grid{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.acts.filter-grid::-webkit-scrollbar{display:none}
.acts.filter-grid md-chip{flex:0 0 auto}
/* 名单页的吸顶层：芯片 + 搜索 + 计数一起吸在固定顶栏下面。
   129 行往下滚二十行就够不着搜索框了 —— "想搜得先滚回顶部"在触屏上等于没有搜索。
   只吸这三样（NN/g 吸顶头：尽可能小、高对比、别浪费屏），说明句和列表照常滚走。
   注意父级 .page 的入场动画带 transform：动画期间 sticky 会相对它算，
   300ms 后 transform 撤掉才回到视口坐标 —— 所以别给这条动画加 fill-mode。 */
.list-head{position:sticky;top:calc(var(--inset-top) + var(--bar-h));z-index:8;
  background:var(--md-sys-color-surface);padding:6px 0 8px}
.list-head .hint{margin-top:8px;font-size:12px}
.view-note{margin-top:10px}
.stale-row{margin-top:10px}
/* 溢出时钉一道右侧渐隐（sticky 伪元素，不随内容划走）：
   让人看出"后面还有"，而不是把半颗芯片切在边上当装饰。 */
.acts.filter-grid[data-scrolls]::after{content:'';flex:0 0 26px;position:sticky;right:0;align-self:stretch;
  background:linear-gradient(to right,transparent,var(--md-sys-color-surface))}
/* 主页英雄卡：状态芯片 + 大字后端名 + 三个小统计。
   以前是四段小字用 · 连成一行（.strip-*），信息都在但要凑近读。 */
.hero .hero-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
/* 品牌标识（淡粉底 + 墨色 KL），只换字符；图片构建时内联 */
.kl-logo{box-sizing:border-box;width:56px;height:56px;border-radius:16px;flex:none;display:block;
  object-fit:cover;background:#FCE4EC;
  border:1px solid color-mix(in srgb, #031019 14%, transparent)}
/* 打开 WebUI 的启动页：品牌先出现，壳与数据在下面画好后再整层淡出。
   盖住空壳但不遮住 snackbar（z 55 < 60），启动失败的红条仍能看见。 */
.boot-splash{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;
  background:var(--md-sys-color-surface);opacity:1;transition:opacity .28s ease}
.boot-splash.out{opacity:0}
.boot-brand{display:flex;flex-direction:column;align-items:center;gap:8px;
  animation:boot-brand-in .4s cubic-bezier(.2,.8,.2,1) both}
.boot-logo{width:76px;height:76px;border-radius:22px;margin-bottom:6px;
  box-shadow:0 12px 36px color-mix(in srgb, var(--md-sys-color-shadow, #000) 28%, transparent)}
.boot-name{font-size:24px;font-weight:600;line-height:1.2;letter-spacing:-.2px;
  color:var(--md-sys-color-on-surface)}
.boot-sub{font-size:13px;line-height:1.5;color:var(--md-sys-color-on-surface-variant)}
/* 细圆环而不是 MD3E 的变形指示器：启动页里它是一颗蓝色齿轮，抢品牌标识。 */
.boot-spin{width:22px;height:22px;margin-top:12px;border-radius:50%;
  border:2px solid color-mix(in srgb, var(--md-sys-color-primary) 20%, transparent);
  border-top-color:var(--md-sys-color-primary);animation:boot-spin .9s linear infinite}
@keyframes boot-brand-in{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes boot-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){
  .boot-brand{animation:none}
  .boot-spin{animation:none}
  .boot-splash{transition:none}
}
.hero-id{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 auto}
.brand-eyebrow{font-size:10px;line-height:14px;font-weight:650;letter-spacing:.18em;
  color:var(--md-sys-color-on-surface-variant)}
.hero-name{font-size:var(--md-sys-typescale-size-headline-small, 24px);line-height:1.25;
  letter-spacing:-.3px;min-width:0;overflow-wrap:anywhere}
.hero-ver{font-size:12px;line-height:18px;padding:2px 8px;border-radius:999px;white-space:nowrap;
  align-self:flex-start;margin-top:2px;
  background:var(--md-sys-color-surface-container-highest);
  color:var(--md-sys-color-on-surface-variant);font-variant-numeric:tabular-nums}
.hero-state{margin-inline-start:auto;flex:none}
.hero-stats{display:flex;gap:28px;margin-top:14px;flex-wrap:wrap}
.hero-stat{display:flex;flex-direction:column;gap:2px}
.hero-k{font-size:13px;color:var(--md-sys-color-on-surface-variant)}
.hero-v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
/* 体检并到主页大卡片之后：第四格是结论（未跑 / N 项有问题 / 都过），结论用色不用堆表情；
   按钮与逐行结果跟在统计下面，同一张卡里展开，靠一道分隔线分开而不是再起一张卡。 */
.hero-v.is-bad{color:var(--md-sys-color-error)}
.hero-v.is-warn{color:var(--kl-warn)}
.hero-v.is-ok{color:var(--md-sys-color-primary)}
.hero-doctor{margin-top:16px;padding-top:4px;
  border-top:1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 42%, transparent)}
.hero-doctor .acts{margin-top:12px}
.sec-h b{min-width:0;overflow-wrap:anywhere}
/* 功能菜单行尾的箭头：icon 字体画连字，颜色退一档不抢行 */
.nav-ic{font-family:var(--md-icon-font-family);font-size:20px;line-height:1;color:var(--md-sys-color-on-surface-variant)}
md-list{display:block}
/* 搜索框与第一行之间留一口气（以前 2px 的缝，看着像粘住） */
/* 版块间距：同类行/芯片贴紧（2–8px），不同类的内容之间至少 16–20px。
   搜索框、筛选芯片、名单、日志台是四种东西，粘在一起时分不清边界。 */
md-text-field + md-list, md-text-field + .app-list{margin-top:20px}
.acts.filter-grid + md-text-field{margin-top:16px}
.hint + .acts{margin-top:16px}
md-list + .hint, .app-list + .hint{margin-top:12px}
.acts + .row{margin-top:12px}
/* 列表 / 按钮 / 输入框 / 表单是四类块：两两之间留 16–20px。
   属性伪装页的「按钮夹在两段属性列表之间」与「输入框贴着应用值」就是缺这组规则。 */
md-list + .acts{margin-top:20px}
.acts + md-list{margin-top:20px}
md-list + md-text-field{margin-top:20px}
md-text-field + .acts{margin-top:16px}
md-list + .form{margin-top:20px}
.form + .acts{margin-top:16px}
.form + md-list{margin-top:20px}
/* keybox 的多行框占满整行，和上方的说明/列表分开 */
.kb-field{width:100%;margin-top:18px}
/* 分组列表（2026-10-31 用户给的参考图，一比一）：
   · 一个 md-list = 一组：首行只把**上角**放大、末行只把**下角**放大，中间行小圆角 ——
     整组看起来是一个大圆角容器被行切开的样子；
   · 行距 2px：贴得近，但没有贴在一起；
   · 行本身是一块面（底色与圆角在 rowSkin 的 .item 上，宿主这里的圆角被
     `border-radius:inherit` 继承进去）。
   行与行之间露出的是页面背景（卡片已退成透明壳），所以缝是暗的，和参考图一致。 */
#view md-list md-list-item{border-radius:6px;margin-bottom:2px}
#view md-list md-list-item:first-child{border-top-left-radius:22px;border-top-right-radius:22px}
#view md-list md-list-item:last-child{border-bottom-left-radius:22px;border-bottom-right-radius:22px;margin-bottom:0}
/* 目标名单的轻量行（不用 md-list-item）：4 倍 CPU 限速下 129 行 div 43ms，
   md-list-item 881ms —— 后者就是"点进二级页卡一下"的根因。外观与 md-list
   分组一致：72px、surface-container、组首/末 22px 圆角、2px 缝；行尾按钮
   也走原生 <button>（图标字体连字 / 文本按钮），不再每行带一个组件。 */
.app-list{display:flex;flex-direction:column;gap:2px}
/* 行尾复选框（照 Tricky-Addon）：勾选态就是"这条在名单里"，整行可点。
   已选的行铺一层 tonal 色，配合"已选排最前"，一屏之内先看见自己选过的那些。 */
.app-row{box-sizing:border-box;display:flex;align-items:center;gap:12px;min-height:72px;padding:0 16px;
  border-radius:6px;background:var(--md-sys-color-surface-container);color:var(--md-sys-color-on-surface);
  cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .12s ease}
.app-row.is-in{background:var(--md-sys-color-secondary-container)}
.app-row.is-in .app-row-title,.app-row.is-in .app-row-sub{color:var(--md-sys-color-on-secondary-container)}
.app-row:active{border-radius:16px}
.app-row-check{flex:none;font-family:var(--md-icon-font-family);font-size:24px;line-height:1;
  font-variation-settings:'FILL' 1,'wght' 400;color:var(--md-sys-color-primary)}
.app-list > .app-row:first-child{border-top-left-radius:22px;border-top-right-radius:22px}
.app-list > .app-row:last-child{border-bottom-left-radius:22px;border-bottom-right-radius:22px}
.app-row-text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center}
.app-row-title{font-size:16px;font-weight:500;line-height:22px;letter-spacing:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-row-sub{font-family:var(--kl-mono);font-size:13px;line-height:20px;letter-spacing:0;
  color:var(--md-sys-color-on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 「已纳入」角标已退役：整行点选 + 行尾复选框 + 已选排最前，三样加起来比一枚角标清楚
   （主人点名过"哪些选了哪些没选都不明了"，照 Tricky-Addon 的做法重做了）。 */
.app-row-mode{box-sizing:border-box;height:40px;flex:none;padding:0 12px;border:0;border-radius:20px;background:transparent;
  color:var(--md-sys-color-primary);font-size:14px;font-weight:500;line-height:20px;font-family:inherit;white-space:nowrap;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.app-row-mode:active{background:color-mix(in srgb, var(--md-sys-color-primary) 10%, transparent)}
.app-row-mode[data-tone="warn"]{color:var(--kl-warn)}
.app-row-mode[data-tone="bad"]{color:var(--kl-bad)}
md-list-item[data-tone="bad"]{--md-list-item-supporting-text-color:var(--md-sys-color-on-error-container)}
md-list-item[data-tone="warn"]{outline:1px solid color-mix(in srgb, var(--kl-warn) 38%, transparent);outline-offset:-2px;border-radius:12px}
.hint{font-size:13px;line-height:1.65;color:var(--md-sys-color-on-surface-variant);margin:10px 4px 0}
/* 全选 / 反选 / 全不选：右对齐一行文字按钮，禁用时灰色（会清空名单的那一下不给） */
.bulk-row{display:flex;align-items:center;gap:4px;justify-content:flex-end;padding:0 4px}
.bulk-row .hint{margin:0;flex:1 1 auto;text-align:right}
/* 过渡加载页（骨架屏）：骨架填满首屏、形状与真实内容一致，数据到齐后整页替换。
   只做很轻的呼吸，不做扫光 —— 扫光在长页上像进度条，反而让人误以为卡住。 */
.load-card{display:flex;flex-direction:column;gap:16px;animation:sk-pulse 1.6s ease-in-out infinite}
.sk-hints{display:flex;flex-direction:column;gap:9px;padding:0 4px}
.sk-line{display:block;height:11px;border-radius:6px;background:var(--md-sys-color-surface-container-highest)}
.sk-chips{display:flex;gap:8px}
.sk-chip{height:32px;border-radius:999px;flex:none;background:var(--md-sys-color-surface-container-high)}
.sk-search{height:56px;border-radius:12px;background:var(--md-sys-color-surface-container-highest)}
/* 主页骨架：英雄卡 + 三家矩阵，形状和真主页对齐 */
.sk-hero{background:var(--md-sys-color-surface-container-high);border-radius:22px;padding:18px;
  display:flex;flex-direction:column;gap:18px}
.sk-hero-top{display:flex;align-items:center;gap:12px}
.sk-hero-logo{width:56px;height:56px;border-radius:16px;flex:none;
  background:var(--md-sys-color-surface-container-highest)}
.sk-hero-stats{display:flex;gap:26px}
.sk-stat{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.sk-stat .sk-line{height:10px}
.sk-rows{display:flex;flex-direction:column;gap:2px}
.sk-row{height:72px;display:flex;align-items:center;gap:16px;padding:0 16px;border-radius:6px;
  background:var(--md-sys-color-surface-container)}
.sk-rows > .sk-row:first-child{border-top-left-radius:22px;border-top-right-radius:22px}
.sk-rows > .sk-row:last-child{border-bottom-left-radius:22px;border-bottom-right-radius:22px}
.sk-ic{width:40px;height:40px;border-radius:12px;flex:none;background:var(--md-sys-color-surface-container-highest)}
.sk-lines{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.sk-console{height:46vh;min-height:220px;border-radius:16px;border:1px solid var(--line);
  background:var(--md-sys-color-surface-container-lowest);padding:12px;display:flex;flex-direction:column;gap:11px}
.sk-cline{display:block;height:10px;border-radius:5px;background:var(--md-sys-color-surface-container-high)}
@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.load-card{animation:none}}
/* 页脚：短页下半屏的空白因此显得是有意留的，也顺手报出版本/契约/机型 */
.page-foot{font-size:13px;color:var(--md-sys-color-outline);text-align:center;margin:28px 0 8px}
.page-foot::before{content:"";display:inline-block;width:7px;height:7px;border:1.5px solid currentColor;
  border-radius:50%;margin-inline-end:6px;vertical-align:.5px;opacity:.8}
/* 切页动画：整页（标题 + 内容 + 页脚）一起淡入/推入，方向由 --page-dx 给。
   只在**换页**时播（draw() 里按 tab/sub 变化加 .page-in）：搜索框每次按键都会
   重画同一页，若无条件播动画就会闪。合成层只动 opacity/transform。
   不做纵向位移与缩放：名单页高近万像素，整页 translateY/scale 会让视口顶部的
   标题跟着上下位移几十像素（缩放原点在整页中心），看起来就是"页面突然拉高"。 */
.page{display:flex;flex-direction:column;min-width:0}
#view > .page.page-in{animation:page-in 300ms cubic-bezier(.175,.885,.32,1.275)}
@keyframes page-in{from{opacity:0;transform:translate3d(var(--page-dx,16px),0,0)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){#view > .page.page-in{animation:none}}
/* 大块内容切换的过渡：骨架页/旧页整页克隆成固定遮罩，新内容先在底下就位，
   遮罩 200ms 淡出 —— 不再"啪"一下从骨架换成整页。z-index 在内容之上、
   顶栏 20 / 底栏 30 之下；pointer-events:none 不挡操作。 */
.swap-veil{position:fixed;z-index:15;pointer-events:none;overflow:hidden;
  background:var(--md-sys-color-surface);opacity:1;transition:opacity .2s ease}
.swap-veil.out{opacity:0}
/* 行首图标：单色轮廓图标，无底色块。
   彩色只留给状态与操作按钮；应用列表里的真实图标是内容，不在此列。 */
.ic-avatar{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  flex:none;font-family:var(--md-icon-font-family);font-size:24px;line-height:1;
  font-variation-settings:'FILL' 0,'wght' 400;
  color:var(--md-sys-color-on-surface-variant);background:transparent}
/* 名单的应用图标走 img/首字块，与行首图标同一尺寸/圆角（md-list 与轻量行共用） */
#view img.app-ic{width:40px;height:40px;border-radius:12px;flex:none;object-fit:cover;display:block}
/* 图标缺失时的首字块：同尺寸同圆角，用容器色，不抢眼 */
#view .app-ic-fallback{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.empty{font-size:13px;color:var(--md-sys-color-on-surface-variant);margin:6px 0 0}
.read-err{font-size:12px;line-height:1.55;margin:10px 0 0;color:var(--md-sys-color-on-error-container);background:var(--md-sys-color-error-container);padding:8px 12px;border-radius:12px}
.warn-text{margin:0;font-size:14px;line-height:1.5}

/* 日志台：三列网格，图标列恒占宽 —— 没有级别的行也要把正文对齐到同一条竖线 */
.console{
  margin-top:16px;padding:8px;border:1px solid var(--line);border-radius:16px;
  background:var(--md-sys-color-surface-container-lowest);
  font-family:ui-monospace, SFMono-Regular, Cutive Mono, Menlo, monospace;font-size:12px;line-height:1.7;
  max-height:46vh;overflow:auto;-webkit-overflow-scrolling:touch}
.console.tall{max-height:62vh}
.log-line{display:grid;grid-template-columns:auto 16px minmax(0,1fr);column-gap:8px;
  align-items:baseline;padding:3px 4px;border-radius:6px}
.log-time{color:var(--md-sys-color-on-surface-variant);white-space:nowrap}
.log-lvl{text-align:center;font-weight:700}
.log-msg{min-width:0;white-space:pre-wrap;word-break:break-all}
.log-line.t-bad{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container)}
.log-line.t-warn{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.log-line.t-ok .log-msg{color:var(--md-sys-color-primary)}

/* 写前 diff 预览：行级差异块。+ 主色 / - 错误色，等宽对齐看改动。 */
.diffbox{margin-top:10px;max-height:46vh;overflow:auto;border:1px solid var(--md-sys-color-outline-variant);
  border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.5;overflow-wrap:anywhere;
  background:var(--md-sys-color-surface-container-lowest)}
.diff-line{white-space:pre-wrap;border-radius:6px;padding:1px 6px}
.diff-line.t-add{color:var(--md-sys-color-primary);background:color-mix(in oklab,var(--md-sys-color-primary) 10%,transparent)}
.diff-line.t-del{color:var(--md-sys-color-error);background:color-mix(in oklab,var(--md-sys-color-error) 10%,transparent)}
</style>
</head>

  .switch-root {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 32px;
    box-sizing: border-box;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .switch-root:focus { outline: none; }
  .switch-root::after {
    content: ''; position: absolute; width: max(100%, 48px); height: max(100%, 48px);
    left: 50%; top: 50%; transform: translate(-50%, -50%);

  .track {

    width: 52px;
    height: 32px;
    border-radius: 9999px;

    --_md-switch-border: var(--md-sys-color-outline);
    --_md-switch-track: var(--md-sys-color-surface-container-highest);
    border: 2px solid var(--_md-switch-border);

    outline: none;
  }

  .track.checked {
    --_md-switch-track: var(--md-sys-color-primary);
    --_md-switch-border: transparent;
  }

  /* Handle: 16x16dp unselected -> 24x24dp selected -> 28x28dp pressed */

    position: absolute;
    top: 50%;
    inset-inline-start: 6px;
    width: 16px;
    height: 16px;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .handle {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 9999px;
    --_md-switch-handle: var(--md-sys-color-outline);
    --_md-switch-icon: var(--md-switch-icon-color, var(--md-sys-color-surface-container-highest));

    color: var(--_md-switch-icon);

    align-items: center;
    justify-content: center;
