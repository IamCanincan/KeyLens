<!DOCTYPE html>
<html lang="zh-CN" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00000000">
<title>TS-AUTO-ADD</title>
<!--
  MD3E（Material 3 Expressive）单文件界面。

  为什么是一个文件：管理器用 file:// 加载 webroot/index.html，部分实现不解析子资源路径，
  拆成 css/js 反而容易白屏；离线可用也要求不引 CDN。

  数据全部来自 sh <模块目录>/webui.sh <命令>（root shell），界面自身不猜任何状态。
  设备数据一律用 textContent 写入，不走 innerHTML。
-->
<style>
/* ================= 设计令牌 ================= */
:root{
  --hue: 267;            /* 主色相：兜底值取平台默认强调色，见 JS 里 HUE_DEFAULT 的出处 */
  --sat: .41;            /* 彩度倍率：系统强调色偏灰就整体降下来 */
  --e-spring: cubic-bezier(.06,.71,.1,1);
  --e-emph: cubic-bezier(.3,0,.08,1);
  --e-spatial: cubic-bezier(.2,0,0,1);
  --d1: 120ms; --d2: 220ms; --d3: 340ms; --d4: 500ms;
  /* 密度。两轮抱怨的方向是相反的（先是「太松太大」，收紧之后变成「很挤」），
     所以这里把松紧集中成两组令牌：只改这两行就能整体调档，不用逐条找。 */
  --r-xs: 8px; --r-s: 10px; --r-m: 14px; --r-l: 18px;
  --r-xl: 20px; --r-2xl: 24px; --r-full: 999px;
  --sp1: 4px; --sp2: 8px; --sp3: 12px; --sp4: 16px; --sp5: 20px; --sp6: 26px; --sp7: 32px;
  /* 内容列宽上限：真机 WebView 是 626 CSS px 宽（1644px @420dpi）。
     上限只负责别拉成横屏条，真正的空洞靠下面的自适应网格切掉——
     所以这里留 600，让卡片里放得下两到三格。 */
  --measure: 600px;
  --hair: 1px solid var(--outline-variant);
  /* 系统栏让位量。界面**不请求** edge-to-edge（原因见 adoptBridge 里的注释），
     宿主会把 WebView 用 padding 顶到状态栏下面，这时 env() 恒为 0、不需要额外留白。
     但模板里仍只读这两个令牌、不把 env() 散在四处：哪天宿主自己改成 edge-to-edge，
     改这两行就够，不用去动 appbar / 吸顶标签 / body / snackbar。 */
  --inset-top: env(safe-area-inset-top);
  --inset-bottom: env(safe-area-inset-bottom);
  /* 不写死 Roboto / Segoe UI / 微软雅黑：那几个名字会**抢在系统字体之前**匹配上。
     WebView 在 Android 上有自己的一套字体映射（sans-serif 默认就是 Roboto），
     根本不读框架的 config_bodyFontFamily，所以 ROM 换了系统字体时界面会退回 Roboto。
     真名字由 env 的 sys_font 从设备上读出来再注入（见 webui.sh 的「系统字体」段）。 */
  --font: system-ui, sans-serif;
  /* 同样不写死具体名字：Menlo / Consolas 在这台机器上永远匹配不到，
     ui-monospace 与 monospace 才是系统自带的那一支等宽字 */
  --mono: ui-monospace, monospace;
}

:root,[data-scheme=light]{
  --primary:oklch(49% calc(.19*var(--sat)) var(--hue));            --on-primary:oklch(100% 0 0);
  --primary-container:oklch(92% calc(.06*var(--sat)) var(--hue));  --on-primary-container:oklch(28% calc(.13*var(--sat)) var(--hue));
  --secondary:oklch(53% calc(.11*var(--sat)) var(--hue));          --on-secondary:oklch(100% 0 0);
  --secondary-container:oklch(92% calc(.05*var(--sat)) var(--hue));--on-secondary-container:oklch(32% calc(.08*var(--sat)) var(--hue));
  --error:oklch(50% .21 27);                      --on-error:oklch(100% 0 0);
  --error-container:oklch(94% .07 27);            --on-error-container:oklch(30% .14 27);
  /* 「一切正常」不能借用任何随系统色相变化的角色：色相一调它可能正好落到橙红上，
     正常态就显示成警告色。成功态单独一套固定绿。 */
  --success:oklch(45% .14 155);                   --on-success:oklch(100% 0 0);
  --success-container:oklch(92% .07 155);         --on-success-container:oklch(26% .10 155);
  --surface:oklch(98.5% calc(.008*var(--sat)) var(--hue));        --on-surface:oklch(22% calc(.03*var(--sat)) var(--hue));
  --surface-lowest:oklch(100% 0 0);               --surface-low:oklch(96.5% calc(.012*var(--sat)) var(--hue));
  --surface-mid:oklch(95% calc(.015*var(--sat)) var(--hue));      --surface-high:oklch(92% calc(.018*var(--sat)) var(--hue));
  --surface-highest:oklch(89% calc(.02*var(--sat)) var(--hue));   --surface-bright:oklch(99% calc(.01*var(--sat)) var(--hue));
  --on-variant:oklch(45% calc(.025*var(--sat)) var(--hue));       --outline:oklch(66% calc(.02*var(--sat)) var(--hue));
  --outline-variant:oklch(85% calc(.015*var(--sat)) var(--hue));  --scrim:oklch(35% 0 0 / 45%);
  /* 阴影只留一层极轻的接触影，卡片之间的分隔交给 hairline：
     宽画布上大投影会把"浮起来的果冻"叠成一片糊 */
  --shadow:0 1px 2px oklch(30% .04 var(--hue) / 10%);
}
[data-scheme=dark]{
  --primary:oklch(80% calc(.13*var(--sat)) var(--hue));            --on-primary:oklch(30% calc(.14*var(--sat)) var(--hue));
  --primary-container:oklch(42% calc(.16*var(--sat)) var(--hue));  --on-primary-container:oklch(90% calc(.07*var(--sat)) var(--hue));
  --secondary:oklch(80% calc(.09*var(--sat)) var(--hue));          --on-secondary:oklch(30% calc(.06*var(--sat)) var(--hue));
  --secondary-container:oklch(40% calc(.10*var(--sat)) var(--hue));--on-secondary-container:oklch(90% calc(.05*var(--sat)) var(--hue));
  --error:oklch(84% .14 27);                      --on-error:oklch(30% .12 27);
  --error-container:oklch(44% .18 27);            --on-error-container:oklch(93% .06 27);
  --success:oklch(80% .14 155);                   --on-success:oklch(24% .09 155);
  --success-container:oklch(32% .10 155);         --on-success-container:oklch(91% .07 155);
  --surface:oklch(19% calc(.015*var(--sat)) var(--hue));           --on-surface:oklch(92% calc(.012*var(--sat)) var(--hue));
  --surface-lowest:oklch(14% calc(.01*var(--sat)) var(--hue));     --surface-low:oklch(22% calc(.016*var(--sat)) var(--hue));
  --surface-mid:oklch(24% calc(.018*var(--sat)) var(--hue));       --surface-high:oklch(27% calc(.02*var(--sat)) var(--hue));
  --surface-highest:oklch(31% calc(.022*var(--sat)) var(--hue));   --surface-bright:oklch(33% calc(.022*var(--sat)) var(--hue));
  --on-variant:oklch(74% calc(.02*var(--sat)) var(--hue));         --outline:oklch(60% calc(.02*var(--sat)) var(--hue));
  --outline-variant:oklch(42% calc(.02*var(--sat)) var(--hue));    --scrim:oklch(0% 0 0 / 55%);
  --shadow:0 1px 2px oklch(0% 0 0 / 35%);
}

/* 守卫条件连同 calc() 一起测：只支持裸 oklch 而不支持 oklch 内 calc 的引擎，
   会整条颜色失效，所以这种情况直接退回固定十六进制配色 */
@supports not (color: oklch(50% calc(.1*1) 200)){
  :root,[data-scheme=light]{
    --primary:#5b48c8;--on-primary:#fff;--primary-container:#e5defd;--on-primary-container:#22146b;
    --secondary:#5d5a72;--on-secondary:#fff;--secondary-container:#e3dff6;--on-secondary-container:#1a172b;
    --error:#b3261e;--on-error:#fff;--error-container:#f9dedc;--on-error-container:#410e0b;
    --success:#116a46;--on-success:#fff;--success-container:#c5edda;--on-success-container:#00331e;
    --surface:#fbf8ff;--on-surface:#1b1b21;--surface-lowest:#fff;--surface-low:#f5f2fa;--surface-mid:#efecf4;
    --surface-high:#e9e5ee;--surface-highest:#e3dfe8;--surface-bright:#fff;
    --on-variant:#47464f;--outline:#787680;--outline-variant:#c9c6d0;--scrim:rgba(0,0,0,.45);--shadow:0 2px 16px rgba(0,0,0,.14);
  }
  [data-scheme=dark]{
    --primary:#c9bffd;--on-primary:#37279a;--primary-container:#4435b0;--on-primary-container:#e5defd;
    --secondary:#c7c2dc;--on-secondary:#2f2d3f;--secondary-container:#49475b;--on-secondary-container:#e3dff6;
    --error:#ffb4ab;--on-error:#691e16;--error-container:#93000e;--on-error-container:#ffdad6;
    --success:#8ad4b0;--on-success:#00392a;--success-container:#005240;--on-success-container:#c5edda;
    --surface:#1b1b21;--on-surface:#e5e1e9;--surface-lowest:#111116;--surface-low:#232329;--surface-mid:#1e1e24;
    --surface-high:#2c2c33;--surface-highest:#33333a;--surface-bright:#3a3a42;
    --on-variant:#c9c5cf;--outline:#938f99;--outline-variant:#494750;--scrim:rgba(0,0,0,.6);--shadow:0 2px 16px rgba(0,0,0,.4);
  }
}

/* ================= 基础 ================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--surface);color:var(--on-surface);font:400 14px/1.5 var(--font);
  /* 竖排 + .wrap 撑满：让页脚在内容短的时候也贴着视口底部，
     底下的系统手势条才有"系统区域"的样子，而不是悬在一片空白里 */
  min-height:100vh;display:flex;flex-direction:column;
}
h1,h2,h3,p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:var(--r-xs)}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:-.2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ================= 顶栏 ================= */
/* 顶栏随页面滚走、标签栏吸顶 —— 即 Material 的 large top app bar + tabs 组合；
   两层都吸顶的话标签会被顶栏盖住，所以这里只让 tabs sticky。 */
.appbar{padding:calc(var(--inset-top) + var(--sp4)) var(--sp4) var(--sp1);
  max-width:var(--measure);margin:0 auto;width:100%}
.appbar-row{display:flex;align-items:flex-start;gap:var(--sp3)}
.kicker{display:block;font-size:11.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--on-variant);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.appbar h1{font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1.25;color:var(--on-surface)}

/* ================= 卡片 ================= */
/* 底部让出药丸那一段（药丸高约 56 + 距底 20 + 余量）。加在这里、不加在 body 上：
   这样页面背景一直铺到屏幕底边，内容是从药丸"后面"过去的 */
.wrap{padding:0 var(--sp4) calc(96px + var(--inset-bottom));
  display:flex;flex-direction:column;gap:var(--sp4);flex:1;
  max-width:var(--measure);margin:0 auto;width:100%}
.card{background:var(--surface-low);border:var(--hair);border-radius:var(--r-xl);padding:var(--sp5);
  box-shadow:var(--shadow);
  animation:fade var(--d2) var(--e-emph)}
/* 标签页切换会让面板从 display:none 变回来、动画随之重播：
   面板只留一个 220ms 淡入，带延迟的入场动画只给首屏的英雄卡用。 */
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}
.card-title{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--on-variant);
  margin:0 0 var(--sp3)}
/* 英雄卡不再整块上色：最大的色块应该装最重要的信息，而它只有一个数字和两个按钮。
   主色只留在数字与主行动上，卡片的分隔交给发丝线。 */
.hero{background:var(--surface-low);color:var(--on-surface);border:var(--hair);
  border-radius:var(--r-2xl);padding:var(--sp4) var(--sp4) var(--sp3);
  animation:rise var(--d4) var(--e-spring) backwards}
.hero-top{display:flex;align-items:center;gap:var(--sp2);flex-wrap:wrap}
.hero-count{display:flex;align-items:flex-end;gap:var(--sp3);margin:var(--sp3) 0 var(--sp2);flex-wrap:wrap}
.count-num{font-size:38px;font-weight:800;line-height:1.05;letter-spacing:-1px;color:var(--primary);
  font-variant-numeric:tabular-nums;transition:transform var(--d3) var(--e-spring)}
.count-num.bump{transform:scale(1.06)}
/* 不用 opacity 压层次：那样审对比度时量到的是叠色前的值，读出来是假的 */
.count-cap{padding-bottom:2px;font-size:12.5px;font-weight:600;color:var(--on-surface)}
.count-cap small{display:block;font-weight:500;font-size:11.5px;margin-top:1px;color:var(--on-variant)}
.hero-actions{display:flex;gap:var(--sp2);flex-wrap:wrap;margin-left:auto}

/* ================= 徽章 / chip ================= */
/* 全站一套对称圆角：原先英雄卡切一角、徽章是叶子形、主按钮另一组不对称，
   三套互不呼应的不对称放一起不叫表现力，叫随机。 */
.badge{display:inline-flex;align-items:center;gap:var(--sp2);padding:3px 10px;font-size:12px;font-weight:700;
  border-radius:var(--r-full);background:var(--surface-lowest);color:var(--on-surface);
  transition:background var(--d2) var(--e-emph)}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--outline);flex:none}
/* 正常态不上绿底：整页唯一的色块留给「需要处理」。点已经足够说明「查过了、没问题」 */
.badge[data-tone=ok]{background:var(--surface-high);color:var(--on-surface)}
.badge[data-tone=ok] .dot{background:var(--success)}
.badge[data-tone=warn]{background:var(--secondary-container);color:var(--on-secondary-container)}
.badge[data-tone=warn] .dot{background:var(--secondary)}
.badge[data-tone=bad]{background:var(--error-container);color:var(--on-error-container)}
.badge[data-tone=bad] .dot{background:var(--error);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--r-full);
  background:var(--surface-highest);color:var(--on-variant);font-size:11.5px;
  min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip b{color:var(--on-surface);font-weight:600}

/* ================= 按钮 ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp2);min-height:38px;padding:0 var(--sp4);
  border:0;border-radius:var(--r-full);font-size:13.5px;font-weight:600;cursor:pointer;letter-spacing:.1px;
  transition:transform var(--d2) var(--e-spring),background var(--d1) var(--e-emph),box-shadow var(--d2) var(--e-emph)}
.btn svg{width:17px;height:17px;flex:none}
.btn:active{transform:scale(.94)}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn-filled{background:var(--primary);color:var(--on-primary)}
.btn-filled:hover{box-shadow:0 2px 10px var(--primary);filter:brightness(1.06)}
/* 次行动不再上 secondary-container：英雄卡转中性之后，这里再放一块淡紫
   就等于把「两个按钮都很重要」画出来。它只需要读起来是「另一个动作」。 */
.btn-tonal{background:var(--surface-high);color:var(--on-surface)}
.btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--outline-variant)}
.btn-text{background:transparent;color:var(--primary);padding:0 var(--sp3)}
.btn-sm{min-height:30px;padding:0 var(--sp3);font-size:12.5px}
/* 主行动用 primary：它是唯一"跟着系统色相走"的实心色，别的角色要么太淡要么
   带警告含义。静止形状与其它按钮一样是胶囊 —— 表现力留给按下那一刻的形状形变，
   一屏里两种按钮形状并排只会读成「这俩不是一类东西」。 */
.fab{background:var(--primary);color:var(--on-primary)}
.fab:active{border-radius:50%;transform:scale(.9)}

/* ================= 悬浮药丸底栏 ================= */
/* 选中那格展开文字、其余只留图标，所以药丸宽度随当前页变化 —— 这是它像"药丸"的原因。
   底色用 surface-high + 1dp 描边，不靠阴影：深色下阴影基本看不见，边界靠那根线钉住。
   内容从药丸后面滚过去（让位只加在 .wrap 的 padding-bottom 上，body 不留空白带，
   否则药丸下面会凭空多出一条背景）。 */
.tabs{position:fixed;left:50%;transform:translateX(-50%);z-index:40;
  bottom:calc(var(--inset-bottom) + 20px);
  display:flex;align-items:center;gap:4px;padding:6px 8px;
  background:var(--surface-high);border:var(--hair);border-radius:28px;
  box-shadow:0 8px 24px oklch(0% 0 0 / 22%);
  max-width:calc(100vw - 16px)}
.tab{position:relative;flex:none;display:flex;align-items:center;justify-content:center;
  min-height:44px;padding:10px 12px;border:0;border-radius:var(--r-full);
  background:transparent;color:var(--on-variant);font-size:13px;font-weight:600;cursor:pointer;
  transition:background var(--d2) var(--e-emph),color var(--d2) var(--e-emph),transform var(--d2) var(--e-spring)}
.tab:active{transform:scale(.92)}
.tab.is-active{background:var(--secondary-container);color:var(--on-secondary-container)}
.tab .ico{display:flex;flex:none}
.tab .ico svg{width:22px;height:22px;display:block;fill:currentColor}
/* 未选中只留图标：文字宽度收到 0。用 max-width 过渡而不是 width:auto —— 后者在 WebView 里不参与过渡 */
.tab .lb{max-width:0;overflow:hidden;white-space:nowrap;opacity:0;
  transition:max-width var(--d3) var(--e-spring),opacity var(--d2) var(--e-emph),margin-left var(--d3) var(--e-spring)}
.tab.is-active .lb{max-width:140px;opacity:1;margin-left:6px}

/* ================= 概览分组 ================= */
/* 626 CSS px 的画布上，「标签贴左、数值贴右」的整行布局会在中间拉出
   几百 px 的空洞，整页像一张被拉宽的收据。改成自适应网格：每格自己限宽，
   窄屏自动降列，不需要断点，也不会有行横跨整个画布。 */
.grp+.grp{margin-top:var(--sp4)}
.grp-t{font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--on-variant);
  margin-bottom:var(--sp2)}
/* 轨道下限必须写成 min(目标宽, 100%)：只写 minmax(260px,1fr) 时，
   容器比 260px 还窄（320px 视口下卡片内容只有 254px）轨道不会退让，
   格子就会捅出网格右边界。实测过这一处。 */
.grid{display:grid;gap:var(--sp3);grid-template-columns:repeat(auto-fit,minmax(min(var(--cell,250px),100%),1fr))}
.blk{background:var(--surface-high);border-radius:var(--r-l);padding:var(--sp3);min-width:0}
.blk-k{display:block;font-size:12px;font-weight:600;color:var(--on-variant);margin-bottom:3px}
.blk-v{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;line-height:1.3;min-width:0}
.blk-v>span{min-width:0}
.blk-v .pill{font-weight:inherit}
.blk small{display:block;font-size:11.5px;font-weight:400;color:var(--on-variant);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk-num{font-size:22px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.blk-v .blk-num{font-size:22px;font-weight:800}
/* 路径是脚注不是数据：单独一组小字，别塞进网格里当第 N 行收据 */
.paths{margin-top:var(--sp4);display:flex;flex-direction:column;gap:2px}
.path-row{display:flex;gap:var(--sp2);min-width:0;line-height:1.5}
.path-k{flex:none;font-size:11.5px;color:var(--on-variant)}
.path-v{min-width:0;word-break:break-all;font-size:11.5px;color:var(--on-variant)}
/* 页脚：只为了给页面底部那块空白一个归属，让系统手势条落在"内容结束之后" */
.foot{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--sp2);
  margin:auto 0 var(--sp3);padding-top:var(--sp4);border-top:var(--hair);
  font-size:11.5px;color:var(--on-variant);text-align:center}
.foot span+span::before{content:"·";margin-right:var(--sp2);opacity:.55}
/* 「关于」是诊断脚注，不该和运行状态抢层级：格子去掉填充、值降一档字号 */
.card-quiet .blk{background:transparent;padding:0}
.card-quiet .grid{gap:var(--sp3)}
.card-quiet .blk-v{font-size:13.5px;font-weight:600}
.card-quiet .blk-k{margin-bottom:1px}
/* 状态只在「需要关注」时才着色：正常值就是普通文字，不给绿点。
   一排绿点等于什么都没说，还会把概览变成红绿灯阵列；
   只有 warn/bad/na 才画点或胶囊，眼睛第一眼落在的就是它们。 */
.pill{display:inline-flex;align-items:center;gap:5px;padding:0;border-radius:var(--r-full);min-width:0;
  font-size:12.5px;font-weight:600;background:transparent;color:var(--on-surface)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--outline);flex:none}
.pill[data-tone=ok]::before{display:none}
.pill[data-tone=na]::before{background:var(--outline)}
.pill[data-tone=warn]{padding:2px 9px 2px 8px;background:var(--secondary-container);
  color:var(--on-secondary-container);font-weight:700}
.pill[data-tone=warn]::before{background:var(--secondary)}
.pill[data-tone=bad]{padding:2px 9px 2px 8px;background:var(--error-container);color:var(--on-error-container);font-weight:700}
.pill[data-tone=bad]::before{background:var(--error)}
/* 应用清单在 626px 画布上排单列，每行右边会空出一大截；
   自动分列后包名自己限宽，超长的用省略号收尾（title 给全名）。 */
#rulesResolved{margin-top:var(--sp4)}
#appsBody{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(258px,100%),1fr));gap:1px}
#appsBody .empty,#appsBody .hint{grid-column:1 / -1}
.app-row{display:flex;align-items:center;gap:var(--sp3);padding:5px var(--sp2);border-radius:var(--r-m);
  min-width:0;transition:background var(--d1) var(--e-emph)}
.app-row:hover{background:var(--surface-mid)}
/* 头像：有桌面缓存就用那张真图标，没有就用首字块。
   快捷方式、系统组件、以及压根没有 Launcher3 系缓存的机器都会落到后者，不是异常路径 */
.app-ic{flex:none;width:38px;height:38px;border-radius:var(--r-m);overflow:hidden;
  background:var(--surface-high);display:grid;place-items:center;
  color:var(--on-variant);font-size:15px;font-weight:700}
.app-ic img{width:100%;height:100%;object-fit:contain;display:block}
.app-txt{flex:1;min-width:0}
.app-name{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:14.5px;font-weight:600}
.app-name.is-mono{font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:-.2px}
.app-pkg{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--on-variant);margin-top:1px}
.app-tag{flex:none;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:var(--r-full);
  background:var(--surface-high);color:var(--on-variant)}
.app-tag[data-tone=miss]{background:var(--error-container);color:var(--on-error-container)}
.icon-add{flex:none;width:32px;height:32px;border:0;border-radius:var(--r-s);background:var(--surface-lowest);
  color:var(--primary);cursor:pointer;display:grid;place-items:center;border:1px solid var(--outline-variant);
  transition:transform var(--d2) var(--e-spring),background var(--d1) var(--e-emph)}
.icon-add:active{transform:scale(.86)}
.icon-add svg{width:16px;height:16px}
/* 属性表：名字 + 状态一行，值单独一行横跨整格。
   以前三样挤在一行里，键和值中间没有间隔，读出来是「device_statelocked一致」。 */
.prop-row{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:var(--sp3);row-gap:1px;
  align-items:center;padding:5px var(--sp2);border-bottom:var(--hair)}
.prop-row:last-child{border-bottom:0}
.prop-k{font-family:var(--mono);font-size:12px;color:var(--on-surface);word-break:break-all;min-width:0}
.prop-v{grid-column:1 / -1;font-family:var(--mono);font-size:11.5px;color:var(--on-variant);
  word-break:break-all;min-width:0}
.prop-row .pill[data-tone=ok]{font-size:11.5px;font-weight:500;color:var(--on-variant)}

/* ================= 表单 ================= */
/* 表单：标签一律放在控件上方。浮动标签要和文本域首行算位置，textarea 一定压字 */
.field{display:block}
.field textarea,.field input[type=text]{width:100%;padding:var(--sp3);border-radius:var(--r-m);
  background:var(--surface-lowest);border:1.5px solid var(--outline-variant);color:var(--on-surface);
  transition:border-color var(--d2) var(--e-emph),background var(--d2) var(--e-emph)}
.field textarea{min-height:180px;font-family:var(--mono);font-size:12.5px;line-height:1.55;resize:vertical;tab-size:2}
.field input[type=text]{min-height:42px}
.field:focus-within textarea,.field:focus-within input{border-color:var(--primary);border-width:2.5px}
.field label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.4px;
  color:var(--on-variant);margin:0 0 var(--sp1) var(--sp1)}
.field:focus-within label{color:var(--primary)}
.hint{font-size:12px;color:var(--on-variant);margin-top:var(--sp1)}
/* 需要处理才着色，与全局「正常态不上色」一致 */
.hint-warn{color:var(--on-error-container);background:var(--error-container);
  border-radius:var(--r-s);padding:var(--sp2) var(--sp3);margin-top:var(--sp2)}
.hint-warn[hidden]{display:none}
.toolbar{display:flex;align-items:center;gap:var(--sp2);flex-wrap:wrap;margin-top:var(--sp3)}
.switch-row{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp2) 0}
.switch-row .txt{flex:1;min-width:0}
.switch-row .txt b{display:block;font-size:13.5px;font-weight:600}
.switch-row .txt span{font-size:12px;color:var(--on-variant)}
.switch{flex:none;width:46px;height:28px;border-radius:var(--r-full);border:2px solid var(--outline);
  background:var(--surface-highest);position:relative;cursor:pointer;
  transition:background var(--d3) var(--e-spring),border-color var(--d3) var(--e-spring)}
.switch::after{content:"";position:absolute;top:50%;left:3px;width:14px;height:14px;border-radius:50%;background:var(--outline);
  transform:translateY(-50%);transition:transform var(--d4) var(--e-spring),width var(--d3) var(--e-spring),
  height var(--d3) var(--e-spring),background var(--d3) var(--e-emph)}
.switch[aria-checked=true]{background:var(--primary);border-color:var(--primary)}
.switch[aria-checked=true]::after{left:calc(100% - 23px);width:20px;height:20px;background:var(--on-primary)}

/* ================= 日志 ================= */
.console{background:var(--surface-lowest);border:1px solid var(--outline-variant);border-radius:var(--r-m);
  padding:var(--sp2);max-height:52vh;overflow:auto;font-family:var(--mono);font-size:11.5px;line-height:1.5;-webkit-overflow-scrolling:touch}
.log-line{white-space:pre-wrap;word-break:break-all;padding:0;border-bottom:1px solid var(--outline-variant);color:var(--on-surface)}
.log-line:last-child{border-bottom:0}
.log-line[data-lvl=err]{background:var(--error-container);color:var(--on-error-container)}
.log-line[data-lvl=warn]{background:var(--secondary-container);color:var(--on-secondary-container)}
.log-line[data-lvl=ok]{color:var(--success)}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--surface-mid);border-radius:var(--r-full)}
.seg button{border:0;background:transparent;color:var(--on-variant);min-height:28px;padding:0 var(--sp3);
  border-radius:var(--r-full);font-size:12px;font-weight:600;cursor:pointer;
  transition:background var(--d2) var(--e-emph),color var(--d2) var(--e-emph),transform var(--d2) var(--e-spring)}
.seg button:active{transform:scale(.93)}
.seg button.is-active{background:var(--surface-lowest);color:var(--on-surface);box-shadow:0 1px 4px var(--scrim)}

/* ================= 提示条 / 对话框 / snackbar ================= */
.banner{display:flex;gap:var(--sp2);align-items:flex-start;padding:var(--sp3) var(--sp4);border-radius:var(--r-l);
  background:var(--error-container);color:var(--on-error-container);font-size:13px;line-height:1.5;
  animation:rise var(--d4) var(--e-spring) backwards}
/* .banner 自带 display:flex，会盖掉 hidden 属性的 display:none —— 必须显式补一条 */
.banner[hidden]{display:none}
.banner svg{width:18px;height:18px;flex:none;margin-top:1px}
.banner b{display:block;margin-bottom:2px}
.dialog{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:var(--sp4);background:var(--scrim)}
.dialog[hidden]{display:none}
.sheet{width:100%;max-width:400px;background:var(--surface-high);border-radius:var(--r-2xl);
  padding:var(--sp4);box-shadow:var(--shadow);animation:pop var(--d3) var(--e-spring)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(16px)}}
.sheet h3{font-size:17px;font-weight:700;letter-spacing:-.2px;margin-bottom:var(--sp2)}
.sheet p{font-size:13.5px;color:var(--on-variant);line-height:1.55}
.sheet-actions{display:flex;justify-content:flex-end;gap:var(--sp2);margin-top:var(--sp4)}
.snackbar{position:fixed;left:50%;bottom:calc(var(--inset-bottom) + 92px);z-index:70;
  transform:translate(-50%,140%);max-width:min(92vw,520px);display:flex;align-items:center;gap:var(--sp2);
  padding:var(--sp2) var(--sp4);border-radius:var(--r-l);
  background:var(--surface-bright);color:var(--on-surface);box-shadow:var(--shadow);font-size:13px;
  transition:transform var(--d4) var(--e-spring);pointer-events:none}
/* 属性选择器的值不加引号时必须是合法标识符，`1` 不是：这条原先写成 [data-show=1]，
   整条规则被解析器静默丢掉，snackbar 永远停在 translate(-50%,140%) ——
   也就是说界面提示其实一次都没出现过。 */
.snackbar[data-show="1"]{transform:translate(-50%,0)}
.snackbar[data-tone=bad]{background:var(--error-container);color:var(--on-error-container)}
.snackbar[data-tone=ok]{background:var(--success-container);color:var(--on-success-container)}

/* ================= 加载/空态 ================= */
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--outline-variant);border-top-color:var(--primary);
  animation:spin .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{height:12px;border-radius:var(--r-s);background:linear-gradient(90deg,var(--surface-mid),var(--surface-high),var(--surface-mid));
  background-size:220% 100%;animation:shimmer 1.3s infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.empty{padding:var(--sp6) var(--sp4);text-align:center;color:var(--on-variant);font-size:13px}
.empty b{display:block;font-size:14px;color:var(--on-surface);margin-bottom:var(--sp1)}
.busy{position:fixed;inset:0;z-index:65;display:grid;place-items:center;background:var(--scrim);gap:var(--sp3)}
.busy[hidden]{display:none}
.busy div{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp3) var(--sp5);border-radius:var(--r-full);
  background:var(--surface-high);box-shadow:var(--shadow);font-size:13.5px;font-weight:600}
[data-stub]{opacity:.55}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-width:390px){
  .count-num{font-size:30px}
  .appbar h1{font-size:18px}
}
</style>
</head>
<body>

<header class="appbar">
  <!-- 顶栏不放配色与深浅开关：颜色一律跟随系统（见「关于 → 取色 / 深浅」）。
       原先那两个按钮会让人不小心把界面调成和系统不一样的东西。 -->
  <div class="appbar-row">
    <div style="min-width:0">
      <span class="kicker" id="kicker">正在读取模块状态</span>
      <h1>TS-AUTO-ADD</h1>
    </div>
  </div>
</header>

<div class="wrap">

  <section class="hero" id="hero">
    <div class="hero-top">
      <span class="badge" id="stateBadge" data-tone="na"><i class="dot"></i><span id="stateText">连接中…</span></span>
      <span class="chip mono" id="verChip">—</span>
    </div>
    <div class="hero-count">
      <div class="count-num" id="countNum">—</div>
      <div class="count-cap">生效应用数<small id="countSub">正在读取</small></div>
      <div class="hero-actions">
        <button class="btn fab" id="btnSync"></button>
        <button class="btn btn-tonal" id="btnReload"></button>
      </div>
    </div>
  </section>

  <div class="banner" id="banner" hidden>
    <span id="bannerIcon"></span>
    <div><b id="bannerTitle"></b><span id="bannerText"></span></div>
  </div>

  <main class="wrap" style="padding:0">
    <section class="card" id="p-over">
      <h2 class="card-title">运行状态</h2>
      <div id="overBody"><div class="skeleton" style="width:70%"></div><div class="skeleton" style="width:90%;margin-top:14px"></div><div class="skeleton" style="width:55%;margin-top:14px"></div></div>
    </section>

    <section class="card" id="p-rules" hidden>
      <h2 class="card-title">常驻应用列表 rules.txt</h2>
      <div class="field">
        <label id="rulesLabel">每行一个包名 · # 开头为注释</label>
        <textarea id="rulesBox" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off" aria-labelledby="rulesLabel"></textarea>
      </div>
      <p class="hint" id="rulesStat">—</p>
      <p class="hint hint-warn" id="rulesSuspect" hidden></p>
      <div class="toolbar">
        <button class="btn btn-filled btn-sm" id="btnSaveRules"></button>
        <button class="btn btn-text btn-sm" id="btnRevertRules">放弃修改</button>
        <button class="btn btn-outline btn-sm" id="btnRulesHead">补默认注释头</button>
      </div>
      <p class="hint">保存 = 覆盖整个 <span class="mono" id="rulesPath">rules.txt</span>，并立即同步一次；行尾 <span class="mono">CR</span> 与 <span class="mono">BOM</span> 会被自动清掉。</p>
      <div id="rulesResolved" hidden></div>
    </section>

    <section class="card" id="p-apps" hidden>
      <h2 class="card-title">应用列表</h2>
      <div class="toolbar" style="margin-top:0">
        <div class="seg" id="appsSeg">
          <button data-src="targets" class="is-active">生效列表</button>
          <button data-src="apps">已安装第三方</button>
        </div>
        <button class="btn btn-outline btn-sm" id="btnOnlyMissing" aria-pressed="false">只看未纳入</button>
      </div>
      <div class="field" style="margin-top:var(--sp4)">
        <label>搜索应用名或包名</label>
        <input type="text" id="appsSearch" placeholder="例如 微信 / termux" autocomplete="off">
      </div>
      <p class="hint" id="appsStat">—</p>
      <div id="appsBody" style="margin-top:var(--sp3)"></div>
    </section>

    <section class="card" id="p-log" hidden>
      <h2 class="card-title">运行日志</h2>
      <div class="toolbar" style="margin-top:0">
        <div class="seg" id="logSeg">
          <button data-n="30">30</button><button data-n="60" class="is-active">60</button>
          <button data-n="120">120</button><button data-n="300">300</button>
        </div>
        <button class="btn btn-outline btn-sm" id="btnLogRefresh"></button>
        <button class="btn btn-text btn-sm" id="btnLogClear">清空缓冲</button>
        <label class="switch-row" style="margin-left:auto;padding:0">
          <span class="txt" style="font-size:13px">自动刷新</span>
          <span class="switch" id="logAuto" role="switch" aria-checked="false" tabindex="0"></span>
        </label>
      </div>
      <p class="hint" id="logStat">—</p>
      <div class="console" id="logBody" style="margin-top:var(--sp3)"></div>
    </section>

    <section class="card" id="p-props" hidden>
      <h2 class="card-title">系统属性伪装</h2>
      <div class="switch-row">
        <span class="txt"><b>开机时重置属性</b><span id="propsSwitchHint">关闭后下次开机起不再写入期望值</span></span>
        <span class="switch" id="propsSwitch" role="switch" aria-checked="true" tabindex="0"></span>
      </div>
      <div class="toolbar" style="margin-top:0">
        <button class="btn btn-filled btn-sm" id="btnPropsApply"></button>
        <button class="btn btn-text btn-sm" id="btnPropsRefresh">重新读取</button>
      </div>
      <p class="hint" id="propsStat">—</p>
      <div id="propsBody" style="margin-top:var(--sp3)"></div>
    </section>

    <section class="card card-quiet" id="p-about" hidden>
      <h2 class="card-title">关于</h2>
      <div id="aboutBody"></div>
    </section>
  </main>

  <!-- 页脚：页面短的时候下面是一大片空背景，系统的返回手势条会像"凭空一根药丸"。
       给这块空间一个明确的内容归属，手势条就落在页脚之下，读起来是系统的东西。 -->
  <footer class="foot">
    <span>TS-AUTO-ADD</span>
    <span>只在开机与文件变化时同步</span>
    <span>界面不联网</span>
  </footer>
</div>

<!-- 悬浮药丸底栏：选中那格展开文字、其余只留图标，所以药丸宽度随当前页变化。
     底色用 surface-high + 1dp 描边而不是靠阴影 —— 深色下阴影基本看不见。 -->
<nav class="tabs" role="tablist" id="tabs">
  <button class="tab is-active" role="tab" data-tab="over" data-icon="home" aria-label="概览"><i class="ico"></i><span class="lb">概览</span></button>
  <button class="tab" role="tab" data-tab="rules" data-icon="list" aria-label="常驻列表"><i class="ico"></i><span class="lb">常驻列表</span></button>
  <button class="tab" role="tab" data-tab="apps" data-icon="apps" aria-label="应用"><i class="ico"></i><span class="lb">应用</span></button>
  <button class="tab" role="tab" data-tab="log" data-icon="logs" aria-label="日志"><i class="ico"></i><span class="lb">日志</span></button>
  <button class="tab" role="tab" data-tab="props" data-icon="tune" aria-label="属性"><i class="ico"></i><span class="lb">属性</span></button>
</nav>

<div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>
<div class="dialog" id="dialog" hidden role="dialog" aria-modal="true">
  <div class="sheet">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <div class="sheet-actions">
      <button class="btn btn-text" id="dlgCancel">取消</button>
      <button class="btn btn-filled" id="dlgOk">确定</button>
    </div>
  </div>
</div>
<div class="busy" id="busy" hidden><div><span class="spin"></span><span id="busyText">处理中</span></div></div>

<script>
"use strict";

/* =========================================================
   0. 图标（内联 SVG，避免外部请求）

  moon: '<path d="M12.8 3.1a9 9 0 1 0 8.1 12.4 7 7 0 0 1-8.1-8.3c0-1.5.4-2.9 1-4.1A9 9 0 0 0 12.8 3.1Z"/>',
  auto: '<path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 2v14a7 7 0 0 1 0-14Z"/>',

/* =========================================================
   1. 桥接层：Magisk / KernelSU / APatch 的 exec 接口形状不同，统一成一个
   ========================================================= */
var QUERY = new URLSearchParams(location.search);
var MODDIR = QUERY.get('mod') || '/data/adb/modules/ts-auto-add';
var SH = 'sh ' + MODDIR + '/webui.sh';
var DEMO = QUERY.get('demo') === '1';

/* 桥接探测：管理器注入的对象名与形状各家不同。
   这里不只"找一个能用的"，还把看到的全部记下来 —— 连不上时界面要能自证
   到底扫了哪些名字、各自有哪些方法，否则排查只能靠猜。 */
var BRIDGE_CANDIDATES = ['bridge', 'kernelsu', 'apatch', 'Magisk', 'magisk', 'ksu'];

function ownKeys(o){
  var a = [];
  try { a = Object.getOwnPropertyNames(o) || []; } catch (e){}
  return a;
}
function methodsOf(o){
  return ownKeys(o).filter(function (k){
    try { return typeof o[k] === 'function'; } catch (e){ return false; }
  }).slice(0, 10);
}

/* 连不上时最有用的信息是「这个 WebView 的 window 上多了什么」：
   拿一个同引擎的空白 iframe 当基线，多出来的对象就是宿主注入的 —— 下次再换一家
   管理器，不用反编译也能当场看见该认谁。 */
function injectedGlobals(){
  var base = {};
  try {
    var f = document.createElement('iframe');
    f.style.cssText = 'position:absolute;left:-9999px;width:1px;height:1px';
    document.body.appendChild(f);
    ownKeys(f.contentWindow).forEach(function (k){ base[k] = 1; });
    document.body.removeChild(f);
  } catch (e){ return []; }
  return ownKeys(window).filter(function (k){
    if (base[k] || k.length > 24) return false;
    try { var t = typeof window[k]; return t === 'object' || t === 'function'; } catch (e){ return false; }
  }).slice(0, 24);
}

function scanBridge(){
  var found = [], seen = {}, i, k, o;
  for (i = 0; i < BRIDGE_CANDIDATES.length; i++) {
    k = BRIDGE_CANDIDATES[i]; o = window[k];
    if (!o || (typeof o !== 'object' && typeof o !== 'function')) continue;
    found.push({ name: k, exec: typeof o.exec === 'function', methods: methodsOf(o) });
    seen[k] = 1;
  }
  /* 再扫一遍 window 上其它带 exec 的注入对象（有的实现名字不在常见清单里） */
  try {
    ownKeys(window).forEach(function (key){
      if (seen[key] || key.length > 24) return;
      var v;
      try { v = window[key]; } catch (e){ return; }
      if (!v || (typeof v !== 'object' && typeof v !== 'function')) return;
      if (typeof v.exec === 'function') found.push({ name: key + '（扫出）', exec: true, methods: methodsOf(v) });
    });
  } catch (e){}
  return found;
}

/* 各家注入的对象名与调用形状都不一样，逐个认：
   - KernelSU 主线：window.ksu.exec(cmd, optionsJson, 回调函数名) —— 异步！
     Java 侧算完再回调 window[回调名](errno, stdout, stderr)。
     （官方 kernelsu npm 库就是这么包的；这里不引那个库，直接照协议自己写，
       保持单文件、离线可用。）
   - bridge / kernelsu / apatch / Magisk：exec(cmd) 同步返回 {errno, stdout}，
     个别实现是 exec(cmd, callback) 回调式。 */
function pickBridge(){
  var k = window.ksu;
  if (k && typeof k.exec === 'function') return { obj: k, kind: 'ksu', label: 'ksu' };
  var named = [['bridge', window.bridge], ['kernelsu', window.kernelsu],
               ['apatch', window.apatch], ['Magisk', window.Magisk]];
  for (var i = 0; i < named.length; i++) {
    var o = named[i][1];
    if (o && typeof o.exec === 'function') return { obj: o, kind: 'sync', label: named[i][0] };
  }
  return null;
}

var HIT = DEMO ? null : pickBridge();
var BRIDGE = DEMO ? {} : (HIT ? HIT.obj : null);
var BRIDGE_KIND = DEMO ? 'demo' : (HIT ? HIT.kind : 'none');
var BRIDGE_LABEL = DEMO ? 'demo' : (HIT ? HIT.label : 'none');
var BRIDGE_SCAN = [];

/* 模块目录优先问管理器要（模块 id 改了也不用动界面） */
function moduleDirFromBridge(){
  try {
    if (BRIDGE_KIND === 'ksu' && typeof BRIDGE.moduleInfo === 'function') {
      var info = JSON.parse(BRIDGE.moduleInfo());
      var id = info && (info.id || info.moduleId);
      if (id && /^[A-Za-z0-9._-]+$/.test(id)) return '/data/adb/modules/' + id;
    }
  } catch (e){ /* 拿不到就用默认路径 */ }
  return null;
}

function normResult(v){
  if (v === undefined || v === null) return { errno: 0, stdout: '' };
  if (typeof v === 'string') return { errno: 0, stdout: v };
  var code = v.errno;
  if (code === undefined) code = v.code;
  if (code === undefined) code = 0;
  var out = v.stdout;
  if (out === undefined) out = v.result;
  if (out === undefined) out = '';
  return { errno: Number(code) || 0, stdout: String(out) };
}

var cbSeq = 0;

function callExec(cmd){
  return new Promise(function (resolve){
    var done = false, timer = null, sync;
    function finish(v){
      if (done) return;
      done = true;
      if (timer) { clearTimeout(timer); timer = null; }
      resolve(normResult(v));
    }
    /* 异步桥接万一没回调回来，给个上限：不然是界面永久转圈，且看不出卡在哪 */
    timer = setTimeout(function (){ finish({ errno: 124, stdout: '命令超时（60 秒未返回）' }); }, 60000);

    if (BRIDGE_KIND === 'ksu') {
      var name = 'tsaa_cb_' + (cbSeq++) + '_' + Date.now();
      window[name] = function (errno, stdout, stderr){
        delete window[name];
        var out = String(stdout == null ? '' : stdout);
        if (stderr) out += String(stderr);          // 命令侧已 2>&1，这里兜一手
        finish({ errno: Number(errno) || 0, stdout: out });
      };
      try {
        BRIDGE.exec(cmd, '{}', name);               // 第三个参数是"回调函数名"，不是函数
      } catch (e) {
        delete window[name];
        finish({ errno: 1, stdout: String((e && e.message) || e) });
      }
      return;
    }

    try {
      sync = BRIDGE.exec(cmd, finish);              // 同步式直接返回；回调式把结果交给 finish
    } catch (e) { finish({ errno: 1, stdout: String((e && e.message) || e) }); return; }
    if (sync !== undefined) finish(sync);
  });
}

/* 命令名固定、参数受校验，输出用 2>&1 合并好把错误文本显示出来 */
function run(cmd, arg){
  var full = SH + ' ' + cmd + (arg === undefined || arg === null || arg === '' ? '' : ' ' + arg) + ' 2>&1';
  if (DEMO) return Promise.resolve(demoResult(cmd, arg));
  if (!BRIDGE) return Promise.resolve({ errno: 127, stdout: '当前管理器没有提供 root shell 执行接口' });
  return callExec(full);
}

/* key=value 文本 → 对象（只按第一个 = 切分，值里可以再有 =） */
function parseKV(text){
  var out = {};
  String(text || '').split('\n').forEach(function (line){
    var i = line.indexOf('=');
    if (i > 0) out[line.slice(0, i)] = line.slice(i + 1);
  });
  return out;
}

/* =========================================================
   2. 颜色与深浅：两者都只取自系统，界面不提供覆盖
   ========================================================= */
/* ---------- 取色：一律跟随系统 ---------- */
/* 取不到系统种子时的兜底，不再是"我喜欢的紫"，而是**这台机器框架自己的默认强调色**。
   实测来源：/system/framework/framework-res.apk 的 color/system_accent1_600_light
   = #4b5d8b = oklch(48.4% .078 267.2)。界面里 --primary 是 oklch(49% .19*sat hue)，
   明度档位几乎同一格，所以 sat 取 .078/.19≈0.41 就是照着平台那一个色算出来的，
   不是拍脑袋。原先的 275 + sat 1 相当于把同一支色放大到 2.5 倍彩度，
   难怪看着和系统其它地方不是一套。 */
var HUE_DEFAULT = 267;
var SAT_DEFAULT = 0.41;
var THEME = { seedRaw: '', seedSrc: 'none', frro: '', frroSrc: '', frroParsed: null, frroOk: false,
              font: '', fontSrc: '', dark: '', darkSrc: '', applied: '', note: '' };

function hex2(v){ return (v < 16 ? '0' : '') + v.toString(16); }

/* sRGB → OKLCH：系统给的是 ARGB 整数，要换成色相与彩度才能驱动这套令牌 */
function srgbToOklch(r, g, b){
  var f = function (v){ v /= 255; return v <= 0.04045 ? v/12.92 : Math.pow((v + 0.055)/1.055, 2.4); };
  var R = f(r), G = f(g), B = f(b);
  var l = Math.cbrt(0.4122214708*R + 0.5363325363*G + 0.0514459929*B);
  var m = Math.cbrt(0.2119034982*R + 0.6806995451*G + 0.1073969566*B);
  var s = Math.cbrt(0.0883024619*R + 0.2817188376*G + 0.6299787005*B);
  var a1 = 1.9779984951*l - 2.4285922050*m + 0.4505937099*s;
  var b1 = 0.0259040371*l + 0.7827717662*m - 0.8086757660*s;
  return { C: Math.sqrt(a1*a1 + b1*b1), H: (Math.atan2(b1, a1)*180/Math.PI + 360) % 360 };
}

/* 种子色的存法各系统不统一：#RRGGBB / #AARRGGBB / 0x… / 裸十六进制 / 十进制 ARGB。
   纯数字到底哪一种要分开：6 位及以内的按十六进制颜色看（"808080" 是灰色），
   超过 6 位的按十进制整数看（"16711680" 是 0xFF0000 红色）——反过来就会把灰色
   读成 0x0C5490 这种莫名其妙的深蓝。 */
function parseSeed(raw){
  var s = String(raw == null ? '' : raw).trim();
  if (!s || s === 'null' || s === 'none') return null;
  if (s.charAt(0) === '#') s = s.slice(1);
  var v = NaN, digits = s.replace(/^-/, '');
  if (/^0[xX][0-9a-fA-F]+$/.test(s)) v = parseInt(s.slice(2), 16);
  else if (/^-?\d+$/.test(s) && digits.length > 6) v = parseInt(s, 10) >>> 0;
  else if (/^[0-9a-fA-F]{8}$/.test(s)) v = parseInt(s.slice(2), 16);
  else if (/^[0-9a-fA-F]{6}$/.test(s)) v = parseInt(s, 16);
  else if (/^[0-9a-fA-F]{3}$/.test(s)) v = parseInt(s.replace(/./g, function (c){ return c + c; }), 16);
  else if (/^-?\d+$/.test(s)) v = parseInt(s, 10) >>> 0;
  if (isNaN(v)) return null;
  v = v >>> 0;
  return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
}

/* 彩度倍率直接按"要等于系统那一支"来算，不做审美放大。
   --primary 的基值是 oklch(49% .19 hue)，所以要落到系统实测的 C 就得 sat = C / .19。
   原先的映射是 0.35 + C/0.13*0.65，本机实测系统 C=.054 会被算成 .62 → 实际彩度 .118，
   又是系统值的 2.2 倍 —— 这正是"看着就不像系统的一套颜色"的来源。 */
function satFromChroma(C){ return Math.max(0.2, Math.min(1.1, C / 0.19)); }

function setPalette(h, sat, note){
  var n = parseInt(h, 10); if (isNaN(n)) n = HUE_DEFAULT;
  n = ((n % 360) + 360) % 360;
  var sv = parseFloat(sat); if (isNaN(sv)) sv = SAT_DEFAULT;
  sv = Math.max(0.2, Math.min(1.1, sv));
  var st = document.documentElement.style;
  st.setProperty('--hue', n);
  st.setProperty('--sat', sv);
  THEME.applied = n + '° / 彩度 ×' + sv.toFixed(2);
  THEME.note = note;
}

/* ---------- SystemUI 运行时 overlay（FRRO）解析 ----------
   条目形态（本机逐字节确认）：12 08 08 1c 10 <varint ARGB> 紧跟 12 <len> 0a <len2> <资源名>
   —— 值在前、名字在后成对交替；08 1c 是 ResType TYPE_INT_COLOR_ARGB8888。
   这是系统"正在拿来画东西的那套色"，用户手选颜色时它也会被重新生成，
   所以比任何 setting 都权威：本机 theme_custom_color 为 null、壁纸是渐变
   （isColorExtracted=false），前两级种子都是空的，而它里面明明白白有一套青蓝阶梯。 */
function b64ToBytes(s){
  var bin;
  try { bin = atob(String(s).replace(/\s+/g, '')); } catch (e){ return null; }
  var out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function parseFrro(b64){
  var b = b64ToBytes(b64);
  if (!b || b.length < 16) return null;
  var map = {}, n = 0, i = 0;
  while (i + 8 < b.length) {
    if (b[i] === 0x12 && b[i+1] === 0x08 && b[i+2] === 0x08 && b[i+3] === 0x1c && b[i+4] === 0x10) {
      var j = i + 5, v = 0, sh = 0, c, bad = false;
      do {
        if (j >= b.length) { bad = true; break; }
        c = b[j++]; v += (c & 0x7f) * Math.pow(2, sh); sh += 7;
      } while (c & 0x80);
      if (!bad && b[j] === 0x12) {
        var nl = b[j+1], k = j + 2;
        if (b[k] === 0x0a) {
          var sl = b[k+1], name = '';
          for (var q = 0; q < sl && k+2+q < b.length; q++) name += String.fromCharCode(b[k+2+q]);
          if (/^system_[a-z0-9_]+$/.test(name)) { map[name] = v >>> 0; n++; }
          i = k + nl;
          continue;
        }
      }
    }
    i++;
  }
  return n ? { map: map, n: n } : null;
}

/* 自检：一条 tonal 阶梯的明度必须从 0 到 1000 单调下降。
   不单调 = 配对错位，这份数据就不能信 —— 宁可退回默认，也不要画一个错颜色。
   （第一次写解析时就是靠这条抓出我把 -dynamic- 当成 -accent- 用了，
     那份里根本没有 accent1 阶梯，"解析出 94 条"看着挺多却一条都用不上。） */
var RAMP = [0, 10, 50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000];
function frroSeed(fr){
  if (!fr) return null;
  for (var t = 0; t < 2; t++) {
    var cfg = t ? 'dark' : 'light', prev = null, mono = true, got = 0, seed = null;
    for (var i = 0; i < RAMP.length; i++) {
      var v = fr.map['system_accent1_' + RAMP[i] + '_' + cfg];
      if (v === undefined) continue;
      got++;
      var o = srgbToOklch((v >> 16) & 255, (v >> 8) & 255, v & 255);
      if (prev !== null && o.L > prev + 0.005) { mono = false; break; }
      prev = o.L;
      if (RAMP[i] === 400) seed = v;
    }
    if (mono && got >= 8 && seed !== null) return seed;
  }
  return null;
}

/* 系统字体名由设备上读出来（webui.sh env 的 sys_font）。
   写死 Roboto 那一类名字会抢在系统字体之前匹配上，正是"界面不像系统的一部分"的原因。 */
function applyFont(name, pkg){
  THEME.font = /^[a-z][a-z0-9]*(-[a-z0-9]+)*$/.test(name || '') ? name : '';
  THEME.fontSrc = THEME.font ? (pkg || '') : '';
  document.documentElement.style.setProperty('--font',
    THEME.font ? '"' + THEME.font + '", system-ui, sans-serif' : 'system-ui, sans-serif');
  return THEME.font;
}

function applyPalette(){
  var rgb = null, src = '';
  var fv = frroSeed(THEME.frroParsed);
  if (fv !== null) { rgb = { r: (fv >> 16) & 255, g: (fv >> 8) & 255, b: fv & 255 }; src = 'systemui overlay'; }
  if (!rgb) { var s = parseSeed(THEME.seedRaw); if (s) { rgb = s; src = THEME.seedSrc; } }
  if (!rgb) { setPalette(HUE_DEFAULT, SAT_DEFAULT, '系统没有可读出的强调色，用平台默认 system_accent1'); return; }
  var ok = srgbToOklch(rgb.r, rgb.g, rgb.b);
  var hex = '#' + hex2(rgb.r) + hex2(rgb.g) + hex2(rgb.b);
  /* 近中性时色相没有意义（atan2 会乱转），只跟彩度、色相留默认 */
  if (ok.C < 0.02) { setPalette(HUE_DEFAULT, satFromChroma(ok.C), '系统强调色 ' + hex + ' 近中性，只跟彩度'); return; }
  setPalette(Math.round(ok.H), satFromChroma(ok.C), '跟随系统强调色 ' + hex + '（' + src + '）');
}

/* ---------- 深浅：一律跟随系统，界面不提供覆盖 ---------- */
/* ?scheme=light|dark 只用于离线对照出图；真机上没有手动档位可点 */
var FORCE_SCHEME = QUERY.get('scheme');

function resolveScheme(){
  if (FORCE_SCHEME === 'light' || FORCE_SCHEME === 'dark') return FORCE_SCHEME;
  /* 系统的计算结果优先：管理器的 WebView 有时被钉在浅色，媒体查询会跟系统不一致 */
  if (THEME.dark === '1') return 'dark';
  if (THEME.dark === '0') return 'light';
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyScheme(){
  document.documentElement.setAttribute('data-scheme', resolveScheme());
}
/* 脚本在 body 末尾，这里同步先定一次：否则深色系统上会先闪一帧浅色再切深色 */
applyScheme();

/* =========================================================

var S = {

/* 数字都从列表直接数出来（见 webui.sh 里 status 不算数的原因）；

function countRules(){ return rulesStats(S.rulesBase).valid; }
function orDash(v){ return v === null || v === undefined || v === '' ? '—' : v; }

function el(tag, cls, text){

  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);

function n(v){ var x = parseInt(v, 10); return isNaN(x) ? null : x; }
function bytesLabel(v){

function timeLabel(epoch){

var STATE_TONE = { ok: ['ok', '运行中'], stopped: ['bad', '已停止'], failed: ['bad', '写入失败'], unknown: ['warn', '未同步'] };

function snackbar(text, tone){

/* 一次 root shell 调用的包装：返回 {ok, text, code} */
function call(cmd, arg){
  return run(cmd, arg).then(function (r){
    return { ok: r.errno === 0, code: r.errno, text: r.stdout };
  });

/* ---------- 常驻列表 ---------- */
function rulesStats(text){
  var lines = String(text).split('\n'), valid = 0, comment = 0, blank = 0, suspect = [];
  /* 不像包名的行不会报错，只会静默地永远匹配不上任何应用 —— 数上去却是"有效 1 条"。
     所以单独挑出来报数，让人当场能看见，而不是等"为什么这个应用没进来"。 */
  lines.forEach(function (raw, i){
    var l = raw.replace(/^\s+|\s+$/g, '');
    if (!l) blank++;
    else if (l.charAt(0) === '#') comment++;
    else {
      valid++;
      if (!/^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)*$/.test(l)) {
        suspect.push('第 ' + (i + 1) + ' 行「' + l.slice(0, 40) + '」');
      }
    }
  });
  return { valid: valid, comment: comment, blank: blank, suspect: suspect, total: lines.length };
}
/* 常驻项摊开：编辑器里只有裸包名，看不见"这一条到底进没进目标列表"。
   下面这份用同一批数据（targets + 图标缓存）把它列出来，
   图标和显示名回来后再重画一次。 */
function renderRulesResolved(){
  var box = document.getElementById('rulesResolved');
  if (!box) return;
  var list = Object.keys(rulesSetOf()).sort();
  box.textContent = '';
  if (!list.length) { box.hidden = true; return; }
  box.hidden = false;
  box.appendChild(el('h3', 'grp-t', '当前常驻项 · ' + list.length));
  var g = el('div', 'grid');
  var inTarget = targetSetOf();
  list.forEach(function (p){
    var ic = S.icons[p];
    var row = el('div', 'app-row');
    row.appendChild(appAvatar(p, ic));
    var txt = el('span', 'app-txt');
    if (ic && ic.label) {
      txt.appendChild(el('span', 'app-name', ic.label));
      var pk = el('span', 'app-pkg', p);
      pk.title = p;
      txt.appendChild(pk);
    } else {
      var nm = el('span', 'app-name is-mono', p);
      nm.title = p;
      txt.appendChild(nm);
    }
    row.appendChild(txt);
    if (!inTarget[p]) {
      var tg = el('span', 'app-tag', '未生效');
      tg.setAttribute('data-tone', 'miss');
      tg.title = '写在 rules.txt 里，但当前目标列表没有它（多半是还没同步，或该后端跳过了不可见应用）';
      row.appendChild(tg);
    }
    g.appendChild(row);
  });
  box.appendChild(g);
  ensureIcons(list);
}

function renderRules(){
  rulesPath.textContent = S.status.rules_file || 'rules.txt';
  /* 只有用户真的动过编辑器才保留草稿；首次进入时编辑器是空的，
     拿「内容等于基线」当判据会让它永远填不进去（实测过：显示 0 条且标成未保存）。 */
  if (!S.rulesEdited || rulesBox.value === S.rulesBase) rulesBox.value = S.rules;
  updateRulesStat();
  renderRulesResolved();
}
function updateRulesStat(){
  var s = rulesStats(rulesBox.value);
  var dirty = rulesBox.value !== S.rulesBase;
  var parts = ['有效包名 ' + s.valid, '注释 ' + s.comment, '空行 ' + s.blank];
  if (/\r/.test(rulesBox.value)) parts.push('含 CR（保存时会清掉）');
  if (dirty) parts.push('未保存');
  rulesStat.textContent = parts.join(' · ');
  rulesStat.style.color = dirty ? 'var(--primary)' : 'var(--on-variant)';
  var sus = document.getElementById('rulesSuspect');
  if (s.suspect.length) {
    sus.hidden = false;
    sus.textContent = '有 ' + s.suspect.length + ' 行不像包名，会一直匹配不到任何应用：' +
      s.suspect.slice(0, 5).join('、') + (s.suspect.length > 5 ? ' 等' : '');
  } else sus.hidden = true;
  btnSaveRules.disabled = !dirty || busyCount > 0;
  btnRevertRules.disabled = !dirty;
}

/* ---------- 应用列表 ---------- */
/* 生效集合建一次用到底：以前每次搜索、每敲一个字符都要重建一遍两百多项的表 */
function targetSetOf(){
  if (!S.targetSet) {
    S.targetSet = {};
    S.targets.forEach(function (p){ S.targetSet[p] = 1; });
  }
  return S.targetSet;
}
/* 常驻集合：分清某个包是「因为写在 rules.txt 才生效」还是「因为装着才生效」。
   这两种在生效列表里原先混在一起看不出来，而它正是这个模块的核心语义。
   以磁盘上的基线为准，不用编辑器里的草稿 —— 草稿没保存就不算数。 */
function rulesSetOf(){
  if (S.rulesSetSrc !== S.rulesBase) {
    S.rulesSetSrc = S.rulesBase;
    S.rulesSet = {};
    String(S.rulesBase || '').split('\n').forEach(function (l){
      l = l.replace(/^\s+|\s+$/g, '');
      if (l && l.charAt(0) !== '#') S.rulesSet[l] = 1;
    });
  }
  return S.rulesSet;
}
function monogram(s){
  var t = String(s || '');
  /* 包名取最后一段的首字母：com.google.android.gsf 与 com.termux 都以 com 开头，
     一律取第一个字符的话整页会是一片 C，等于没有区分度 */
  if (t.indexOf('.') > 0) t = t.slice(t.lastIndexOf('.') + 1);
  t = t.replace(/^[^A-Za-z一-龥]+/, '');
  return (t.charAt(0) || '?').toUpperCase();
}
function appAvatar(pkg, ic){
  var a = el('span', 'app-ic');
  if (ic && ic.src) {
    var img = el('img');
    img.src = ic.src; img.alt = ''; img.loading = 'lazy';
    /* 相对路径能不能解析取决于管理器的资源 handler。读不到就换成首字块，
       别让列表里出现一片破图 —— 这一条我没法离线证明，所以按可能失败来写 */
    img.addEventListener('error', function (){ a.textContent = monogram(ic.label || pkg); });
    a.appendChild(img);
  } else {
    a.textContent = monogram(pkg);
  }
  return a;
}
function renderApps(){
  var srcList = S.appsSrc === 'targets' ? S.targets : S.apps;
  var inTarget = targetSetOf();
  var list = srcList;
  if (S.onlyMissing && S.appsSrc === 'apps') list = list.filter(function (p){ return !inTarget[p]; });
  if (S.search) {
    var q = S.search.toLowerCase();
    /* 现在列表上显示的是应用名，搜索只匹配包名会让人搜不到眼前看到的东西 */
    list = list.filter(function (p){
      return p.toLowerCase().indexOf(q) >= 0 ||
        (S.icons[p] && S.icons[p].label.toLowerCase().indexOf(q) >= 0);
    });
  }
  var missing = S.apps.filter(function (p){ return !inTarget[p]; }).length;
  appsStat.textContent = (S.appsSrc === 'targets' ? '生效 ' + S.targets.length : '已安装第三方 ' + S.apps.length) +
    ' · 显示 ' + list.length + (missing && S.appsSrc === 'apps' ? ' · 未纳入 ' + missing : '');

  var box = document.getElementById('appsBody');
  box.textContent = '';
  if (!list.length) {
    var e = el('div', 'empty');
    e.appendChild(el('b', null, '没有条目'));
    e.appendChild(document.createTextNode(S.appsSrc === 'targets' ? '目标文件还是空的，点上方「立即同步」生成一次。' : '没有匹配的应用。'));
    box.appendChild(e);
    return;
  }
  var frag = document.createDocumentFragment();
  var shown = Math.min(list.length, 800);
  for (var i = 0; i < shown; i++) {
    var pkg = list[i];
    var ic = S.icons[pkg];
    var row = el('div', 'app-row');
    row.appendChild(appAvatar(pkg, ic));
    var txt = el('span', 'app-txt');
    if (ic && ic.label) {
      txt.appendChild(el('span', 'app-name', ic.label));
      var pk = el('span', 'app-pkg', pkg);
      pk.title = pkg;
      txt.appendChild(pk);
    } else {
      var nm = el('span', 'app-name is-mono', pkg);
      nm.title = pkg;
      txt.appendChild(nm);
    }
    row.appendChild(txt);
    if (S.appsSrc === 'apps' && !inTarget[pkg]) {
      var tg = el('span', 'app-tag', '未纳入');
      tg.setAttribute('data-tone', 'miss');
      row.appendChild(tg);
    } else if (S.appsSrc === 'targets' && rulesSetOf()[pkg]) {
      var pt = el('span', 'app-tag', '常驻');
      pt.title = '写在 rules.txt 里：不管装没装都会进目标列表';
      row.appendChild(pt);
    }
    if (S.appsSrc === 'apps') {
      var add = el('button', 'icon-add');
      add.innerHTML = svg('add');
      add.title = '加入常驻列表';
      add.setAttribute('aria-label', '把 ' + pkg + ' 加入常驻列表');
      add.addEventListener('click', (function (p){
        return function (){ addRule(p); };
      })(pkg));
      row.appendChild(add);
    }
    frag.appendChild(row);
  }
  box.appendChild(frag);
  if (list.length > shown) box.appendChild(el('p', 'hint', '仅显示前 ' + shown + ' 条，用搜索缩小范围。'));
  /* 图标后补：上面已经画出一整页可读的行，这里回来之后只重画一次。
     第二轮所有包都已在 iconAsked 里，取不到新东西，不会再触发重画。 */
  ensureIcons(list.slice(0, 120));
}
function addRule(pkg){
  /* 编辑器可能还没渲染过（从「应用」页直接点 +）：那时必须以磁盘内容为准，
     否则草稿只有这一行，保存就会把整个常驻列表清掉。 */
  var base = S.rulesEdited ? rulesBox.value : S.rules;
  var cur = base.replace(/\s+$/, '');
  var has = cur.split('\n').some(function (l){ return l.replace(/^\s+|\s+$/g, '') === pkg; });
  if (has) { snackbar(pkg + ' 已在常驻列表里'); return; }
  rulesBox.value = (cur ? cur + '\n' : '') + pkg + '\n';
  S.rulesEdited = true;
  updateRulesStat();
  goTab('rules');
  snackbar('已加入常驻列表，记得点「保存并同步」', 'ok');
}

/* ---------- 日志 ---------- */
function logLevel(line){
  if (/[❌⛔]|失败|超时|错误/.test(line)) return 'err';
  if (/[⚠️]|警告|未能|不存在|未找到/.test(line)) return 'warn';
  if (/✅|完成|就绪/.test(line)) return 'ok';
  return '';
}
function renderLog(){
  var box = document.getElementById('logBody');
  /* 内容没变就不重建这两三百个节点（自动刷新多数时候确实没新日志） */
  var sig = S.log.length + '\n' + (S.log[0] || '') + '\n' + (S.log[S.log.length - 1] || '');
  if (sig !== S.logSig) {
    var atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;   // 用户翻上去看历史时别拽回底部
    box.textContent = '';
    var frag = document.createDocumentFragment();
    S.log.forEach(function (line){
      var d = el('div', 'log-line', line);
      var lv = logLevel(line);
      if (lv) d.setAttribute('data-lvl', lv);
      frag.appendChild(d);
    });
    box.appendChild(frag);
    S.logSig = sig;
    if (atBottom) box.scrollTop = box.scrollHeight;
  }
  logStat.textContent = '显示末尾 ' + S.log.length + ' 行 · 缓冲 ' + bytesLabel(S.status.log_bytes) +
    ' · 上限 64KB，超出后只保留末尾 200 行' + (S.status.log_lines && n(S.status.log_lines) > S.log.length
    ? '（共 ' + S.status.log_lines + ' 行）' : '');
}

/* =========================================================
   4. 数据加载
   ========================================================= */
/* 取数与渲染分开：loadX 只写状态，renderAll 统一画一次。
   以前 status 与 env 各自 renderHero + renderOver，一次刷新要把三十来行列表重画两遍。 */
function loadStatus(){
  return call('status').then(function (r){
    if (!r.ok && !Object.keys(S.status).length) throw new Error(failText(r));
    S.status = parseKV(r.text);
    return r;
  });
}
function loadEnv(){
  return call('env').then(function (r){
    if (!r.ok) return r;
    S.env = parseKV(r.text);
    THEME.seedRaw = S.env.sys_seed_raw || '';
    THEME.seedSrc = S.env.sys_seed_src || 'none';
    /* SystemUI 的运行时 overlay 是第一优先种子：它就是系统正在用的那套色。
       解析失败（不是这个格式、阶梯不完整、明度不单调）就退回下一档，不报错也不画错。 */
    THEME.frro = S.env.sys_frro || '';
    THEME.frroSrc = S.env.sys_frro_src || '';
    THEME.frroParsed = THEME.frro ? parseFrro(THEME.frro) : null;
    THEME.frroOk = frroSeed(THEME.frroParsed) !== null;
    THEME.dark = (S.env.sys_dark === '0' || S.env.sys_dark === '1') ? S.env.sys_dark : '';
    THEME.darkSrc = S.env.sys_dark_src || 'none';
    /* 系统字体名是设备上读出来的，写死会抢在系统之前匹配上 */
    applyFont(S.env.sys_font, S.env.sys_font_pkg);
    applyPalette();                 // 系统强调色到手，重推一遍色板
    applyScheme();                  // 系统深浅与 WebView 不一致时以系统为准
    return r;
  });
}
/* 三份列表一起取：概览的三个数字、常驻编辑器、应用页的对照全靠它们，取一次三页共用 */
function loadLists(){
  return Promise.all([call('targets'), call('apps'), call('rules')]).then(function (rs){
    S.targets = rs[0].ok ? split(rs[0].text) : [];
    S.apps = rs[1].ok ? split(rs[1].text) : [];
    S.targetSet = null;                                   // 生效集合要重算
    /* 基线由取数这一层负责：以前它只在渲染常驻页时顺手赋值，
       结果概览页的「常驻 N」在没进过常驻页时数的是空串 */
    if (rs[2].ok) { S.rules = rs[2].text; S.rulesBase = rs[2].text; }
    else if (rs[2].code !== 1) snackbar(failText(rs[2]), 'bad');
    if (!rs[0].ok && rs[0].code !== 1) snackbar(failText(rs[0]), 'bad');
    return rs;
  });
}

/* 图标与显示名取自桌面自己的缓存（webui.sh icons 把 PNG 导进 webroot/icons/）。
   先画行、后补图标：这一步慢或压根没有缓存时，列表仍然是完整可读的，
   不该让一整页应用等一次 sqlite。 */
function loadIcons(pkgs){
  var todo = [], i;
  for (i = 0; i < pkgs.length && todo.length < 120; i++) {
    if (S.iconAsked[pkgs[i]]) continue;
    S.iconAsked[pkgs[i]] = 1;
    todo.push(pkgs[i]);
  }
  if (!todo.length) return Promise.resolve(false);
  return call('icons', todo.join(',')).then(function (r){
    if (!r.ok) return false;
    split(r.text).forEach(function (line){
      var f = line.split('\t');
      if (f.length >= 3 && f[0]) S.icons[f[0]] = { label: f[1] || '', src: f[2] };
    });
    return true;
  });
}

function ensureIcons(pkgs){
  return loadIcons(pkgs).then(function (got){
    if (!got) return;
    if (S.tab === 'apps') renderApps();
    else if (S.tab === 'rules') renderRulesResolved();
  });
}
function loadLog(){
  return call('log', String(S.tail)).then(function (r){
    S.log = r.ok ? split(r.text) : [];
    return r;
  });
}
function loadProps(){
  return call('props').then(function (r){
    S.props = r.ok ? split(r.text).map(function (line){
      var c = line.split('\t');
      return [c[0] || '', c[1] || '', c[2] || '', c[3] || ''];
    }) : [];
    return r;
  });
}
function split(text){
  return String(text == null ? '' : text).split('\n').filter(function (l){ return l.length > 0; });
}

/* 某一页还缺什么：lists 三页共用，log/props 各自独立。
   两条链并发时（连点两次「重新读取」）要共用同一个在途请求，
   并且只在成功后才记「已加载」——否则第二条链会以为数据到手、把空列表画出来。 */
var inflight = {};
function ensure(tab){
  var need = (tab === 'rules' || tab === 'apps' || tab === 'over') ? 'lists' : tab;
  if (S.loaded[need]) return Promise.resolve();
  if (inflight[need]) return inflight[need];

  var p = need === 'lists' ? loadLists() : (need === 'log' ? loadLog() : loadProps());
  inflight[need] = p.then(function (r){ S.loaded[need] = true; inflight[need] = null; return r; },
                         function (e){ inflight[need] = null; throw e; });
  return inflight[need];
}

function renderAll(){
  renderHero();
  if (S.tab === 'over') renderOver();
  else if (S.tab === 'rules') renderRules();
  else if (S.tab === 'apps') renderApps();
  else if (S.tab === 'log') renderLog();
  else if (S.tab === 'props') renderProps();
}

/* S.seq：连点两次「重新读取」时，先回来的那次不能把后回来的覆盖掉 */
function runChain(withBase){
  var seq = ++S.seq;
  busy(true, '读取中');

  var chain;
  if (withBase) {
    S.loaded = {};                                  // 整份刷新：列表缓存一并作废
    S.iconAsked = {};                               // 图标问过的名单也重开：新装的应用该被认出来
    /* 列表随基础信息一起取：英雄卡的三个数字在任何一页都要显示，
       以前只按当前页懒加载，进「日志」页时英雄卡就是一片 —，看着像坏了。 */
    chain = Promise.all([loadStatus(), loadEnv(), ensure(S.tab === 'log' || S.tab === 'props' ? 'lists' : S.tab)]);
  } else {
    chain = Promise.resolve();
  }

  chain.then(function (){ return ensure(S.tab); })
    .catch(function (e){ if (seq === S.seq) snackbar(String((e && e.message) || e), 'bad'); })
    .then(function (){
      busy(false);                                  // 迟到也要配平，否则遮罩永远关不掉
      if (seq !== S.seq || busyCount > 0) return;   // 有更新的请求在跑，让它来画
      renderAll();
      if (S.env.root_user && S.env.root_user !== '0') snackbar('exec 不是 root（uid ' + S.env.root_user + '）', 'bad');
    });
}

function refresh(){ runChain(true); }
function loadTab(){ runChain(false); }

/* =========================================================
   5. 写操作
   ========================================================= */
function b64(str){
  var bytes = new TextEncoder().encode(str), bin = '', chunk = 8192;
  for (var i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}

/* 写操作之后统一收口：缓存全部作废、重取、重画 */
function reloadAll(){
  S.loaded = {};
  S.iconAsked = {};
  return Promise.all([loadStatus(), loadEnv()]).then(function (){ return ensure(S.tab); });
}

function finishWrite(note){
  busy(false);
  renderAll();
  if (note.text) snackbar(note.text, note.tone);
}

function doSync(){
  busy(true, '同步中');
  var note = { text: '', tone: 'info' };
  call('sync').then(function (r){
    if (r.ok) {
      var kv = parseKV(r.text);
      note.text = kv.rc === '1' ? '内容一致，无需写入（' + kv.count + ' 个应用）' : '已写入 ' + kv.count + ' 个应用';
      note.tone = kv.rc === '2' ? 'bad' : 'ok';
    } else { note.text = failText(r); note.tone = 'bad'; }
    return reloadAll();
  }).catch(function (e){ note.text = String((e && e.message) || e); note.tone = 'bad'; })
    .then(function (){ finishWrite(note); });
}

function saveRules(){
  var text = rulesBox.value;
  if (text.length > 65536) { snackbar('常驻列表超过 64KB，请先精简', 'bad'); return; }
  var payload;
  try { payload = b64(text); } catch (e){ snackbar('内容编码失败', 'bad'); return; }
  if (!/^[A-Za-z0-9+/=]*$/.test(payload)) { snackbar('内容编码异常', 'bad'); return; }

  busy(true, '保存中');
  var note = { text: '', tone: 'info' };
  call('save-rules', payload).then(function (r){
    if (r.ok) {
      var kv = parseKV(r.text);
      note.text = kv.rc === '1' ? '已保存（生效列表内容未变化）' : '已保存并写入：' + kv.count + ' 个应用';
      note.tone = 'ok';
    } else { note.text = failText(r); note.tone = 'bad'; }
    return reloadAll();
  }).catch(function (e){ note.text = String((e && e.message) || e); note.tone = 'bad'; })
    .then(function (){
      /* 编辑器对齐到磁盘上那份：shell 会清 CR/BOM 并补末行换行，显示归一后的结果才算诚实 */
      if (note.tone === 'ok') { rulesBox.value = S.rules; S.rulesEdited = false; }
      finishWrite(note);
      updateRulesStat();
    });
}

function setPropsMasking(want){
  busy(true, '写入开关');
  var note = { text: '', tone: 'info' };
  call(want === 'off' ? 'props-off' : 'props-on').then(function (r){
    if (r.ok) {
      note.text = want === 'off' ? '已关闭开机属性伪装（本次开机内已写入的值不变）' : '已恢复开机属性伪装';
      note.tone = 'ok';
    } else { note.text = failText(r); note.tone = 'bad'; }
    return reloadAll();
  }).catch(function (e){ note.text = String((e && e.message) || e); note.tone = 'bad'; })
    .then(function (){ finishWrite(note); });
}

function applyPropsNow(){
  busy(true, '写入属性');
  var note = { text: '', tone: 'info' };
  call('props-apply').then(function (r){
    if (r.ok) {
      var kv = parseKV(r.text);
      note.text = kv.mismatch === '0' ? '已全部写入期望值' : '仍有 ' + kv.mismatch + ' 项不符（静态字段要重启才刷新）';
      note.tone = kv.mismatch === '0' ? 'ok' : 'warn';
    } else { note.text = failText(r); note.tone = 'bad'; }
    return reloadAll();
  }).catch(function (e){ note.text = String((e && e.message) || e); note.tone = 'bad'; })
    .then(function (){ finishWrite(note); });
}

function clearLog(){
  busy(true, '清空');
  var note = { text: '', tone: 'info' };
  call('clear-log').then(function (r){
    if (r.ok) { note.text = '日志缓冲已清空'; note.tone = 'ok'; S.logSig = ''; }
    else { note.text = failText(r); note.tone = 'bad'; }
    return reloadAll();
  }).catch(function (e){ note.text = String((e && e.message) || e); note.tone = 'bad'; })
    .then(function (){ finishWrite(note); });
}

/* 确认对话框 */
function confirm(title, text, okLabel){
  return new Promise(function (resolve){
    var d = document.getElementById('dialog');
    dlgTitle.textContent = title;
    dlgText.textContent = text;
    dlgOk.textContent = okLabel || '确定';
    d.hidden = false;
    function close(v){
      d.hidden = true;
      dlgOk.removeEventListener('click', yes);
      dlgCancel.removeEventListener('click', no);
      d.removeEventListener('click', backdrop);
      resolve(v);
    }
    function yes(){ close(true); }
    function no(){ close(false); }
    function backdrop(e){ if (e.target === d) close(false); }
    dlgOk.addEventListener('click', yes);
    dlgCancel.addEventListener('click', no);
    d.addEventListener('click', backdrop);
    dlgOk.focus();
  });
}

/* =========================================================
   6. 交互装配
   ========================================================= */
var tabsEl = document.getElementById('tabs');
function showTab(name){
  S.tab = name;
  Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'), function (t){
    var on = t.dataset.tab === name;
    t.classList.toggle('is-active', on);
    t.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  ['over', 'rules', 'apps', 'log', 'props'].forEach(function (k){
    document.getElementById('p-' + k).hidden = k !== name;
  });
  document.getElementById('p-about').hidden = name !== 'over';
}
function goTab(name){ showTab(name); loadTab(); }

function setAuto(on){
  S.auto = on;
  logAuto.setAttribute('aria-checked', on ? 'true' : 'false');
  if (S.autoTimer) { clearInterval(S.autoTimer); S.autoTimer = null; }
  if (on) S.autoTimer = setInterval(function (){
    if (document.hidden || S.tab !== 'log') return;
    /* 自动刷新走静默路径：不能每次都盖一层「读取中」遮罩 */
    loadLog().then(renderLog).catch(function (){ /* 失败就等下一次 tick，不打断 */ });
  }, 5000);
}

function wire(){
  btnSync.innerHTML = svg('sync') + '<span>立即同步</span>';
  btnReload.innerHTML = svg('reload') + '<span>重新读取</span>';
  btnSaveRules.innerHTML = svg('save') + '<span>保存并同步</span>';
  /* 底栏图标：ICON 表在脚本里，标记里写不了，统一在这里填 */
  Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'), function (t){
    t.querySelector('.ico').innerHTML = svg(t.dataset.icon);
  });
  btnLogRefresh.innerHTML = svg('reload') + '<span>刷新</span>';
  btnLogClear.innerHTML = svg('trash') + '<span>清空</span>';
  btnPropsApply.innerHTML = svg('check') + '<span>立即应用一次</span>';
  applyPalette();                         // env 回来前先用保存过的偏好/默认值
  applyScheme();

  btnSync.addEventListener('click', doSync);
  btnReload.addEventListener('click', refresh);
  btnSaveRules.addEventListener('click', saveRules);
  btnRevertRules.addEventListener('click', function (){ rulesBox.value = S.rulesBase; S.rulesEdited = false; updateRulesStat(); });
  btnRulesHead.addEventListener('click', function (){
    var head = '# TS-AUTO-ADD 常驻应用列表\n# 每行一个包名；以 # 开头的行是注释，空行会被忽略。\n# 这里列出的包名会始终并入目标列表（即使应用当前未安装）。\n\n';
    if (rulesBox.value.indexOf('# TS-AUTO-ADD') === 0) return;
    rulesBox.value = head + rulesBox.value;
    S.rulesEdited = true;
    updateRulesStat();
  });
  rulesBox.addEventListener('input', function (){ S.rulesEdited = true; updateRulesStat(); });

  tabsEl.addEventListener('click', function (e){
    var t = e.target.closest ? e.target.closest('.tab') : null;
    if (t) goTab(t.dataset.tab);
  });

  Array.prototype.forEach.call(document.querySelectorAll('#appsSeg button'), function (b){
    b.addEventListener('click', function (){
      S.appsSrc = b.dataset.src;
      document.querySelectorAll('#appsSeg button').forEach(function (x){ x.classList.toggle('is-active', x === b); });
      renderApps();
    });
  });
  btnOnlyMissing.addEventListener('click', function (){
    S.onlyMissing = !S.onlyMissing;
    btnOnlyMissing.setAttribute('aria-pressed', S.onlyMissing ? 'true' : 'false');
    btnOnlyMissing.classList.toggle('btn-filled', S.onlyMissing);
    btnOnlyMissing.classList.toggle('btn-outline', !S.onlyMissing);
    if (S.onlyMissing) S.appsSrc = 'apps';
    renderApps();
  });
  /* 搜索防抖：两百多行列表每敲一个字符重建一次没有必要 */
  var searchTimer = null;
  appsSearch.addEventListener('input', function (){
    var v = appsSearch.value.replace(/^\s+|\s+$/g, '');
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(function (){ S.search = v; renderApps(); }, 140);
  });

  Array.prototype.forEach.call(document.querySelectorAll('#logSeg button'), function (b){
    b.addEventListener('click', function (){
      S.tail = parseInt(b.dataset.n, 10) || 60;
      S.logSig = '';                                   // 行数变了，必须重画
      document.querySelectorAll('#logSeg button').forEach(function (x){ x.classList.toggle('is-active', x === b); });
      S.loaded.log = false;
      loadLog().then(renderLog).catch(function (e){ snackbar(String((e && e.message) || e), 'bad'); });
    });
  });
  btnLogRefresh.addEventListener('click', function (){
    loadLog().then(renderLog).catch(function (e){ snackbar(String((e && e.message) || e), 'bad'); });
  });
  btnLogClear.addEventListener('click', function (){
    confirm('清空日志缓冲？', '将删除 ' + (S.status.log_file || '/data/adb/ts_auto.log') +
      ' 的全部内容（约 ' + bytesLabel(S.status.log_bytes) + '）。模块后续写日志时会重建该文件，不影响同步逻辑。', '清空')
      .then(function (yes){ if (yes) clearLog(); });
  });
  logAuto.addEventListener('click', function (){ setAuto(!S.auto); });
  logAuto.addEventListener('keydown', function (e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setAuto(!S.auto); } });

  propsSwitch.addEventListener('click', function (){
    var want = propsSwitch.getAttribute('aria-checked') === 'true' ? 'off' : 'on';
    if (want === 'on') { setPropsMasking('on'); return; }
    confirm('关闭开机属性伪装？', '关闭只影响下一次开机：下次开机起不再重置 ro.build.type 等属性，' +
      '应用列表维护照旧。本次开机内已经写入的值不会被改回去。', '关闭').then(function (yes){ if (yes) setPropsMasking('off'); });
  });
  propsSwitch.addEventListener('keydown', function (e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); propsSwitch.click(); } });
  btnPropsApply.addEventListener('click', function (){
    confirm('立即写一次属性？', '等价于把开机阶段的重置现在就跑一遍。' +
      '已经被 Zygote 读进 Java 静态字段的值（如 Build.TYPE）不会因此刷新，要彻底生效仍需重启。', '写入')
      .then(function (yes){ if (yes) applyPropsNow(); });
  });
  btnPropsRefresh.addEventListener('click', function (){ S.loaded.props = false; loadTab(); });

  /* 系统深浅变了就跟着变。没有"手动档"，所以不需要判断是否处于 auto */
  var mq = matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', function (){
    if (THEME.dark === '') { applyScheme(); if (S.tab === 'over') renderOver(); }
  });
}

/* =========================================================
   7. 启动
   ========================================================= */
function showNoBridge(){
  banner.hidden = false;
  bannerIcon.innerHTML = svg('warn');
  bannerTitle.textContent = '当前管理器没有提供可用的 exec 桥接';
  bannerText.textContent = '模块本身仍在正常工作。命令行等价物：sh ' + MODDIR + '/webui.sh status；' +
    '界面每次刷新发的就是这个命令，参数换成 help 可以看全部子命令。';
  stateText.textContent = '无法连接';
  stateBadge.setAttribute('data-tone', 'bad');
  kicker.textContent = 'WebUI 桥接不可用';

  /* 把扫到的东西列出来：连不上时最需要的不是道歉，是"到底看见了什么" */
  var box = document.getElementById('overBody');
  box.textContent = '';
  var scan = BRIDGE_SCAN.map(function (b){
    return blk(b.name, 'exec=' + (b.exec ? '有' : '无'), b.exec ? 'ok' : 'warn',
      b.methods.length ? b.methods.join(' / ') : '没有可见方法');
  });
  box.appendChild(grp('带 exec 的注入对象 · ' + BRIDGE_SCAN.length, scan));
  if (!scan.length) box.appendChild(el('div', 'empty', '没有带 exec 的注入对象'));
  var extra = injectedGlobals().map(function (k){
    var o = null, ms = [];
    try { o = window[k]; ms = methodsOf(o); } catch (e){}
    return blk(k, typeof o, 'na', ms.length ? ms.join(' / ') : '无可见方法');
  });
  box.appendChild(grp('相对空白页多出的全局对象 · ' + extra.length + '（宿主注入的候选）', extra));
  busyCount = 0; document.getElementById('busy').hidden = true;
}

/* 标题栏：有 hideTitle 就交还给界面自己画；fullScreen 一类不动——
   把系统栏藏了会让人不好退出，不值得为观感冒这个险。 */
function adoptBridge(hit){
  BRIDGE = hit.obj; BRIDGE_KIND = hit.kind; BRIDGE_LABEL = hit.label;
  var dir = moduleDirFromBridge();
  if (dir) { MODDIR = dir; SH = 'sh ' + MODDIR + '/webui.sh'; }
  try { if (typeof BRIDGE.hideTitle === 'function') BRIDGE.hideTitle(); } catch (e){ /* 没有就算了 */ }
  /* 全屏沉浸：把状态栏与系统导航栏一起藏起来。唯一目的是**让底部那根白色手势手柄消失**
     —— 它是 SystemUI 画的，网页没有别的办法让它不出现。
     代价：本界面里看不到时钟与电量，系统栏要从屏幕边缘划一下才临时露出来；退出界面后一切照旧。
     要撤就删掉下面这一句调用。
     仍然不调 enableEdgeToEdge：那个开关会把握手用的系统栏 padding 归零、把页面画到最底边，
     反而让手势条浮在页面背景上；全屏已经把它整个藏掉了，不需要它。 */
  try { if (typeof BRIDGE.fullScreen === 'function') BRIDGE.fullScreen(true); } catch (e){ /* 没有就算了 */ }
  refresh();
}

function boot(){
  wire();

  // ?tab=over|rules|apps|log|props 直接进某一页（预览与排查用）；取数交给下面的 refresh
  var want = QUERY.get('tab');
  if (want && ['over', 'rules', 'apps', 'log', 'props'].indexOf(want) >= 0) showTab(want);

  if (DEMO) { refresh(); return; }

  /* 注入时机各家不同：有的在建好桥接对象之前就已经 DOMContentLoaded，
     所以先轮询几秒再判失败，别一上来就报"不支持"。 */
  var tries = 0;
  (function waitBridge(){
    var hit = BRIDGE ? { obj: BRIDGE, kind: BRIDGE_KIND, label: BRIDGE_LABEL } : pickBridge();
    if (hit) { adoptBridge(hit); return; }
    if (++tries < 20) { setTimeout(waitBridge, 200); return; }
    BRIDGE_SCAN = scanBridge();
    showNoBridge();
  })();
}
