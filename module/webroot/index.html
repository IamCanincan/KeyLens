/* 文本走系统字体：管理器的 WebView 里网页字体不生效（实测 @font-face 落地后
   仍旧退回系统字体）。图标族名不动 —— 组件把图标名当连字文本画，字体没落地
   就会把 "expand_more" 这种字面词画在界面上，那种失败肉眼可查。 */
:root{
  --md-sys-typescale-font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
  --inset-top: env(safe-area-inset-top, 0px);
  --inset-bottom: env(safe-area-inset-bottom, 0px);
  --bar-h: 64px;
  --nav-h: 80px;
  --gap: var(--md-sys-spacing-l, 16px);
  --line: var(--md-sys-color-outline-variant, #cac4d0);
}

html,body{margin:0;padding:0;background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface)}
body{min-height:100dvh;font-family:var(--md-sys-typescale-font-family);-webkit-font-smoothing:antialiased}

/* 壳：顶栏贴顶、底栏贴底，中间可滚动。
   用 dvh 不用 vh —— WebView 工具栏收展时 vh 会把底栏顶到屏幕外。 */
md-top-app-bar{position:sticky;top:0;z-index:20;padding-top:var(--inset-top)}
.view{
  box-sizing:border-box;width:100%;max-width:600px;margin:0 auto;
  padding:var(--gap) var(--gap) calc(var(--nav-h) + var(--inset-bottom) + 16px);
  min-height:calc(100dvh - var(--bar-h));
}
md-navigation-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:var(--inset-bottom)}
md-snackbar{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--inset-bottom) + 12px);z-index:60;transform:translateX(-50%)}

.stack{display:flex;flex-direction:column;gap:var(--gap)}
.card{display:block;padding:var(--md-sys-spacing-l, 16px)}
.sec{display:block}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.sec-h b{font-size:var(--md-sys-typescale-size-title-medium, 16px);font-weight:600;letter-spacing:-.1px}
.sec-i{font-family:var(--md-icon-font-family);font-size:20px;line-height:1;color:var(--md-sys-color-primary)}

/* 英雄区：一屏只有一个大数字，主色只给它和主行动按钮 */
.hero .hero-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero .ver{font-size:12px;color:var(--md-sys-color-on-surface-variant);font-variant-numeric:tabular-nums}
.hero-count{display:flex;align-items:flex-end;gap:10px;margin:10px 0 14px}
.hero-count .num{font-size:var(--md-sys-typescale-size-display-large, 57px);line-height:1;font-weight:600;
  letter-spacing:-2px;color:var(--md-sys-color-primary);font-variant-numeric:tabular-nums}
.hero-count .unit{font-size:14px;padding-bottom:8px}
.chip{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;
  background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface-variant)}
.chip-ok{background:var(--md-sys-color-surface-container-high)}
.chip-warn{background:var(--md-sys-color-warning-container, var(--md-sys-color-secondary-container));color:var(--md-sys-color-on-warning-container, inherit)}
.chip-bad{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container)}
.chip-none{background:var(--md-sys-color-surface-container);color:var(--md-sys-color-on-surface-variant)}

.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
/* 状态条：芯片与几段小字一行排开。之前只加了 DOM 没加样式，
   结果 "OhMyKeymint" 和版本号、条数直接连成一串读不断的字。 */
.strip-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.strip-k{font-size:13px;color:var(--md-sys-color-on-surface-variant);white-space:nowrap}
.strip-k + .strip-k::before{content:"·";margin-right:10px;color:var(--md-sys-color-outline)}
.sec-h b{min-width:0;overflow-wrap:anywhere}
md-list{display:block}
md-list-item[data-tone="bad"]{--md-list-item-supporting-text-color:var(--md-sys-color-on-error-container)}
md-list-item[data-tone="warn"]{outline:1px solid var(--md-sys-color-error-container);outline-offset:-2px;border-radius:12px}
.hint{font-size:12px;line-height:1.55;color:var(--md-sys-color-on-surface-variant);margin:10px 0 0}
.empty{font-size:13px;color:var(--md-sys-color-on-surface-variant);margin:6px 0 0}
.read-err{font-size:12px;line-height:1.55;margin:10px 0 0;color:var(--md-sys-color-on-error-container);background:var(--md-sys-color-error-container);padding:8px 10px;border-radius:8px}
.warn-card{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container)}
.warn-text{margin:0;font-size:14px;line-height:1.5}

/* 日志台：三列网格，图标列恒占宽 —— 没有级别的行也要把正文对齐到同一条竖线 */
.console{
  margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:12px;
  background:var(--md-sys-color-surface-container-lowest);
  font-family:ui-monospace, SFMono-Regular, Cutive Mono, Menlo, monospace;font-size:12px;line-height:1.7;
  max-height:46vh;overflow:auto;-webkit-overflow-scrolling:touch}
.console.tall{max-height:62vh}
.recent .console{min-height:150px;max-height:none}
.log-line{display:grid;grid-template-columns:auto 16px minmax(0,1fr);column-gap:8px;
  align-items:baseline;padding:3px 4px;border-radius:6px}
.log-time{color:var(--md-sys-color-on-surface-variant);white-space:nowrap}
.log-lvl{text-align:center;font-weight:700}
.log-msg{min-width:0;white-space:pre-wrap;word-break:break-all}
.log-line.t-bad{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container)}
.log-line.t-warn{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.log-line.t-ok .log-msg{color:var(--md-sys-color-primary)}

.sk{height:14px;border-radius:8px;background:var(--md-sys-color-surface-container-high);
  animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.45}to{opacity:1}}
</style>
</head>

  .btn {

    isolation: isolate;

    transition: none;

  .btn.togglable {

    padding: 0;
    gap: 0;

  .icon-glyph {

  }
  .icon-glyph[hidden] { display: none; }
  .btn:not(.togglable) .icon-slot { display: none; }

  .btn.xs::before,

  .btn::after {

  .btn::before {
    content: '';

    position: absolute;
    border-radius: 50%;
    background-color: currentColor;
